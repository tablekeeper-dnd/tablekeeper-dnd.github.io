<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Table Keeper DM Live</title>
<style>
:root{
  --bg:#13100e; --panel:#1e1916; --panel2:#272019; --line:#3a3027; --text:#ece2d0; --muted:#a8998a;
  --gold:#d9a94e; --gold2:#f0c873; --red:#d0533f; --green:#5fae6b; --blue:#5b8fd6; --purple:#a07ad6;
  --radius:10px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
h1,h2,h3,.serif{font-family:Georgia,"Times New Roman",serif;font-weight:600;letter-spacing:.2px}
h2{font-size:18px;margin:0 0 10px}
h3{font-size:15px;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{background:#15110f;border:1px solid var(--line);border-radius:7px;padding:6px 8px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--gold)}
textarea{resize:vertical;width:100%}
button{cursor:pointer;border:1px solid var(--line);background:var(--panel2);border-radius:7px;padding:6px 11px}
button:hover{border-color:var(--gold)}
button.primary{background:var(--gold);color:#1b140c;border-color:var(--gold);font-weight:600}
button.primary:hover{background:var(--gold2)}
button.danger{border-color:#6b2c23;color:#f0a596}
button.small{padding:2px 8px;font-size:12px}
button.icon{padding:2px 7px;line-height:1.2}
button:disabled{opacity:.5;cursor:default}
.muted{color:var(--muted)}
.hidden{display:none!important}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1}

/* Lock screen */
#lock{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 30%,#2a1f16,#0c0a09 70%);z-index:50}
.lockbox{width:360px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:26px;box-shadow:0 20px 60px #000a}
.lockbox h1{margin:0 0 4px;font-size:26px;color:var(--gold2)}
.lockbox label{display:block;margin:12px 0 4px;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.8px}
.lockbox input{width:100%}
.lockbox .err{color:#f0a596;min-height:20px;margin-top:8px;font-size:13px}

/* App layout */
#app{display:grid;grid-template-rows:auto auto 1fr;grid-template-columns:minmax(0,1fr);height:100vh}
header{display:flex;align-items:center;gap:14px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
header .title{font-size:20px;color:var(--gold2)}
header .sess{color:var(--muted)}
.tkback{color:var(--muted);text-decoration:none;font-size:13px;padding:6px 10px;border:1px solid var(--line);border-radius:7px}
.tkback:hover{color:var(--gold2);border-color:var(--gold)}
.lockbox a{text-decoration:none}
nav.tabs{display:flex;gap:4px;margin-left:16px}
nav.tabs button{background:transparent;border-color:transparent}
nav.tabs button.on{background:var(--panel2);border-color:var(--line);color:var(--gold2)}
#strip{border-bottom:1px solid var(--line);background:#181411;padding:6px 16px;display:flex;align-items:center;gap:10px;min-height:52px}
#strip .lbl{color:var(--muted);font-size:12px;white-space:nowrap}
#stripTrack{display:flex;gap:6px;overflow-x:auto;flex:1;min-width:0;padding:2px 0}
.body{display:grid;grid-template-columns:minmax(0,1fr) 390px;min-height:0}
main{overflow:auto;padding:16px}
aside{border-left:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0}

/* Party */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:12px}
.card .head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.card .sub{color:var(--muted);font-size:12px}
.stat{display:inline-block;background:#15110f;border:1px solid var(--line);border-radius:6px;padding:1px 7px;font-size:12px;margin-right:4px}
.hpbar{height:12px;border-radius:6px;background:#2b211b;overflow:hidden;margin:8px 0 4px;border:1px solid var(--line)}
.hpbar>div{height:100%;transition:width .3s}
.hprow{display:flex;align-items:center;gap:6px}
.hprow .hpnum{font-size:20px;font-family:Georgia,serif;min-width:90px}
.hprow input{width:56px}
.sect{margin-top:9px}
.sect .sl{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin-bottom:3px}
.pips{display:flex;align-items:center;gap:4px;margin:2px 0}
.pips .lv{width:24px;font-size:12px;color:var(--muted)}
.pip{width:15px;height:15px;border-radius:50%;border:2px solid var(--purple);cursor:pointer}
.pip.full{background:var(--purple)}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{background:#15110f;border:1px solid var(--line);border-radius:999px;padding:1px 4px 1px 9px;font-size:12px;display:inline-flex;align-items:center;gap:4px}
.chip.weapon{border-color:#6b4a2a}
.chip.cond{border-color:#6b2c23;color:#f0a596}
.chip .x{cursor:pointer;color:var(--muted);padding:0 4px;border-radius:50%}
.chip .x:hover{color:#fff;background:#3a2b22}
.addin{width:100%;margin-top:5px;font-size:12px;padding:4px 7px}
.meters{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.meter{font-size:11px;color:var(--muted)}
.meter .bar{display:flex;gap:2px;margin-top:2px;cursor:pointer}
.meter .bar span{flex:1;height:7px;border-radius:2px;background:#2b211b}
.meter .bar span.on{background:var(--green)}
.badge{font-size:11px;border-radius:999px;padding:1px 8px;border:1px solid var(--line)}
.badge.friendly{color:#9bdca5;border-color:#2f5a35}
.badge.hostile{color:#f0a596;border-color:#6b2c23}
.badge.neutral{color:#e6d38f;border-color:#5a4f2a}
.badge.dead{color:#aaa;border-color:#555}
.npcbg{white-space:pre-wrap;max-height:120px;overflow:auto;font-size:13px;margin-top:6px}
.empty{border:1px dashed var(--line);border-radius:var(--radius);padding:24px;text-align:center;color:var(--muted)}

/* Live panel */
.live{padding:12px;border-bottom:1px solid var(--line)}
#micBtn{width:100%;padding:10px;font-size:15px}
#micBtn.on{background:#6b2c23;border-color:var(--red);color:#fff}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#666;margin-right:6px}
.dot.on{background:var(--red);animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.35}}
.livestatus{font-size:12px;color:var(--muted);margin-top:7px;display:flex;justify-content:space-between;gap:6px}
.ptitle{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);padding:8px 12px 4px;display:flex;justify-content:space-between;align-items:center}
#transcript{flex:1 1 45%;overflow:auto;padding:0 12px 8px;font-size:13px;min-height:80px}
#transcript .ln{padding:2px 0;border-bottom:1px solid #221c18}
#transcript .ln.done{color:var(--muted)}
#transcript .tm{color:#6f6254;font-size:11px;margin-right:6px}
#interim{color:#7d6f60;font-style:italic}
.noteRow{padding:6px 12px;border-top:1px solid var(--line);display:flex;gap:6px}
.noteRow input{flex:1}
#feed{flex:1 1 40%;overflow:auto;padding:0 12px 10px;font-size:13px;min-height:80px}
.fe{display:flex;gap:6px;align-items:flex-start;padding:4px 0;border-bottom:1px solid #221c18}
.fe .ft{flex:1}
.fe.undone .ft{text-decoration:line-through;color:#6f6254}
.fe .why{color:var(--muted);font-size:12px}

/* Timeline */
.tl-wrap{overflow-x:auto;padding:8px 4px 16px;border:1px solid var(--line);border-radius:var(--radius);background:var(--panel)}
.tl{display:flex;align-items:stretch;min-height:300px;position:relative;padding:0 12px}
.tl-sess{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 10px;min-width:110px;position:relative}
.tl-sess .sbox{background:#2a2016;border:1px solid var(--gold);border-radius:9px;padding:6px 10px;text-align:center;font-size:12px;z-index:2;max-width:150px;cursor:default}
.tl-sess .sbox b{display:block;color:var(--gold2);font-family:Georgia,serif;font-size:14px}
.tl-ev{display:grid;grid-template-rows:1fr 24px 1fr;width:150px;flex:0 0 150px;position:relative}
.tl-ev::before,.tl-sess::before{content:"";position:absolute;left:0;right:0;top:50%;height:2px;background:var(--line);z-index:0}
.tl-ev .node{grid-row:2;justify-self:center;width:14px;height:14px;border-radius:50%;margin-top:5px;z-index:1;border:2px solid var(--bg)}
.tl-ev .stem{position:absolute;left:50%;width:2px;background:var(--line)}
.tl-ev.up .stem{top:calc(50% - 26px);height:26px}
.tl-ev.down .stem{top:50%;height:26px}
.evbox{border-radius:9px;padding:7px 9px;background:var(--panel2);border:1px solid var(--line);border-left:4px solid var(--c);cursor:pointer;font-size:12px;margin:0 5px;transition:transform .12s}
.evbox:hover{transform:translateY(-2px);border-color:var(--c)}
.evbox .et{font-weight:600;font-size:13px;line-height:1.25}
.evbox .em{color:var(--muted);font-size:11px;margin-top:2px}
.tl-ev.up .evbox{grid-row:1;align-self:end;margin-bottom:26px}
.tl-ev.down .evbox{grid-row:3;align-self:start;margin-top:0}
.mini{flex:0 0 auto;max-width:180px;padding:4px 8px;margin:0}
.mini .et{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#tip{position:fixed;z-index:60;max-width:320px;background:#0f0c0a;border:1px solid var(--gold);border-radius:10px;padding:10px 12px;box-shadow:0 10px 30px #000c;pointer-events:none;font-size:13px}
#tip .tt{font-family:Georgia,serif;font-size:16px;color:var(--gold2);margin:2px 0 4px}
#tip .tk{font-size:11px;text-transform:uppercase;letter-spacing:.8px}
#tip ul{margin:4px 0 0;padding-left:18px}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.fchip{border-radius:999px;padding:3px 10px;font-size:12px;border:1px solid var(--line);background:transparent;opacity:.45}
.fchip.on{opacity:1;border-color:var(--c);background:color-mix(in srgb,var(--c) 18%,transparent)}

/* Journey */
.jcard{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:var(--radius);padding:12px 14px;margin-bottom:10px}
.jcard .jt{font-family:Georgia,serif;font-size:17px;color:var(--gold2)}
.jcard .js{white-space:pre-wrap;margin-top:6px}
.story{white-space:pre-wrap;font-family:Georgia,serif;font-size:15px;line-height:1.6}
table.best{width:100%;border-collapse:collapse;font-size:13px}
table.best td,table.best th{border-bottom:1px solid var(--line);padding:5px 6px;text-align:left}
table.best th{color:var(--muted);font-weight:500;font-size:12px}

/* Settings */
.set{max-width:720px}
.set .card{margin-bottom:12px}
.set label{display:block;font-size:12px;color:var(--muted);margin:8px 0 3px}
.set input[type=text],.set input[type=password],.set select{width:100%}

/* Modal + toast */
#modal{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;z-index:70}
.mbox{background:var(--panel);border:1px solid var(--line);border-radius:14px;width:min(620px,94vw);max-height:90vh;overflow:auto;padding:18px}
.mbox .fgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px}
.mbox label{display:block;font-size:12px;color:var(--muted);margin-bottom:3px}
.mbox input,.mbox select,.mbox textarea{width:100%}
.mbox .full{grid-column:1/-1}
.mbox .acts{display:flex;justify-content:space-between;margin-top:14px;gap:8px}
#toasts{position:fixed;bottom:16px;left:16px;z-index:80;display:flex;flex-direction:column;gap:6px}
.toast{background:#0f0c0a;border:1px solid var(--gold);border-radius:9px;padding:8px 12px;max-width:420px;box-shadow:0 6px 20px #000a}
.toast.err{border-color:var(--red)}
.spin{display:inline-block;width:12px;height:12px;border:2px solid var(--gold);border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px;margin-right:5px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (max-width:1000px){.body{grid-template-columns:1fr}aside{border-left:0;border-top:1px solid var(--line);min-height:520px}#app{height:auto}}
</style>
</head>
<body>

<!-- LOCK SCREEN -->
<div id="lock">
  <div class="lockbox">
    <h1>Table Keeper</h1>
    <div class="muted">DM Live: the desktop Dungeon Master screen</div>
    <label for="lkCode">Campaign code</label>
    <input id="lkCode" autocomplete="off" placeholder="e.g. K7QM2X">
    <label for="lkPw">DM password</label>
    <input id="lkPw" type="password" autocomplete="current-password" placeholder="Same password as in Table Keeper">
    <div class="err" id="lkErr"></div>
    <button class="primary" id="lkGo" style="width:100%;margin-top:6px">Open campaign</button>
    <div class="muted" style="font-size:12px;margin-top:12px" id="lkHint"></div>
    <div style="margin-top:14px;font-size:13px"><a href="../" style="color:var(--gold2)">← Back to Table Keeper</a></div>
  </div>
</div>

<!-- APP -->
<div id="app" class="hidden">
  <header>
    <div class="title serif" id="hName">Campaign</div>
    <div class="sess" id="hSess">Session 1</div>
    <nav class="tabs" id="tabs">
      <button data-tab="party" class="on">Party</button>
      <button data-tab="npcs">NPCs</button>
      <button data-tab="timeline">Timeline</button>
      <button data-tab="journey">Journey</button>
      <button data-tab="settings">Settings</button>
    </nav>
    <div class="grow"></div>
    <a href="../" class="tkback" title="Open the main Table Keeper app">← Table Keeper</a>
    <button id="lockBtn" title="Lock">🔒 Lock</button>
  </header>
  <div id="strip"><span class="lbl">Latest events</span><div id="stripTrack"></div></div>
  <div class="body">
    <main id="main"></main>
    <aside>
      <div class="live">
        <button id="micBtn">🎙️ Start listening</button>
        <div class="livestatus"><span id="micState"><span class="dot"></span>Mic off</span><span id="aiState">AI idle</span></div>
        <div class="row" style="margin-top:8px">
          <button class="small" id="checkNow">⚡ Check now</button>
          <button class="small" id="dlTx">⬇ Transcript</button>
          <div class="grow"></div>
          <button class="small primary" id="endSess">End session</button>
        </div>
      </div>
      <div class="ptitle"><span>Live transcript</span><span id="txCount"></span></div>
      <div id="transcript"></div>
      <div class="noteRow"><input id="noteIn" placeholder="Type a note, e.g. Brakka takes 9 from the ghoul"><button id="noteAdd">Add</button></div>
      <div class="ptitle"><span>Changes made</span><span class="muted" style="text-transform:none;letter-spacing:0">undo anything wrong</span></div>
      <div id="feed"></div>
    </aside>
  </div>
</div>

<div id="tip" class="hidden"></div>
<div id="modal" class="hidden"><div class="mbox" id="mbox"></div></div>
<div id="toasts"></div>

<script>
'use strict';
/* ================= Helpers ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2, 10);
const norm = s => String(s || '').toLowerCase().replace(/[^a-z0-9 ]/g, '').replace(/\s+/g, ' ').trim();
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const num = (v, d = 0) => { const n = parseInt(v, 10); return isNaN(n) ? d : n; };
const hhmm = t => new Date(t).toLocaleTimeString('en-GB', {hour: '2-digit', minute: '2-digit'});
const dateStr = t => new Date(t).toLocaleDateString('en-GB', {day: 'numeric', month: 'short', year: 'numeric'});

function toast(msg, err) {
  const d = document.createElement('div');
  d.className = 'toast' + (err ? ' err' : '');
  d.textContent = msg;
  $('#toasts').appendChild(d);
  setTimeout(() => d.remove(), err ? 7000 : 3500);
}

const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { toast('Could not save: browser storage is full. Export a backup and end the session to clear the transcript.', true); return false; } },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};

const EVENT_TYPES = {
  plot:     {label: 'Plot',      icon: '📜', c: '#d9a94e'},
  combat:   {label: 'Combat',    icon: '⚔️', c: '#d0533f'},
  npc:      {label: 'NPC',       icon: '🗣️', c: '#5b8fd6'},
  loot:     {label: 'Loot',      icon: '💰', c: '#e3c34d'},
  location: {label: 'Location',  icon: '🗺️', c: '#5fae6b'},
  quest:    {label: 'Quest',     icon: '🎯', c: '#a07ad6'},
  rest:     {label: 'Rest',      icon: '🏕️', c: '#7fb3b0'},
  death:    {label: 'Death',     icon: '💀', c: '#9a9a9a'}
};
const SURV = ['food', 'water', 'warmth', 'sleep'];
const MODELS = [
  ['claude-sonnet-5-5', 'Claude Sonnet 5.5 (recommended)'],
  ['claude-haiku-5-5', 'Claude Haiku 5.5 (cheapest)'],
  ['claude-opus-5-5', 'Claude Opus 5.5 (most capable, priciest)']
];

/* ================= State (linked to Table Keeper) =================
   Players live in Table Keeper's own storage (tablekeeper.v1), so both apps
   always show the same party. DM Live keeps its extras (NPCs, timeline,
   journey, transcript) in tablekeeper.live.<campaignId>. */
const TK_KEY = 'tablekeeper.v1';
const TK_CONDS = ["Blinded","Charmed","Deafened","Exhaustion","Frightened","Grappled","Incapacitated","Invisible","Paralysed","Petrified","Poisoned","Prone","Restrained","Stunned","Unconscious","Concentrating","Inspired"];
let CODE = null, META = null, S = null;
let SET = LS.get('tablekeeper.live.settings', {apiKey: '', model: 'claude-sonnet-5-5', interval: 4});
let tab = 'party', tlFilter = new Set(Object.keys(EVENT_TYPES)), tlSearch = '', npcSearch = '';

function newState(name) {
  return {v: 2, name, survival: false, sessionNo: 1, sessionStart: null, players: [], extras: {}, npcs: [], timeline: [], journey: [], story: '', transcript: [], processed: 0, feed: []};
}
function canonCond(c) {
  c = String(c || '').trim(); if (!c) return '';
  const hit = TK_CONDS.find(x => x.toLowerCase() === c.toLowerCase());
  return hit || c[0].toUpperCase() + c.slice(1);
}
function tkLoad() { try { return JSON.parse(localStorage.getItem(TK_KEY) || 'null'); } catch (e) { return null; } }
function fromTK(tp) {
  const x = (S.extras || {})[tp.id] || {};
  const slots = {};
  (Array.isArray(tp.slots) ? tp.slots : []).forEach((s, i) => { if (s && s.max > 0) slots[i + 1] = {max: s.max, used: clamp(s.used || 0, 0, s.max)}; });
  return {id: tp.id, ex: !!tp.ex, name: tp.name || 'Hero', player: x.player || '', race: tp.race || '', cls: tp.cls || '', level: tp.lvl || 1, ac: tp.ac ?? 10,
    hp: tp.hp ?? 0, maxHp: tp.max || 1, tempHp: tp.temp || 0, gold: tp.gold || 0, notes: tp.notes || '', conditions: [...(tp.conds || [])],
    items: (tp.items || []).map(i => ({id: i.id || uid(), name: i.n || '', qty: i.q || 1, kind: i.k === 'weapon' ? 'weapon' : 'item', notes: i.note || ''})),
    slots, survival: x.survival || {food: 5, water: 5, warmth: 5, sleep: 5}};
}
function toTK(p, tp) {
  tp = tp || {id: p.id, speed: 30, abil: {str: 10, dex: 10, con: 10, int: 10, wis: 10, cha: 10}, conds: [], items: [], ex: false, slots: null};
  Object.assign(tp, {name: p.name, race: p.race, cls: p.cls, lvl: p.level, ac: p.ac, hp: p.hp, max: p.maxHp, temp: p.tempHp || 0, gold: p.gold || 0, notes: p.notes || '', ex: !!p.ex,
    conds: (p.conditions || []).map(canonCond).filter(Boolean),
    items: p.items.map(i => { const o = {id: i.id, n: i.name, q: i.qty}; if (i.kind === 'weapon') o.k = 'weapon'; if (i.notes) o.note = i.notes; return o; })});
  const anySlots = Object.values(p.slots).some(s => s.max > 0);
  if (anySlots || Array.isArray(tp.slots)) tp.slots = Array.from({length: 9}, (_, i) => p.slots[i + 1] ? {max: p.slots[i + 1].max, used: p.slots[i + 1].used} : {max: 0, used: 0});
  return tp;
}
function syncFromTK() {
  const tk = tkLoad(); if (!tk || !tk.camps) return false;
  const camp = tk.camps[CODE]; if (!camp) return false;
  META = (tk.core.camps || []).find(c => c.id === CODE) || META;
  if (META) S.name = META.name;
  S.players = (camp.players || []).map(fromTK);
  return true;
}
function writeTK() {
  const tk = tkLoad(); if (!tk || !tk.camps || !tk.camps[CODE]) return;
  const camp = tk.camps[CODE];
  const old = new Map((camp.players || []).map(p => [p.id, p]));
  camp.players = S.players.map(p => toTK(p, old.get(p.id)));
  try { localStorage.setItem(TK_KEY, JSON.stringify(tk)); } catch (e) { toast('Could not save the party: browser storage is full.', true); }
}
let saveTimer = null;
function save(now) {
  if (!CODE || !S) return;
  S.extras = S.extras || {};
  for (const p of S.players) S.extras[p.id] = {player: p.player || '', survival: p.survival};
  writeTK(); // party changes go to Table Keeper straight away (live tables pick them up)
  clearTimeout(saveTimer);
  const put = () => { const {players, ...rest} = S; LS.set('tablekeeper.live.' + CODE, rest); };
  if (now) put(); else saveTimer = setTimeout(put, 600);
}
function saveSettings() { LS.set('tablekeeper.live.settings', SET); }

// Table Keeper changed in another tab (e.g. a player on a live table updated their HP)
window.addEventListener('storage', e => {
  if (e.key !== TK_KEY || !S || !CODE) return;
  if (syncFromTK()) { renderAll(); }
});

/* ================= Lock screen: Table Keeper campaign code + DM password ================= */
const b64 = u8 => { let s = ''; for (let i = 0; i < u8.length; i += 8192) s += String.fromCharCode.apply(null, u8.subarray(i, i + 8192)); return btoa(s); };
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function deriveBits(pw, salt) {
  const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits']);
  return new Uint8Array(await crypto.subtle.deriveBits({name: 'PBKDF2', salt: unb64(salt), iterations: 150000, hash: 'SHA-256'}, km, 256));
}
async function verOf(bits) { return b64(new Uint8Array(await crypto.subtle.digest('SHA-256', bits))).slice(0, 24); }
const tkCamps = () => { const tk = tkLoad(); return (tk && tk.core && tk.core.camps) || []; };
const cleanCode = s => String(s || '').toUpperCase().replace(/[^A-Z0-9]/g, '');

function lockHint() {
  const cs = tkCamps(); const h = $('#lkHint');
  if (!cs.length) {
    h.innerHTML = 'There are no Table Keeper campaigns on this computer yet. Open <a href="../" style="color:var(--gold2)">Table Keeper</a>, go to <b>Dungeon Master</b> and create or open your campaign, then come back.';
    return;
  }
  h.innerHTML = 'Campaigns on this computer: ' + cs.map(c => `<a href="#" data-code="${esc(c.code)}" style="color:var(--gold2)">${esc(c.name)} (${esc(c.code)})</a>`).join(', ');
  h.querySelectorAll('[data-code]').forEach(a => a.onclick = ev => { ev.preventDefault(); $('#lkCode').value = a.dataset.code; $('#lkPw').focus(); });
  if (!$('#lkCode').value) { const tk = tkLoad(); const act = cs.find(c => c.id === tk?.core?.active) || cs[0]; $('#lkCode').value = act.code; }
}
[$('#lkCode'), $('#lkPw')].forEach(i => i.addEventListener('keydown', e => { if (e.key === 'Enter') $('#lkGo').click(); }));
$('#lkGo').onclick = async () => {
  const c = cleanCode($('#lkCode').value), pw = $('#lkPw').value, err = $('#lkErr');
  err.textContent = '';
  if (!c) return err.textContent = 'Enter the campaign code.';
  const meta = tkCamps().find(m => cleanCode(m.code) === c);
  if (!meta) return err.textContent = 'That campaign isn\'t on this computer. Open it in Table Keeper first (Dungeon Master → Open with code & password).';
  if (!meta.ver || !meta.salt) return err.textContent = 'Set a DM password for this campaign in Table Keeper first.';
  if (!pw) return err.textContent = 'Enter the DM password.';
  $('#lkGo').disabled = true; $('#lkGo').innerHTML = '<span class="spin"></span>Checking…';
  try {
    const bits = await deriveBits(pw, meta.salt);
    if (await verOf(bits) !== meta.ver) { $('#lkPw').value = ''; err.textContent = 'Wrong DM password for that campaign.'; return; }
    try { sessionStorage.setItem('tk.k.' + meta.id, b64(bits)); } catch (e) {} // keeps Table Keeper unlocked in this tab too
    openCampaign(meta);
  } catch (e) { err.textContent = 'Could not check the password: ' + e.message; }
  finally { $('#lkGo').disabled = false; $('#lkGo').textContent = 'Open campaign'; }
};
function openCampaign(meta) {
  CODE = meta.id; META = meta;
  S = Object.assign(newState(meta.name), LS.get('tablekeeper.live.' + CODE, {}) || {});
  syncFromTK();
  try { sessionStorage.setItem('dmlive:open', CODE); } catch (e) {}
  $('#lkPw').value = '';
  $('#lock').classList.add('hidden');
  $('#app').classList.remove('hidden');
  renderAll();
}
$('#lockBtn').onclick = () => {
  if (wantListen) stopMic();
  save(true);
  try { sessionStorage.removeItem('dmlive:open'); sessionStorage.removeItem('tk.k.' + CODE); } catch (e) {}
  CODE = null; S = null; META = null;
  $('#app').classList.add('hidden');
  $('#lock').classList.remove('hidden');
  lockHint();
};

/* ---------- Party ---------- */
function hpColour(f) { return f > .5 ? 'var(--green)' : f > .25 ? '#d9a94e' : 'var(--red)'; }
function partyHTML() {
  let h = `<div class="row" style="margin-bottom:12px"><h2 style="margin:0">Party</h2><div class="grow"></div>
    <button onclick="editPlayer()">＋ Add character</button>
    <button onclick="quickRest('short')">Short rest</button><button onclick="quickRest('long')">Long rest</button></div>`;
  if (!S.players.length) {
    return h + `<div class="empty">No characters in this campaign yet. Players who join your table in Table Keeper appear here automatically.<br><br><button class="primary" onclick="editPlayer()">Add your first character</button>
      &nbsp; <button onclick="loadDemo()">Load an example party to try it out</button></div>`;
  }
  h += '<div class="grid">';
  for (const p of S.players) h += playerCard(p);
  return h + '</div>';
}
function playerCard(p) {
  const f = p.maxHp ? p.hp / p.maxHp : 0;
  let slots = '';
  for (let L = 1; L <= 9; L++) {
    const s = p.slots[L]; if (!s || !s.max) continue;
    let pips = '';
    for (let i = 0; i < s.max; i++) {
      const full = i < s.max - s.used;
      pips += `<span class="pip ${full ? 'full' : ''}" title="Level ${L} slot: click to ${full ? 'use' : 'restore'}" onclick="slotClick('${p.id}',${L},${full ? 1 : -1})"></span>`;
    }
    slots += `<div class="pips"><span class="lv">L${L}</span>${pips}<span class="muted" style="font-size:11px;margin-left:4px">${s.max - s.used}/${s.max}</span></div>`;
  }
  const items = [...p.items].sort((a, b) => (b.kind === 'weapon') - (a.kind === 'weapon'));
  const itemChips = items.map(it => `<span class="chip ${it.kind === 'weapon' ? 'weapon' : ''}" title="${esc(it.notes || '')}">${it.kind === 'weapon' ? '⚔ ' : ''}${esc(it.name)}${it.qty > 1 ? ' ×' + it.qty : ''}<span class="x" onclick="removeItem('${p.id}','${esc(it.id)}')">×</span></span>`).join('');
  const conds = (p.conditions || []).map(c => `<span class="chip cond">${esc(c)}<span class="x" onclick="removeCond('${p.id}','${esc(c)}')">×</span></span>`).join('');
  let surv = '';
  if (S.survival) {
    surv = '<div class="sect"><div class="sl">Survival</div><div class="meters">' + SURV.map(k => {
      const v = p.survival?.[k] ?? 5;
      return `<div class="meter">${k[0].toUpperCase() + k.slice(1)} ${v}/5<div class="bar">${[1,2,3,4,5].map(i => `<span class="${i <= v ? 'on' : ''}" onclick="setSurv('${p.id}','${k}',${i === v ? i - 1 : i})"></span>`).join('')}</div></div>`;
    }).join('') + '</div></div>';
  }
  return `<div class="card">
    <div class="head"><div><h3 class="serif">${esc(p.name)}${p.ex ? ' <span class="badge" style="font-family:system-ui">Example</span>' : ''}</h3>
      <div class="sub">${esc([p.race, p.cls, p.level ? 'Lv ' + p.level : ''].filter(Boolean).join(' · '))}${p.player ? ' · played by ' + esc(p.player) : ''}</div></div>
      <div class="row" style="gap:4px"><span class="stat">AC ${esc(p.ac || '-')}</span><span class="stat">💰 ${esc(p.gold || 0)} gp</span><button class="icon small" onclick="editPlayer('${p.id}')" title="Edit">✎</button></div></div>
    <div class="hpbar"><div style="width:${clamp(f * 100, 0, 100)}%;background:${hpColour(f)}"></div></div>
    <div class="hprow"><span class="hpnum">${p.hp}<span class="muted" style="font-size:14px"> / ${p.maxHp}</span>${p.tempHp ? `<span style="font-size:13px;color:var(--blue)"> +${p.tempHp}</span>` : ''}</span>
      <input type="number" min="0" id="amt-${p.id}" placeholder="0">
      <button class="small" onclick="hpBtn('${p.id}',-1)">Damage</button><button class="small" onclick="hpBtn('${p.id}',1)">Heal</button></div>
    ${conds ? `<div class="sect chips">${conds}</div>` : ''}
    ${slots ? `<div class="sect"><div class="sl">Spell slots</div>${slots}</div>` : ''}
    ${surv}
    <div class="sect"><div class="sl">Weapons &amp; items</div><div class="chips">${itemChips || '<span class="muted" style="font-size:12px">Nothing yet</span>'}</div>
      <input class="addin" placeholder="Add item (Enter). Start with * for a weapon" onkeydown="if(event.key==='Enter'){addItemManual('${p.id}',this.value);this.value=''}"></div>
    ${p.notes ? `<div class="sect"><div class="sl">Notes</div><div style="font-size:13px;white-space:pre-wrap">${esc(p.notes)}</div></div>` : ''}
  </div>`;
}
function P(id) { return S.players.find(p => p.id === id); }
function hpBtn(id, sign) {
  const v = num($('#amt-' + id).value, 0); if (!v) return;
  const e = applyChange({type: 'hp', target: P(id).name, amount: sign * v, reason: 'manual'}, 'you');
  if (e) pushFeed([e]);
}
function slotClick(id, L, amt) { const e = applyChange({type: 'spell_slot', target: P(id).name, level: L, amount: amt, reason: 'manual'}, 'you'); if (e) pushFeed([e]); }
function setSurv(id, k, v) { const p = P(id); const cur = p.survival?.[k] ?? 5; const e = applyChange({type: 'survival', target: p.name, stat: k, amount: v - cur, reason: 'manual'}, 'you'); if (e) pushFeed([e]); }
function removeItem(id, itemId) { const p = P(id); const it = p.items.find(i => i.id === itemId); if (!it) return; const e = applyChange({type: 'item_remove', target: p.name, item: it.name, qty: it.qty, reason: 'manual'}, 'you'); if (e) pushFeed([e]); }
function removeCond(id, c) { const e = applyChange({type: 'condition_remove', target: P(id).name, condition: c, reason: 'manual'}, 'you'); if (e) pushFeed([e]); }
function addItemManual(id, v) {
  v = v.trim(); if (!v) return;
  const weapon = v.startsWith('*'); if (weapon) v = v.slice(1).trim();
  const m = v.match(/^(.*?)\s*[x×]\s*(\d+)$/i);
  const e = applyChange({type: 'item_add', target: P(id).name, item: m ? m[1] : v, qty: m ? num(m[2], 1) : 1, kind: weapon ? 'weapon' : 'item', reason: 'manual'}, 'you');
  if (e) pushFeed([e]);
}
function quickRest(kind) {
  const e = applyChange({type: 'rest', kind, reason: 'manual'}, 'you');
  const ev = addEvent({type: 'rest', title: kind === 'long' ? 'Long rest' : 'Short rest', detail: kind === 'long' ? 'The party took a long rest. HP and spell slots restored.' : 'The party took a short rest.'}, true);
  pushFeed([e, ev]);
}

/* ---------- Timeline ---------- */
function evMatches(e) {
  if (!tlFilter.has(e.type)) return false;
  const q = norm(tlSearch); if (!q) return true;
  return norm([e.title, e.detail, (e.who || []).join(' '), (e.monsters || []).map(m => m.name).join(' ')].join(' ')).includes(q);
}
function timelineHTML() {
  const chips = Object.entries(EVENT_TYPES).map(([k, t]) => `<button class="fchip ${tlFilter.has(k) ? 'on' : ''}" style="--c:${t.c}" onclick="toggleF('${k}')">${t.icon} ${t.label}</button>`).join('');
  return `<div class="row" style="margin-bottom:10px"><h2 style="margin:0">Timeline</h2><input id="tlSearch" placeholder="Search events, people, monsters" value="${esc(tlSearch)}" style="width:260px"><div class="grow"></div><button onclick="editEvent()">＋ Add event</button></div>
    <div class="filters">${chips}</div>
    <div class="tl-wrap"><div id="tlBody">${tlTrackHTML()}</div></div>
    <div class="muted" style="font-size:12px;margin-top:8px">Hover a box to see what happened. Click a box to edit or delete it.</div>`;
}
function toggleF(k) { tlFilter.has(k) ? tlFilter.delete(k) : tlFilter.add(k); renderMain(); }
function tlTrackHTML() {
  const evs = S.timeline.filter(evMatches);
  if (!S.timeline.length) return `<div class="empty" style="margin:20px">The timeline fills up as you play. Start listening, or add an event yourself.</div>`;
  if (!evs.length) return `<div class="empty" style="margin:20px">Nothing matches those filters.</div>`;
  let h = '<div class="tl">', last = null, i = 0;
  for (const e of evs) {
    if (e.session !== last) {
      last = e.session;
      const j = S.journey.find(x => x.session === e.session);
      h += `<div class="tl-sess"><div class="sbox" ${j ? `data-jid="${j.id}"` : ''}><b>Session ${e.session}</b>${j ? esc(j.title) : (e.session === S.sessionNo ? 'In progress' : '')}</div></div>`;
      i = 0;
    }
    const t = EVENT_TYPES[e.type] || EVENT_TYPES.plot;
    h += `<div class="tl-ev ${i++ % 2 ? 'down' : 'up'}"><div class="stem"></div>
      <div class="evbox" style="--c:${t.c}" data-eid="${e.id}" onclick="editEvent('${e.id}')"><div class="et">${t.icon} ${esc(e.title)}</div><div class="em">${hhmm(e.ts)}${e.monsters?.length ? ' · ' + e.monsters.length + ' monster type' + (e.monsters.length > 1 ? 's' : '') : ''}</div></div>
      <div class="node" style="background:${t.c}"></div></div>`;
  }
  return h + '</div>';
}
function renderStrip() {
  const evs = S.timeline.slice(-14);
  $('#stripTrack').innerHTML = evs.length ? evs.map(e => {
    const t = EVENT_TYPES[e.type] || EVENT_TYPES.plot;
    return `<div class="evbox mini" style="--c:${t.c}" data-eid="${e.id}" onclick="editEvent('${e.id}')"><div class="et">${t.icon} ${esc(e.title)}</div></div>`;
  }).join('') : '<span class="muted" style="font-size:12px">Events will appear here as they happen.</span>';
  const t = $('#stripTrack'); t.scrollLeft = t.scrollWidth;
}

/* Tooltip on hover */
document.addEventListener('mouseover', e => {
  const box = e.target.closest('[data-eid],[data-jid]');

      <div class="tt">${esc(ev.title)}</div>${ev.detail ? `<div>${esc(ev.detail)}</div>` : ''}
      ${ev.who?.length ? `<div style="margin-top:6px"><span class="muted">Involved:</span> ${esc(ev.who.join(', '))}</div>` : ''}
      ${ev.monsters?.length ? `<div style="margin-top:6px"><span class="muted">Monsters:</span><ul>${ev.monsters.map(m => `<li>${esc(m.name)}${m.count > 1 ? ' ×' + m.count : ''}${m.outcome ? ` <span class="muted">(${esc(m.outcome)})</span>` : ''}</li>`).join('')}</ul></div>` : ''}`;
  } else {
    const j = S.journey.find(x => x.id === box.dataset.jid); if (!j) return;
    tip.innerHTML = `<div class="tk muted">Session ${j.session} · ${dateStr(j.date)}</div><div class="tt">${esc(j.title)}</div><div>${esc(j.summary.length > 600 ? j.summary.slice(0, 600) + '…' : j.summary)}</div>`;
  }
  tip.classList.remove('hidden');
  const r = box.getBoundingClientRect(), tw = tip.offsetWidth, th = tip.offsetHeight;

/* ---------- Journey ---------- */
function journeyHTML() {
  let h = `<div class="row" style="margin-bottom:12px"><h2 style="margin:0">The journey so far</h2><div class="grow"></div>
    <button onclick="writeStory()" id="storyBtn">✨ Write "story so far"</button><button onclick="editJourney()">＋ Add session summary</button></div>`;
  if (S.story) h += `<div class="card" style="margin-bottom:14px"><div class="sl muted" style="font-size:11px;text-transform:uppercase;letter-spacing:.8px">Story so far</div><div class="story">${esc(S.story)}</div></div>`;
  if (!S.journey.length) h += `<div class="empty">Session summaries appear here when you press <b>End session</b>.</div>`;
  for (const j of [...S.journey].sort((a, b) => b.session - a.session)) {
    h += `<div class="jcard"><div class="row"><div class="jt grow">Session ${j.session}: ${esc(j.title)}</div><span class="muted" style="font-size:12px">${dateStr(j.date)}</span><button class="icon small" onclick="editJourney('${j.id}')">✎</button></div><div class="js">${esc(j.summary)}</div></div>`;
  }
  // Monsters encountered
  const best = {};
  for (const e of S.timeline) for (const m of (e.monsters || [])) {
    const k = norm(m.name); if (!k) continue;
    best[k] = best[k] || {name: m.name, count: 0, sessions: new Set(), outcomes: new Set()};
    best[k].count += m.count || 1; best[k].sessions.add(e.session); if (m.outcome) best[k].outcomes.add(m.outcome);
  }
  const rows = Object.values(best).sort((a, b) => b.count - a.count);
  if (rows.length) h += `<h2 style="margin-top:20px">Monsters encountered</h2><div class="card"><table class="best"><tr><th>Monster</th><th>Total</th><th>Sessions</th><th>Outcomes</th></tr>
    ${rows.map(r => `<tr><td>${esc(r.name)}</td><td>${r.count}</td><td>${[...r.sessions].join(', ')}</td><td class="muted">${esc([...r.outcomes].join(', '))}</td></tr>`).join('')}</table></div>`;
  return h;
}

    <label>Model</label><select id="sModel">${MODELS.map(([v, l]) => `<option value="${v}" ${SET.model === v ? 'selected' : ''}>${l}</option>`).join('')}<option value="custom" ${MODELS.some(m => m[0] === SET.model) ? '' : 'selected'}>Other (type below)</option></select>
    <input type="text" id="sModelCustom" placeholder="model id" value="${MODELS.some(m => m[0] === SET.model) ? '' : esc(SET.model)}" style="margin-top:6px">
    <label>Check the transcript every (minutes)</label><input type="number" id="sInt" min="1" max="30" value="${SET.interval}" style="width:120px">
    <div class="row" style="margin-top:10px"><button id="sTest">Test the key</button><span id="sTestOut" class="muted"></span></div>
  </div>

    <div class="muted" style="font-size:13px;margin-top:4px">DM Live's notes are stored in this browser. Export a backup after each session, and use it to move them to another computer.</div>
    <div class="row" style="margin-top:10px"><button id="sExport">⬇ Export backup</button><label class="row" style="margin:0"><button onclick="document.getElementById('sImport').click()">⬆ Import backup</button></label><input type="file" id="sImport" accept=".json" class="hidden"></div>
  </div>
  <div class="card"><h3 class="serif">Clear DM Live notes</h3>
    <div class="muted" style="font-size:13px;margin-top:4px">Deletes this campaign's NPCs, timeline, journey and transcript from DM Live. The party in Table Keeper is not touched.</div>
    <div class="row" style="margin-top:10px"><button class="danger" id="sDel">Clear DM Live notes</button></div>
  </div></div>`;
}
function bindSettings() {
  $('#sNo').onchange = e => { S.sessionNo = Math.max(1, num(e.target.value, S.sessionNo)); save(); renderAll(); };
  $('#sSurv').onchange = e => { S.survival = e.target.checked; save(); };
  $('#sKey').onchange = e => { SET.apiKey = e.target.value.trim(); saveSettings(); toast('API key saved in this browser'); };
  const setModel = () => { const v = $('#sModel').value; SET.model = v === 'custom' ? ($('#sModelCustom').value.trim() || 'claude-sonnet-5-5') : v; saveSettings(); };
  $('#sModel').onchange = setModel; $('#sModelCustom').onchange = () => { $('#sModel').value = 'custom'; setModel(); };
  $('#sInt').onchange = e => { SET.interval = clamp(num(e.target.value, 4), 1, 30); saveSettings(); };
  $('#sTest').onclick = async () => {
    $('#sTestOut').innerHTML = '<span class="spin"></span>Testing…';
    try { const t = await askClaude('Reply with the single word: ready', 'Are you there?', 20); $('#sTestOut').textContent = '✅ Working (' + t.trim().slice(0, 30) + ')'; }
    catch (e) { $('#sTestOut').textContent = '❌ ' + e.message; }
  };
  $('#sExport').onclick = () => download(`${S.name} backup ${new Date().toISOString().slice(0, 10)}.json`, JSON.stringify({dmlive: 2, campaign: META?.code, state: S}, null, 1), 'application/json');
  $('#sImport').onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    try {
      const d = JSON.parse(await f.text()); const st = d.state || d;
      if (!Array.isArray(st.players)) throw new Error('Not a DM Live backup');
      if (!confirm('Replace this campaign\'s DM Live notes AND its party in Table Keeper with the backup?')) return;
      S = Object.assign(newState(S.name), st, {name: S.name}); save(true); renderAll(); toast('Backup imported');
    } catch (err) { toast('Import failed: ' + err.message, true); }
  };
  $('#sDel').onclick = () => {
    if (prompt(`Type the campaign code (${META?.code}) to clear DM Live's notes for this campaign`) !== META?.code) return;
    const keep = {name: S.name, players: S.players, extras: S.extras};
    S = Object.assign(newState(S.name), keep); save(true); renderAll(); toast('DM Live notes cleared');
  };
}
function download(name, text, type) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], {type: type || 'text/plain'}));
  a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

  Object.assign(p, {name, player: fv('m-player').trim(), race: fv('m-race').trim(), cls: fv('m-cls').trim(), level: num(fv('m-level'), 1), ac: num(fv('m-ac'), 10),

    conditions: fv('m-cond').split(',').map(canonCond).filter(Boolean)});

/* ================= Change engine (AI + manual) with undo ================= */
function findPlayer(name) {
  const n = norm(name); if (!n) return null;
  const first = n.split(' ')[0];
  return S.players.find(p => norm(p.name) === n) || S.players.find(p => p.player && norm(p.player) === n) ||
    S.players.find(p => norm(p.name).split(' ')[0] === first) || S.players.find(p => p.player && norm(p.player).split(' ')[0] === first) ||
    S.players.find(p => norm(p.name).includes(n) || n.includes(norm(p.name)));
}
function findNpc(name) {
  const n = norm(name); if (!n) return null;
  return S.npcs.find(x => norm(x.name) === n) || S.npcs.find(x => norm(x.name).split(' ')[0] === n.split(' ')[0] && n.split(' ')[0].length > 2);
}
function findItem(p, name) { const n = norm(name); return p.items.find(i => norm(i.name) === n) || p.items.find(i => norm(i.name).includes(n) || n.includes(norm(i.name))); }

// Returns a feed entry {id, ts, text, why, src, undo} or null
function applyChange(c, src) {
  const why = c.reason && c.reason !== 'manual' ? c.reason : '';
  const E = (text, undo) => ({id: uid(), ts: Date.now(), text, why, src, undo});
  const t = c.type;
  if (['hp', 'set_hp', 'temp_hp', 'spell_slot', 'item_add', 'item_remove', 'condition_add', 'condition_remove', 'survival', 'gold'].includes(t)) {
    const p = findPlayer(c.target);
    if (!p) { if (src === 'ai') console.warn('No player match', c); return null; }
    if (t === 'hp' || t === 'set_hp') {
      let amt = t === 'set_hp' ? num(c.value, p.hp) - p.hp : num(c.amount, 0);
      if (!amt) return null;
      const b = p.hp, bt = p.tempHp || 0;
      if (amt < 0) { const dmg = -amt, fromT = Math.min(bt, dmg); p.tempHp = bt - fromT; p.hp = clamp(p.hp - (dmg - fromT), 0, p.maxHp); }
      else p.hp = clamp(p.hp + amt, 0, p.maxHp);
      const dH = p.hp - b, dT = (p.tempHp || 0) - bt;
      if (!dH && !dT) return null;
      return E(`${amt < 0 ? '🩸' : '💚'} ${p.name} ${amt < 0 ? 'takes ' + (-amt) : 'heals ' + amt} (HP ${b} → ${p.hp}${dT ? ', temp ' + bt + ' → ' + p.tempHp : ''})`, {k: 'hp', pid: p.id, dH, dT});
    }
    if (t === 'temp_hp') { const b = p.tempHp || 0; p.tempHp = Math.max(b, num(c.value ?? c.amount, 0)); if (p.tempHp === b) return null; return E(`🛡️ ${p.name} gains temp HP (${b} → ${p.tempHp})`, {k: 'hp', pid: p.id, dH: 0, dT: p.tempHp - b}); }
    if (t === 'spell_slot') {
      const L = num(c.level, 0), s = p.slots[L]; if (!s) return null;
      const b = s.used; s.used = clamp(s.used + num(c.amount, 1), 0, s.max); const d = s.used - b; if (!d) return null;
      return E(`✨ ${p.name} ${d > 0 ? 'uses' : 'regains'} ${Math.abs(d)} level ${L} slot${Math.abs(d) > 1 ? 's' : ''} (${s.max - s.used}/${s.max} left)${c.spell ? ': ' + c.spell : ''}`, {k: 'slot', pid: p.id, L, d});
    }
    if (t === 'item_add') {
      const qty = Math.max(1, num(c.qty, 1)); const name = String(c.item || '').trim(); if (!name) return null;
      let it = p.items.find(i => norm(i.name) === norm(name));
      if (it) it.qty += qty; else { it = {id: uid(), name, qty, kind: c.kind === 'weapon' ? 'weapon' : 'item', notes: c.notes || ''}; p.items.push(it); }
      return E(`🎒 ${p.name} gets ${name}${qty > 1 ? ' ×' + qty : ''}`, {k: 'itemAdd', pid: p.id, name: it.name, qty});
    }
    if (t === 'item_remove') {
      const it = findItem(p, c.item); if (!it) return null;
      const qty = Math.min(it.qty, Math.max(1, num(c.qty, 1))); it.qty -= qty;
      const copy = Object.assign({}, it, {qty});
      if (it.qty <= 0) p.items = p.items.filter(i => i !== it);
      return E(`📤 ${p.name} loses ${it.name}${qty > 1 ? ' ×' + qty : ''}`, {k: 'itemRem', pid: p.id, item: copy});
    }
    if (t === 'condition_add') {
      const cnd = canonCond(c.condition); if (!cnd || p.conditions.some(x => x.toLowerCase() === cnd.toLowerCase())) return null;
      p.conditions.push(cnd); return E(`⚠️ ${p.name} is ${cnd.toLowerCase()}`, {k: 'condAdd', pid: p.id, cnd});
    }
    if (t === 'condition_remove') {
      const cnd = String(c.condition || '').trim().toLowerCase(); const had = p.conditions.find(x => x.toLowerCase() === cnd); if (!had) return null;
      p.conditions = p.conditions.filter(x => x !== had); return E(`✅ ${p.name} is no longer ${had.toLowerCase()}`, {k: 'condRem', pid: p.id, cnd: had});
    }
    if (t === 'survival') {
      const k = String(c.stat || '').toLowerCase(); if (!SURV.includes(k)) return null;
      p.survival = p.survival || {food: 5, water: 5, warmth: 5, sleep: 5};
      const b = p.survival[k] ?? 5; p.survival[k] = clamp(b + num(c.amount, 0), 0, 5); const d = p.survival[k] - b; if (!d) return null;
      return E(`🍖 ${p.name} ${k} ${b} → ${p.survival[k]}`, {k: 'surv', pid: p.id, stat: k, d});
    }
    if (t === 'gold') {
      const d = num(c.amount, 0); if (!d) return null; const b = p.gold || 0; p.gold = b + d;
      return E(`💰 ${p.name} ${d > 0 ? 'gains' : 'spends'} ${Math.abs(d)} gp (${b} → ${p.gold})`, {k: 'gold', pid: p.id, d});
    }
  }
  if (t === 'rest') {
    const before = S.players.map(p => ({pid: p.id, hp: p.hp, slots: JSON.parse(JSON.stringify(p.slots)), conds: [...p.conditions], surv: p.survival ? {...p.survival} : null}));
    if (c.kind === 'long') {
      S.players.forEach(p => { p.hp = p.maxHp; Object.values(p.slots).forEach(s => s.used = 0); p.conditions = p.conditions.filter(c => c !== 'Unconscious'); if (S.survival && p.survival) p.survival.sleep = 5; });
      return E('🏕️ Long rest: HP and spell slots restored for everyone', {k: 'rest', before});
    }
    return E('☕ Short rest taken (adjust HP for hit dice yourself)', {k: 'none'});
  }
  if (t === 'npc_add') {
    const name = String(c.name || '').trim(); if (!name) return null;
    const ex = findNpc(name);
    if (ex) {
      const old = {...ex, items: [...(ex.items || [])]};
      ['role', 'location', 'background'].forEach(f => { if (c[f] && !ex[f]) ex[f] = c[f]; });
      if (c.attitude) ex.attitude = c.attitude;
      (c.items || []).forEach(i => { if (!ex.items.some(x => norm(x) === norm(i))) ex.items.push(i); });
      if (c.notes) ex.notes = (ex.notes ? ex.notes + '\n' : '') + c.notes;
      return E(`🗣️ Updated NPC ${ex.name}`, {k: 'npcRestore', old});
    }
    const n = {id: uid(), name, role: c.role || '', location: c.location || '', attitude: ['friendly', 'neutral', 'hostile'].includes(c.attitude) ? c.attitude : 'neutral',
      status: 'alive', background: c.background || '', items: Array.isArray(c.items) ? c.items : [], notes: c.notes || '', firstSeen: S.sessionNo};
    S.npcs.push(n);
    return E(`🗣️ New NPC: ${name}${n.role ? ' (' + n.role + ')' : ''}`, {k: 'npcAdd', id: n.id});
  }
  if (t === 'npc_update') {
    const n = findNpc(c.name); if (!n) return null;
    const old = {...n, items: [...(n.items || [])]}; const f = c.field, v = c.value;
    if (f === 'notes' || f === 'background') n[f] = (n[f] ? n[f] + '\n' : '') + v;
    else if (f === 'items_add') { if (!n.items.some(x => norm(x) === norm(v))) n.items.push(v); }
    else if (f === 'items_remove') n.items = n.items.filter(x => norm(x) !== norm(v));
    else if (['attitude', 'status', 'location', 'role'].includes(f)) n[f] = v;
    else return null;
    return E(`🗣️ ${n.name}: ${f.replace('_', ' ')} → ${String(v).slice(0, 80)}`, {k: 'npcRestore', old});
  }
  return null;
}
function addEvent(ev, manual) {
  if (!ev || !ev.title) return null;
  const e = {id: uid(), ts: Date.now(), session: S.sessionNo, type: EVENT_TYPES[ev.type] ? ev.type : 'plot', title: String(ev.title).slice(0, 60), detail: ev.detail || '',
    who: Array.isArray(ev.who) ? ev.who : [], monsters: Array.isArray(ev.monsters) ? ev.monsters.map(m => ({name: m.name, count: num(m.count, 1), outcome: m.outcome || ''})).filter(m => m.name) : []};
  S.timeline.push(e);
  return {id: uid(), ts: Date.now(), text: `${EVENT_TYPES[e.type].icon} Timeline: ${e.title}`, why: '', src: manual ? 'you' : 'ai', undo: {k: 'event', id: e.id}};
}
function pushFeed(entries) {
  entries = entries.filter(Boolean); if (!entries.length) return;

function undo(fid) {
  const f = S.feed.find(x => x.id === fid); if (!f || f.undone) return;
  const u = f.undo, p = u.pid ? P(u.pid) : null;
  switch (u.k) {
    case 'hp': if (p) { p.hp = clamp(p.hp - u.dH, 0, p.maxHp); p.tempHp = Math.max(0, (p.tempHp || 0) - u.dT); } break;
    case 'slot': if (p && p.slots[u.L]) p.slots[u.L].used = clamp(p.slots[u.L].used - u.d, 0, p.slots[u.L].max); break;
    case 'itemAdd': if (p) { const it = p.items.find(i => i.name === u.name); if (it) { it.qty -= u.qty; if (it.qty <= 0) p.items = p.items.filter(i => i !== it); } } break;
    case 'itemRem': if (p) { const it = p.items.find(i => i.name === u.item.name); if (it) it.qty += u.item.qty; else p.items.push(u.item); } break;
    case 'condAdd': if (p) p.conditions = p.conditions.filter(c => c !== u.cnd); break;
    case 'condRem': if (p && !p.conditions.includes(u.cnd)) p.conditions.push(u.cnd); break;
    case 'surv': if (p) p.survival[u.stat] = clamp(p.survival[u.stat] - u.d, 0, 5); break;
    case 'gold': if (p) p.gold = (p.gold || 0) - u.d; break;
    case 'rest': u.before.forEach(b => { const q = P(b.pid); if (q) { q.hp = b.hp; q.slots = b.slots; q.conditions = b.conds; if (b.surv) q.survival = b.surv; } }); break;
    case 'npcAdd': S.npcs = S.npcs.filter(n => n.id !== u.id); break;
    case 'npcRestore': { const i = S.npcs.findIndex(n => n.id === u.old.id); if (i >= 0) S.npcs[i] = u.old; break; }
    case 'event': S.timeline = S.timeline.filter(e => e.id !== u.id); break;
  }
  f.undone = true; save(); renderAll();
}
function renderFeed() {
  const fd = $('#feed');
  const list = S.feed.slice(-120).reverse();
  fd.innerHTML = list.length ? list.map(f => `<div class="fe ${f.undone ? 'undone' : ''}"><span class="tm muted" style="font-size:11px">${hhmm(f.ts)}</span>
    <div class="ft">${esc(f.text)}${f.why ? `<div class="why">${esc(f.why)}</div>` : ''}${f.src === 'you' ? '' : ''}</div>
    ${f.undone || !f.undo || f.undo.k === 'none' ? '' : `<button class="small" onclick="undo('${f.id}')">Undo</button>`}</div>`).join('')
    : '<div class="muted" style="font-size:13px;padding:6px 0">Changes from the AI and from your clicks show up here.</div>';
}

let rec = null, wantListen = false, interim = '', nextCheck = 0, busy = false, failCount = 0;
function addLine(text) {
  text = String(text || '').trim(); if (!text) return;
  S.transcript.push({t: Date.now(), x: text});
  save(); renderTranscript();
}
function renderTranscript() {
  const box = $('#transcript'); if (!box || !S) return;
  const atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 40;
  const start = Math.max(0, S.transcript.length - 250);
  box.innerHTML = (start ? `<div class="muted" style="font-size:12px;padding:4px 0">${start} earlier lines hidden (still saved)</div>` : '') +
    S.transcript.slice(start).map((l, i) => `<div class="ln ${start + i < S.processed ? 'done' : ''}"><span class="tm">${hhmm(l.t)}</span>${esc(l.x)}</div>`).join('') +
    (interim ? `<div id="interim">${esc(interim)}</div>` : '') +
    (!S.transcript.length && !interim ? '<div class="muted" style="font-size:13px;padding:6px 0">Press <b>Start listening</b>, or type notes below. Greyed lines have already been read by the AI.</div>' : '');
  if (atBottom) box.scrollTop = box.scrollHeight;
  const words = S.transcript.reduce((a, l) => a + l.x.split(/\s+/).length, 0);
  $('#txCount').textContent = words ? words.toLocaleString('en-GB') + ' words' : '';
}
function renderMicState() {
  $('#micBtn').classList.toggle('on', wantListen);
  $('#micBtn').textContent = wantListen ? '⏸ Stop listening' : '🎙️ Start listening';
  $('#micState').innerHTML = `<span class="dot ${wantListen ? 'on' : ''}"></span>${wantListen ? 'Listening' : 'Mic off'}`;
}
function startMic() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return toast('Live transcription needs Google Chrome or Microsoft Edge.', true);
  if (!SET.apiKey) toast('Listening, but the AI is off until you add your API key in Settings.', true);
  rec = new SR(); rec.lang = 'en-GB'; rec.continuous = true; rec.interimResults = true;
  rec.onresult = e => {
    let im = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const r = e.results[i];
      if (r.isFinal) addLine(r[0].transcript); else im += r[0].transcript;
    }
    interim = im; renderTranscript();
  };
  rec.onerror = e => {
    if (e.error === 'not-allowed' || e.error === 'service-not-allowed') { wantListen = false; renderMicState(); toast('Microphone permission was blocked. Allow it from the padlock icon in the address bar.', true); }
    else if (e.error === 'network') toast('Speech service unreachable. Check the internet connection.', true);
  };
  rec.onend = () => { interim = ''; if (wantListen) setTimeout(() => { try { rec.start(); } catch (err) {} }, 250); };
  try { rec.start(); } catch (err) {}
  wantListen = true;
  if (!S.sessionStart) { S.sessionStart = Date.now(); save(); }
  nextCheck = Date.now() + SET.interval * 60000;
  renderMicState(); renderAll();
}
function stopMic() { wantListen = false; try { rec && rec.stop(); } catch (e) {} renderMicState(); }

/* ================= Claude API ================= */
async function askClaude(system, user, maxTokens) {
  if (!SET.apiKey) throw new Error('Add your Anthropic API key in Settings first');
  const r = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {'content-type': 'application/json', 'x-api-key': SET.apiKey, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true'},
    body: JSON.stringify({model: SET.model || 'claude-sonnet-5-5', max_tokens: maxTokens || 4000, system, messages: [{role: 'user', content: user}]})
  });
  if (!r.ok) {
    let msg = 'HTTP ' + r.status;
    try { const j = await r.json(); msg = j.error?.message || msg; } catch (e) {}
    if (r.status === 401) msg = 'The API key was rejected. Check it in Settings.';
    if (r.status === 429) msg = 'Rate limited by the API. Will try again shortly.';
    throw new Error(msg);
  }
  const j = await r.json();
  return (j.content || []).filter(b => b.type === 'text').map(b => b.text).join('');
}
function parseJSON(t) {
  t = String(t || '').replace(/```(?:json)?/gi, '');
  const a = t.indexOf('{'), b = t.lastIndexOf('}');
  if (a < 0 || b < a) throw new Error('The AI reply was not JSON');
  return JSON.parse(t.slice(a, b + 1));
}
function stateSummary() {
  const pl = S.players.map(p => {
    const slots = Object.entries(p.slots).filter(([, s]) => s.max).map(([L, s]) => `L${L} ${s.max - s.used}/${s.max}`).join(', ');
    return `- ${p.name}${p.player ? ' (played by ' + p.player + ')' : ''}: ${[p.race, p.cls, p.level ? 'level ' + p.level : ''].filter(Boolean).join(' ')}; HP ${p.hp}/${p.maxHp}${p.tempHp ? ' +' + p.tempHp + ' temp' : ''}; gold ${p.gold || 0}` +
      (slots ? `; slots left ${slots}` : '') + (p.conditions?.length ? `; conditions: ${p.conditions.join(', ')}` : '') +
      `; items: ${p.items.map(i => i.name + (i.qty > 1 ? ' x' + i.qty : '')).join(', ') || 'none'}` +
      (S.survival ? `; survival food ${p.survival?.food ?? 5}/5 water ${p.survival?.water ?? 5}/5 warmth ${p.survival?.warmth ?? 5}/5 sleep ${p.survival?.sleep ?? 5}/5` : '');
  }).join('\n');
  const np = S.npcs.map(n => `- ${n.name}: ${[n.role, n.location, n.attitude, n.status !== 'alive' ? n.status : ''].filter(Boolean).join(', ')}`).join('\n');
  const tl = S.timeline.filter(e => e.session === S.sessionNo).slice(-10).map(e => `- [${e.type}] ${e.title}`).join('\n');
  return `CAMPAIGN: ${S.name}, session ${S.sessionNo}\n\nPLAYER CHARACTERS:\n${pl || '(none)'}\n\nKNOWN NPCS:\n${np || '(none)'}\n\nTIMELINE EVENTS ALREADY LOGGED THIS SESSION:\n${tl || '(none)'}`;
}
const SYS_LIVE = `You are the live note-taker for a Dungeons & Dragons 5e Dungeon Master. You receive the current game state and a new chunk of an automatic speech-to-text transcript of the table. The transcript has no speaker labels, contains errors, mishearings of fantasy names, crosstalk and out-of-character chat. Lines starting [DM note] were typed by the DM and are reliable.

Your job: work out what CHANGED in the game during the NEW chunk only, and return JSON. Be conservative: only record things that clearly happened in the game. Ignore rules discussion, jokes, hypotheticals ("if I attack…"), and anything already reflected in the state or timeline. Match names to the listed characters and NPCs even if misspelt in the transcript. Never invent HP numbers: if damage is described without a number, do not change HP.

Return ONLY a JSON object, no prose:
{"changes":[ ... ], "events":[ ... ]}

Change objects (use the exact player-character name from the state as "target"):
{"type":"hp","target":"Name","amount":-7,"reason":"short why"}   negative = damage, positive = healing
{"type":"set_hp","target":"Name","value":14,"reason":"..."}       when someone states current HP
{"type":"temp_hp","target":"Name","value":5,"reason":"..."}
{"type":"spell_slot","target":"Name","level":2,"amount":1,"spell":"Misty Step","reason":"..."}  amount 1 = slot used, -1 = slot regained
{"type":"item_add","target":"Name","item":"Silver key","qty":1,"kind":"item|weapon","notes":"where it came from","reason":"..."}
{"type":"item_remove","target":"Name","item":"Healing potion","qty":1,"reason":"used/lost/given away"}
{"type":"gold","target":"Name","amount":25,"reason":"..."}   negative = spent
{"type":"condition_add","target":"Name","condition":"poisoned","reason":"..."}
{"type":"condition_remove","target":"Name","condition":"poisoned","reason":"..."}
{"type":"rest","kind":"short|long","reason":"..."}
{"type":"npc_add","name":"NPC name","role":"who they are","location":"where","attitude":"friendly|neutral|hostile","background":"what was learned about them","items":["..."],"notes":"..."}
{"type":"npc_update","name":"NPC name","field":"notes|background|attitude|status|location|role|items_add|items_remove","value":"..."}  status is alive|dead|missing
SURVIVAL_LINE

Event objects for the visual timeline (only meaningful moments, usually 0-4 per chunk):
{"type":"plot|combat|npc|loot|location|quest|rest|death","title":"max 6 words","detail":"1-3 sentences of what happened","who":["names involved"],"monsters":[{"name":"Goblin","count":3,"outcome":"defeated|fled|ongoing|spared"}]}
Use "combat" for fights and always list the monsters fought. If a fight continues from an earlier chunk, do not log a new combat event unless it ends or something notable happens.

If nothing changed, return {"changes":[],"events":[]}.`;

async function processChunk(force) {
  if (busy || !S) return;
  const end = S.transcript.length;
  const lines = S.transcript.slice(S.processed, end);
  if (!lines.length) { if (force) toast('Nothing new to check'); nextCheck = Date.now() + SET.interval * 60000; return; }
  if (!SET.apiKey) { if (force) toast('Add your Anthropic API key in Settings to turn on the AI', true); return; }
  busy = true; $('#checkNow').disabled = true;
  const ctx = S.transcript.slice(Math.max(0, S.processed - 8), S.processed).map(l => `[${hhmm(l.t)}] ${l.x}`).join('\n');
  const user = `${stateSummary()}\n\nEARLIER TRANSCRIPT (already processed, context only, do NOT re-apply):\n${ctx || '(start of session)'}\n\nNEW TRANSCRIPT CHUNK (process this):\n${lines.map(l => `[${hhmm(l.t)}] ${l.x}`).join('\n')}`;
  const sys = SYS_LIVE.replace('SURVIVAL_LINE', S.survival ? '{"type":"survival","target":"Name","stat":"food|water|warmth|sleep","amount":-1,"reason":"..."}  scale 0-5, 5 = fine; lower when they go without, raise when they eat/drink/warm up/sleep' : '');
  try {
    const out = parseJSON(await askClaude(sys, user, 3000));
    const entries = [];
    for (const c of (out.changes || [])) { try { const e = applyChange(c, 'ai'); if (e) entries.push(e); } catch (err) { console.warn(err); } }
    for (const ev of (out.events || [])) { const e = addEvent(ev); if (e) entries.push(e); }
    S.processed = Math.max(S.processed, end);
    failCount = 0;
    pushFeed(entries); save(); renderAll();
    if (force && !entries.length) toast('Checked: no changes found');
  } catch (err) {
    failCount++;
    toast('AI check failed: ' + err.message, true);
  } finally {
    busy = false; $('#checkNow').disabled = false;
    nextCheck = Date.now() + SET.interval * 60000 * Math.min(4, 2 ** failCount);
  }
}
