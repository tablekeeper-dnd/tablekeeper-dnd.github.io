/* Hover cards for timeline boxes and session markers */
const tip=document.createElement("div");tip.className="dl-tip";tip.hidden=true;document.body.appendChild(tip);
let tipFor=null;
function showTip(box,sticky){
  const c=S.camps[S.core.active],L=c&&c.live;if(!L)return;
  if(box.dataset.eid){
    const ev=L.timeline.find(x=>x.id===box.dataset.eid);if(!ev)return;const t=EVT[ev.type]||EVT.plot;
    tip.innerHTML=`<div class="dl-tip-k" style="color:${t.c}">${t.icon} ${t.label} · Session ${ev.session} · ${hhmm(ev.ts)}</div><div class="dl-tip-t">${esc(ev.title)}</div>${ev.detail?`<div>${esc(ev.detail)}</div>`:""}
      ${ev.who&&ev.who.length?`<div class="dl-tip-r"><span>Involved:</span> ${esc(ev.who.join(", "))}</div>`:""}
      ${ev.monsters&&ev.monsters.length?`<div class="dl-tip-r"><span>Monsters:</span><ul>${ev.monsters.map(m=>`<li>${esc(m.name)}${m.count>1?" ×"+m.count:""}${m.outcome?` <span>(${esc(m.outcome)})</span>`:""}</li>`).join("")}</ul></div>`:""}
      ${sticky?`<div class="dl-tip-a"><button class="btn" data-act="dlEv" data-eid2="${ev.id}">Edit</button><button class="btn ghost" data-act="dlTipX">Close</button></div>`:""}`;
  }else if(box.dataset.jid){
    const j=L.journey.find(x=>x.id===box.dataset.jid);if(!j)return;
    tip.innerHTML=`<div class="dl-tip-k">Session ${j.session} · ${dstr(j.date)}</div><div class="dl-tip-t">${esc(j.title)}</div><div>${esc(j.summary.length>600?j.summary.slice(0,600)+"…":j.summary)}</div>`;
  }else return;
  tip.hidden=false;tip.classList.toggle("sticky",!!sticky);tipFor=box;
  const r=box.getBoundingClientRect(),tw=tip.offsetWidth,th=tip.offsetHeight;
  let y=r.bottom+8;if(y+th>innerHeight-8)y=r.top-th-8;
  tip.style.left=clamp(r.left+r.width/2-tw/2,8,innerWidth-tw-8)+"px";tip.style.top=Math.max(8,y)+"px";
}
function hideTip(){tip.hidden=true;tipFor=null;tip.classList.remove("sticky")}
document.addEventListener("mouseover",e=>{
  if(tip.classList.contains("sticky"))return;
  const box=e.target.closest(".dl-ev,[data-jid]");
  if(!box){if(!e.target.closest(".dl-tip"))hideTip();return}
  if(box!==tipFor)showTip(box,false);
});
addEventListener("scroll",()=>{if(!tip.classList.contains("sticky"))hideTip()},{passive:true,capture:true});

/* ---- Journey ---- */
function journeyHTML(L){
  let h=`<div class="dl-sec-h"><h2>The journey so far</h2><span></span><button class="btn" data-act="dlStory" id="dlStoryBtn">✨ Write "story so far"</button><button class="btn gold" data-act="dlJ">+ Summary</button></div>`;
  if(L.story)h+=`<div class="dl-card"><span class="lbl dl-lbl">Story so far</span><div class="dl-story">${esc(L.story)}</div></div>`;
  if(!L.journey.length)h+=`<div class="empty"><h2>No sessions yet</h2><p>A summary of each session appears here when you press <b>End session</b>.</p></div>`;
  for(const j of L.journey.slice().sort((a,b)=>b.session-a.session))
    h+=`<div class="dl-card dl-j"><div class="dl-j-h"><b>Session ${j.session}: ${esc(j.title)}</b><span>${dstr(j.date)}</span><button class="linkbtn" data-act="dlJ" data-jid2="${j.id}">Edit</button></div><div class="dl-story">${esc(j.summary)}</div></div>`;
  const best={};
  for(const e of L.timeline)for(const m of (e.monsters||[])){const k=nrm(m.name).replace(/s$/,"");if(!k)continue;best[k]=best[k]||{name:m.name,count:0,s:new Set(),o:new Set()};best[k].count+=m.count||1;best[k].s.add(e.session);if(m.outcome)best[k].o.add(m.outcome)}
  const rows=Object.values(best).sort((a,b)=>b.count-a.count);
  if(rows.length)h+=`<h2 class="dl-h2">Monsters encountered</h2><div class="dl-card"><table class="dl-best"><tr><th>Monster</th><th>Total</th><th>Sessions</th><th>Outcomes</th></tr>${rows.map(r=>`<tr><td>${esc(r.name)}</td><td class="num">${r.count}</td><td class="num">${[...r.s].join(", ")}</td><td>${esc([...r.o].join(", "))}</td></tr>`).join("")}</table></div>`;
  return h;
}

const pick=a=>a[Math.floor(Math.random()*a.length)];
function wpick(list){const t=list.reduce((a,x)=>a+x.w,0);let r=Math.random()*t;for(const x of list){if((r-=x.w)<0)return x}return list[0]}
function genItem(k){

  if(k==="weapon"){
    let m=wpick(WEAPON_MAGIC);let w=pick(m.only?GEN_WEAPONS.filter(x=>m.only.includes(x[0])):GEN_WEAPONS);
    const base=[`Damage: ${w[1]}`,`Properties: ${w[2]}`,`Weight: ${w[3]} · Cost: ${w[4]}`];
    const name=m.rar==="mundane"?`${pick(m.flav)} ${w[0].toLowerCase()}`.replace(/^./,c=>c.toUpperCase()):`${m.pre}${w[0]}${m.suf||""}`;
    return {name,type:"Weapon ("+w[0].toLowerCase()+")",rarity:m.rar,effect:m.fx,stats:[...(m.st||[]),...base],kind:"weapon"};
  }
  if(k==="camp"){const p=pick(GEN_AVERNUS);return {name:p[0],type:p[1],rarity:p[2],effect:p[3],stats:p[4],kind:/^Weapon/.test(p[1])?"weapon":"item",camp:true}}

}

const MUS=Object.assign({vol:.6,mix:.5},lsGet("tablekeeper.music")||{});
let AC=null,MASTER=null,VERB=null,WHITE=null,BROWN=null,curMus=null;
function audio(){
  if(!AC){
    AC=new (window.AudioContext||window.webkitAudioContext)();
    const comp=AC.createDynamicsCompressor();comp.threshold.value=-14;comp.ratio.value=4;comp.connect(AC.destination);
    MASTER=AC.createGain();MASTER.gain.value=MUS.vol;MASTER.connect(comp);
    VERB=AC.createConvolver();VERB.buffer=impulse(3.2);const vg=AC.createGain();vg.gain.value=.45;VERB.connect(vg);vg.connect(MASTER);
    WHITE=nbuf(false);BROWN=nbuf(true);
  }
  if(AC.state==="suspended")AC.resume();
  return AC;
}
function nbuf(brown){const len=AC.sampleRate*4,b=AC.createBuffer(1,len,AC.sampleRate),d=b.getChannelData(0);let last=0;for(let i=0;i<len;i++){const w=Math.random()*2-1;if(brown){last=(last+.02*w)/1.02;d[i]=last*3.5}else d[i]=w}return b}
function impulse(sec){const len=AC.sampleRate*sec,b=AC.createBuffer(2,len,AC.sampleRate);for(let c=0;c<2;c++){const d=b.getChannelData(c);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.5)}return b}
function mkScene(lvl=1){
  const t=AC.currentTime,out=AC.createGain();out.gain.setValueAtTime(0,t);out.gain.linearRampToValueAtTime(lvl,t+1.5);out.connect(MASTER);
  const send=AC.createGain();send.gain.setValueAtTime(0,t);send.gain.linearRampToValueAtTime(1,t+1.5);send.connect(VERB);
  const mus=AC.createGain(),amb=AC.createGain();mus.connect(out);amb.connect(out);
  const X={out,send,mus,amb,nodes:[],timers:[]};mixOf(X);return X;
}
function mixOf(X){X.mus.gain.value=Math.min(1,MUS.mix*2);X.amb.gain.value=Math.min(1,(1-MUS.mix)*2)}
function outTo(X,bus,node,wet){node.connect(bus);if(wet){const g=AC.createGain();g.gain.value=wet;node.connect(g);g.connect(X.send)}}
function tone(X,bus,o){
  const {type="sine",f,t,a=.01,d=.5,v=.2,f2,glide,lp,wet=.2,vib}=o;
  const osc=AC.createOscillator();osc.type=type;osc.frequency.setValueAtTime(f,t);if(f2)osc.frequency.exponentialRampToValueAtTime(f2,t+(glide||d));
  if(vib){const l=AC.createOscillator(),lg=AC.createGain();l.frequency.value=vib[0];lg.gain.value=vib[1];l.connect(lg);lg.connect(osc.frequency);l.start(t);l.stop(t+a+d+.1)}

function nburst(X,bus,o){

function bed(X,o){
  const {brown=false,type="lowpass",f=500,q=.7,v=.2,lfo,flfo,wet=0,bus}=o;

function drone(X,ms,o={}){const {type="sine",v=.04,lp=500,wet=.3}=o;ms.forEach(m=>{const osc=AC.createOscillator();osc.type=type;osc.frequency.value=mf(m);osc.detune.value=(Math.random()-.5)*10;const fl=AC.createBiquadFilter();fl.type="lowpass";fl.frequency.value=lp;const g=AC.createGain();g.gain.value=v;osc.connect(fl);fl.connect(g);outTo(X,X.mus,g,wet);osc.start();X.nodes.push(osc)})}
function run(X,stepSec,onStep,events){
  let next=AC.currentTime+.2,step=0,evT=AC.currentTime+.1;
  const tick=()=>{const h=AC.currentTime+1.2;
    if(onStep)while(next<h){onStep(step,next);next+=stepSec;step++}
    while(evT<h){for(const [rate,fn] of events||[])if(Math.random()<rate*.1){const tt=evT+Math.random()*.1;fn.length>=2?fn(X,tt):fn(tt)}evT+=.1}};

function stopMusic(){
  if(!curMus)return;const X=curMus.X,t=AC.currentTime;X.timers.forEach(clearInterval);
  [X.out,X.send].forEach(g=>{g.gain.cancelScheduledValues(t);g.gain.setValueAtTime(g.gain.value,t);g.gain.linearRampToValueAtTime(0,t+1.2)});
  setTimeout(()=>{X.nodes.forEach(n=>{try{n.stop()}catch(e){}});try{X.out.disconnect();X.send.disconnect()}catch(e){}},1500);
  curMus=null;
}
function playMusic(id){
  try{audio()}catch(e){toastMsg("This browser can't play the music");return}
  if(curMus&&curMus.id===id){stopMusic();render();return}
  stopMusic();const sc=SCENES.find(x=>x.id===id);if(!sc)return;
  const X=mkScene(sc.lvl||1);sc.start(X);curMus={id,X,name:sc.name};render();
}

function plByName(name){
  const ps=dmCamp().players,n=nrm(name);if(!n)return null;const f=n.split(" ")[0];
  return ps.find(p=>nrm(p.name)===n)||ps.find(p=>nrm(p.name).split(" ")[0]===f)||ps.find(p=>nrm(p.name).includes(n)||n.includes(nrm(p.name)));
}
function monByName(name){
  const C=dmCamp().combat;if(!C.active)return null;const n=nrm(name),ms=C.list.filter(e=>e.kind==="m");
  return ms.find(e=>nrm(e.name)===n)||ms.find(e=>nrm(e.name).startsWith(n)&&e.hp>0)||ms.find(e=>nrm(e.base||"")===n&&e.hp>0);
}
function npcByName(name){const L=DL(),n=nrm(name);if(!n)return null;const f=n.split(" ")[0];return L.npcs.find(x=>nrm(x.name)===n)||(f.length>2?L.npcs.find(x=>nrm(x.name).split(" ")[0]===f):null)}
function canonCond(c){c=String(c||"").trim();if(!c)return "";return CONDS.find(x=>x.toLowerCase()===c.toLowerCase())||c[0].toUpperCase()+c.slice(1)}
const RECAP_SKIP=["hp","set_hp","temp_hp","spell_slot","condition_add","condition_remove","rest","combat_start","combat_end","monster_hp","survival"];
function applyChange(c){
  const L=DL(),why=c.reason||"",t=c.type;

  const E=(text,undo)=>({id:uid(),ts:Date.now(),text,why,undo});

    const m=monByName(c.target);if(!m)return null;const a=+c.amount||0;if(!a)return null;
    const b={hp:m.hp,temp:m.temp||0};if(a<0)damage(m,-a);else heal(m,a);
    return E(`${a<0?"🗡️":"💚"} ${m.name} ${a<0?"takes "+(-a):"heals "+a} (HP ${b.hp} → ${m.hp})`,{k:"mon",mid:m.id,dH:m.hp-b.hp,dT:(m.temp||0)-b.temp});
  }
  if(t==="combat_start"){if(dmCamp().combat.active)return null;L.fight={ts:Date.now(),monsters:(c.monsters||[]).filter(m=>m&&m.name).map(m=>({name:m.name,count:Math.max(1,+m.count||1),ac:+m.ac||0,hp:+m.hp||0}))};return E("⚔️ Fight detected: ready to start combat",{k:"fight"})}
  if(t==="combat_end"){if(!dmCamp().combat.active)return null;L.fightEnd=true;return null}
  if(t==="rest"){
    const ps=dmCamp().players,before=ps.map(p=>({id:p.id,hp:p.hp,temp:p.temp,conds:[...p.conds],slots:JSON.parse(JSON.stringify(slotsOf(p))),surv:L.surv[p.id]?{...L.surv[p.id]}:null}));
    if(c.kind==="long"){ps.forEach(p=>{p.hp=p.max;p.temp=0;p.conds=p.conds.filter(x=>x!=="Unconscious");restoreSlots(p);if(L.survival){L.surv[p.id]=Object.assign({food:5,water:5,warmth:5,sleep:5},L.surv[p.id]);L.surv[p.id].sleep=5}});
      return E("🏕️ Long rest: HP and spell slots restored for everyone",{k:"rest",before})}
    return E("☕ Short rest taken (add hit dice healing yourself)",{k:"none"});
  }
  if(t==="npc_add"){
    const name=String(c.name||"").trim();if(!name)return null;const ex=npcByName(name);
    if(ex){const old=JSON.parse(JSON.stringify(ex));["role","location","background"].forEach(f=>{if(c[f]&&!ex[f])ex[f]=c[f]});if(c.attitude)ex.attitude=c.attitude;
      (c.items||[]).forEach(i=>{if(!ex.items.some(x=>nrm(x)===nrm(i)))ex.items.push(i)});if(c.notes)ex.notes=(ex.notes?ex.notes+"\n":"")+c.notes;
      return E(`🗣️ Updated NPC ${ex.name}`,{k:"npcR",old})}
    const n={id:uid(),name,role:c.role||"",location:c.location||"",attitude:["friendly","neutral","hostile"].includes(c.attitude)?c.attitude:"neutral",status:"alive",background:c.background||"",items:Array.isArray(c.items)?c.items:[],notes:c.notes||"",firstSeen:L.sessionNo};
    L.npcs.push(n);return E(`🗣️ New NPC: ${name}${n.role?" ("+n.role+")":""}`,{k:"npcA",id:n.id});
  }

    const n=npcByName(c.name);if(!n)return null;const old=JSON.parse(JSON.stringify(n)),f=c.field,v=String(c.value??"");
    if(f==="notes"||f==="background")n[f]=(n[f]?n[f]+"\n":"")+v;
    else if(f==="items_add"){if(!n.items.some(x=>nrm(x)===nrm(v)))n.items.push(v)}
    else if(f==="items_remove")n.items=n.items.filter(x=>nrm(x)!==nrm(v));
    else if(["attitude","status","location","role"].includes(f))n[f]=v;else return null;
    return E(`🗣️ ${n.name}: ${f.replace("_"," ")} → ${v.slice(0,80)}`,{k:"npcR",old});
  }

  if(t==="hp"||t==="set_hp"){
    const a=t==="set_hp"?(+c.value)-p.hp:+c.amount;if(!a||isNaN(a))return null;
    const b={hp:p.hp,temp:p.temp,conds:[...p.conds]};if(a<0)damage(p,-a);else heal(p,a);
    if(p.hp===b.hp&&p.temp===b.temp)return null;
    return E(`${a<0?"🩸":"💚"} ${p.name} ${a<0?"takes "+(-a):"heals "+a} (HP ${b.hp} → ${p.hp}${p.temp!==b.temp?", temp "+b.temp+" → "+p.temp:""})`,{k:"hp",pid:p.id,dH:p.hp-b.hp,dT:p.temp-b.temp,conds:b.conds});
  }
  if(t==="temp_hp"){const b=p.temp;p.temp=Math.max(b,+(c.value??c.amount)||0);if(p.temp===b)return null;return E(`🛡️ ${p.name} gains temp HP (${b} → ${p.temp})`,{k:"hp",pid:p.id,dH:0,dT:p.temp-b})}
  if(t==="spell_slot"){const L1=+c.level,s=slotsOf(p)[L1-1];if(!s||!s.max)return null;const b=s.used;s.used=clamp(s.used+(+c.amount||1),0,s.max);const d=s.used-b;if(!d)return null;
    return E(`✨ ${p.name} ${d>0?"uses":"regains"} ${Math.abs(d)} level ${L1} slot${Math.abs(d)>1?"s":""} (${s.max-s.used}/${s.max} left)${c.spell?": "+c.spell:""}`,{k:"slot",pid:p.id,i:L1-1,d})}
  if(t==="item_add"){const name=String(c.item||"").trim();if(!name)return null;const q=Math.max(1,+c.qty||1);let i=p.items.find(x=>nrm(x.n)===nrm(name));

  if(t==="item_remove"){const n=nrm(c.item);const i=p.items.find(x=>nrm(x.n)===n)||p.items.find(x=>nrm(x.n).includes(n)||n.includes(nrm(x.n)));if(!i)return null;
    const q=Math.min(i.q,Math.max(1,+c.qty||1)),copy={...i,q};i.q-=q;if(i.q<=0)p.items=p.items.filter(x=>x!==i);
    return E(`📤 ${p.name} loses ${i.n}${q>1?" ×"+q:""}`,{k:"iR",pid:p.id,item:copy})}
  if(t==="gold"){const d=+c.amount||0;if(!d)return null;const b=p.gold||0;p.gold=b+d;return E(`💰 ${p.name} ${d>0?"gains":"spends"} ${Math.abs(d)} gp (${b} → ${p.gold})`,{k:"gold",pid:p.id,d})}
  if(t==="condition_add"){const cd=canonCond(c.condition);if(!cd||p.conds.some(x=>x.toLowerCase()===cd.toLowerCase()))return null;p.conds.push(cd);return E(`⚠️ ${p.name} is ${cd.toLowerCase()}`,{k:"cA",pid:p.id,cd})}

      const prev=L.journey.filter(j=>j.session<L.sessionNo).slice(-2).map(j=>`Session ${j.session}: ${j.title}\n${j.summary}`).join("\n\n");
      const out=parseJSON(await askAI('You write session recaps for a Dungeons & Dragons Dungeon Master in UK English. Use the events list and the error-prone, unlabelled speech-to-text transcript. Be concise: ONE short paragraph of 3 to 5 sentences, under 90 words, past tense, covering only the key moments (places reached, NPCs met, fights won or lost, important loot). No flowery description. Return ONLY JSON: {"title":"evocative 3-6 word title","summary":"one short paragraph, under 90 words"}',
        `${stateText()}\n\nPREVIOUS SESSIONS:\n${prev||"(none)"}\n\nEVENTS THIS SESSION:\n${evs||"(none logged)"}\n\nTRANSCRIPT${isFree()?" (last part only)":""}:\n${tx||"(none)"}`,2500,SUM_SCHEMA));
      sum={title:out.title||"Session "+L.sessionNo,summary:out.summary||""};
    }
  }catch(err){toastMsg("Couldn't write the summary automatically: "+err.message)}
  if(!sum){const evs=L.timeline.filter(e=>e.session===L.sessionNo);sum={title:"Session "+L.sessionNo,summary:evs.map(e=>"• "+e.title+(e.detail?": "+e.detail:"")).join("\n")||"No summary written."}}
  L.journey=L.journey.filter(x=>x.session!==L.sessionNo);L.journey.push({id:uid(),session:L.sessionNo,date:L.sessionStart||Date.now(),...sum});
  if(T.transcript.length)download(`${meta.name} Session ${L.sessionNo} transcript.txt`,T.transcript.map(l=>`[${hhmm(l.t)}] ${l.x}`).join("\n"));
  L.sessionNo++;L.sessionStart=null;L.fight=null;L.fightEnd=false;T.transcript=[];T.processed=0;T.feed=[];interim="";
  saveLT();dlSave();S.core.dmTab="journey";commit("core");render();
  toastMsg("Session saved. Edit the summary if anything is off.");
}
async function writeStory(){
  const L=DL();if(!L.journey.length){toastMsg("End at least one session first");return}
  const b=document.getElementById("dlStoryBtn");if(b){b.disabled=true;b.innerHTML=`<span class="dl-spin"></span>Writing…`}
  try{let all=L.journey.slice().sort((a,c)=>a.session-c.session).map(j=>`Session ${j.session}: ${j.title}\n${j.summary}`).join("\n\n");
    if(isFree()&&all.length>5000)all="…"+all.slice(-5000);
    L.story=(await askAI('You write a "story so far" recap for a Dungeons & Dragons campaign in UK English, to be read aloud at the start of the next session. Be concise: one paragraph, under 120 words, vivid but accurate, covering only the biggest moments and ending on where the party is now and what lies ahead. Plain text only.',
      `Campaign: ${activeMeta().name}\nParty: ${dmCamp().players.map(p=>p.name+" ("+[p.race,p.cls].filter(Boolean).join(" ")+")").join(", ")}\n\n${all}`,1500)).trim();
    dlSave();render();
  }catch(err){toastMsg(err.message);if(b){b.disabled=false;b.textContent='✨ Write "story so far"'}}
}
function addDemo(){
  const L=DL(),t0=Date.now()-7*864e5,ev=(s,m,type,title,detail,who,mon)=>({id:uid(),session:s,ts:t0+(s-1)*7*864e5+m*6e4,type,title,detail,who:who||[],monsters:mon||[]});
  L.npcs.push({id:uid(),name:"Mother Grell",role:"Herbalist",location:"Ashford village",attitude:"friendly",status:"alive",background:"Has lived on the edge of the marsh for 40 years. Lost her son to the bog wights.",items:["Antitoxin","Marsh map"],notes:"Knows the safe path through the marsh. Secretly owes money to Captain Voss.",firstSeen:1},
    {id:uid(),name:"Captain Voss",role:"Mercenary captain",location:"The Rusted Anchor",attitude:"hostile",status:"alive",background:"Scarred ex-soldier running protection rackets on the river.",items:["Longsword","Ledger of debts"],notes:"The party embarrassed him in session 1.",firstSeen:1});
  L.timeline.push(ev(1,5,"location","Arrived in Ashford","The party arrived in the marsh village of Ashford during a storm."),ev(1,30,"npc","Met Mother Grell","The herbalist offered shelter and told them about the bog wights.",["Mother Grell"]),
    ev(1,70,"combat","Ambush at the bridge","Goblins ambushed the party on the rope bridge.",[],[{name:"Goblin",count:4,outcome:"defeated"},{name:"Wolf",count:1,outcome:"fled"}]),
    ev(1,95,"loot","Silver key found","A silver key engraved with a heron, taken from the goblin boss."),ev(1,140,"npc","Clash with Captain Voss","Voss tried to charge a river toll and was laughed out of the inn.",["Captain Voss"]),
    ev(2,10,"quest","Find the drowned chapel","Mother Grell asked them to find the chapel where her son vanished.",["Mother Grell"]));
  if(!L.journey.some(j=>j.session===1))L.journey.push({id:uid(),session:1,date:t0,title:"Storm over Ashford",summary:"The heroes reached Ashford in a storm and were sheltered by Mother Grell, who told them of the bog wights. On the rope bridge they beat off a goblin ambush and claimed a heron-engraved silver key. That night at the Rusted Anchor they humiliated the mercenary Captain Voss, making a dangerous enemy."});
  if(L.sessionNo<2)L.sessionNo=2;
  L.timeline.sort((a,c)=>a.session-c.session||a.ts-c.ts);dlSave();render();toastMsg("Example story added. Delete it any time.");
}

/* ---- Clicks, notes and settings ---- */
function dlClick(act,b){
  switch(act){
    case "dlOpen":{const id=b.dataset.camp;if(S.core.active!==id){if(wantListen&&micCamp!==id)stopMic();S.core.active=id;stopHost();startHost()}S.core.dmOpen=id;commit("core");render();window.scrollTo(0,0);return true}
    case "dlHome":S.core.dmOpen=null;commit("core");hideTip();render();window.scrollTo(0,0);return true;
    case "dlTab":S.core.dmTab=b.dataset.k;commit("core");hideTip();render();return true;
    case "dlMic":wantListen?stopMic():startMic();return true;
    case "dlCheck":processChunk(true);return true;
    case "dlTx":downloadTx();return true;
    case "dlEnd":endSession(b);return true;
    case "dlUndo":undo(b.dataset.fid);return true;
    case "dlFight":startFight();return true;
    case "dlFightNo":DL().fight=null;dlSave();render();return true;
    case "dlFightEnd":DL().fightEnd=false;endCombat();return true;
    case "dlFightEndNo":DL().fightEnd=false;dlSave();render();return true;
    case "dlNpc":npcSheet(b.dataset.nid);return true;
    case "dlEv":hideTip();evSheet(b.dataset.eid2);return true;
    case "dlEvTap":if(matchMedia("(hover: hover)").matches){hideTip();evSheet(b.dataset.eid)}else showTip(b,true);return true;
    case "dlTipX":hideTip();return true;
    case "dlFilt":{const k=b.dataset.k;tlFilter.has(k)?tlFilter.delete(k):tlFilter.add(k);render();return true}
    case "dlJ":jSheet(b.dataset.jid2);return true;
    case "dlStory":writeStory();return true;
    case "dlSurv":{const p=dmCamp().players.find(x=>x.id===b.dataset.id),L=DL();if(!p)return true;const s=L.surv[p.id]=Object.assign({food:5,water:5,warmth:5,sleep:5},L.surv[p.id]);s[b.dataset.k]=+b.dataset.v;dlSave();render();return true}
    case "dlTest":{const o=document.getElementById("dlTestOut");o.innerHTML=`<span class="dl-spin"></span>Testing…`;
      if(!aiReady()){o.textContent="❌ "+aiMissing();return true}
      askAI("Reply with the single word: ready","Are you there?",20).then(t=>{o.textContent="✅ Working ("+t.trim().slice(0,30)+")"}).catch(e=>{o.textContent="❌ "+e.message});return true}
    case "dlNanoSetup":setupNano(false);return true;
    case "dlGen":genRoll(b.dataset.k);return true;
    case "dlMus":playMusic(b.dataset.id);return true;
    case "dlMusStop":stopMusic();render();return true;
    case "dlGenAI":genAI();return true;
    case "dlGenPrev":{const a=GEN[b.dataset.k],i=+b.dataset.i;if(a[i]){const x=a.splice(i,1)[0];a.unshift(x);render()}return true}
    case "dlGive":genGive(b.dataset.k);return true;
    case "dlTxLoad":{const f=document.getElementById("dlTxFile");f.value="";f.onchange=async()=>{const file=f.files[0];if(!file)return;
      const txt=await file.text(),id=S.core.active,T=ltOf(id),now=Date.now();
      const lines=txt.split(/\r?\n/).map(l=>l.replace(/^\[\d{1,2}:\d{2}\]\s*/,"").trim()).filter(Boolean);
      if(!lines.length){toastMsg("That file has no transcript lines");return}
      lines.forEach((x,i)=>T.transcript.push({t:now-(lines.length-i)*1000,x}));saveLT();
      const L=DL();if(!L.sessionStart){L.sessionStart=now;dlSave()}
      render();toastMsg(`Loaded ${lines.length} lines.`+(aiReady()?" Press Check now to let the AI read them.":" "+aiMissing()+", then press Check now."))};f.click();return true}
    case "dlExport":{const L=DL(),meta=activeMeta();download(`${meta.name} DM Live notes ${new Date().toISOString().slice(0,10)}.json`,JSON.stringify({tkLive:1,campaign:meta.code,live:L},null,1),"application/json");return true}
    case "dlImport":{const f=document.getElementById("dlImportF");f.onchange=async()=>{const file=f.files[0];if(!file)return;
      try{const d=JSON.parse(await file.text()),src=d.live||d.state;if(!src||!Array.isArray(src.timeline))throw new Error("Not a DM Live notes file");
        const L=DL();Object.assign(L,{npcs:src.npcs||[],timeline:src.timeline||[],journey:src.journey||[],story:src.story||"",sessionNo:src.sessionNo||L.sessionNo,survival:!!src.survival,surv:src.surv||L.surv});
        dlSave();render();toastMsg("Notes imported")}catch(e){toastMsg("Import failed: "+e.message)}};f.click();return true}
    case "dlDemo":addDemo();return true;
    case "dlClear":if(b.dataset.armed!=="1"){b.dataset.armed="1";b.textContent="Tap again to clear";setTimeout(()=>{if(b.isConnected){b.dataset.armed="";b.textContent="Clear DM Live notes"}},3500);return true}
      {const L=DL();Object.assign(L,{npcs:[],timeline:[],journey:[],story:"",sessionNo:1,sessionStart:null,surv:{},fight:null,fightEnd:false});const T=ltOf(S.core.active);T.transcript=[];T.processed=0;T.feed=[];saveLT();dlSave();render();toastMsg("DM Live notes cleared")}return true;
  }
  return false;
}
document.addEventListener("click",e=>{if(tip.classList.contains("sticky")&&!e.target.closest(".dl-tip,.dl-ev"))hideTip()},true);

/* ---------- Events ---------- */
const MODES=["dm","player","camps"];
function setMode(m){
  if(m===S.core.mode)return;
  S.core.mode=m;commit("core");
  if(m==="camps"&&S.core.activeJoin&&!CL.code)openJoin(S.core.activeJoin);
  if(m==="dm")startHost();
  render();window.scrollTo(0,0);
}
document.getElementById("switch").addEventListener("click",e=>{const b=e.target.closest("[data-m]");if(b)setMode(b.dataset.m)});
// Swipe on the switch to slide between modes
(function(){let x0=null;const sw=document.getElementById("switch");
  sw.addEventListener("touchstart",e=>{x0=e.touches[0].clientX},{passive:true});
  sw.addEventListener("touchend",e=>{if(x0==null)return;const dx=e.changedTouches[0].clientX-x0;x0=null;
    if(Math.abs(dx)>30){const i=MODES.indexOf(S.core.mode);setMode(MODES[clamp(i+(dx>0?1:-1),0,2)])}});
})();

document.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]");if(!b)return;
  const act=b.dataset.act,id=b.dataset.id||(b.closest("[data-id]")&&b.closest("[data-id]").dataset.id);
  if(act.startsWith("dl")&&dlClick(act,b))return;
  const p=id?findP(id):null;
  switch(act){
    case "dmg1":damage(p,1);commit(keyFor(id));render();break;
    case "heal1":heal(p,1);commit(keyFor(id));render();break;
    case "pad":padSheet(p);break;
    case "conds":condSheet(p);break;
    case "items":itemsSheet(p);break;
    case "edit":editSheet(p,false);break;
    case "add":editSheet(P({name:""}),true,"camp");break;
    case "newChar":editSheet(P({name:""}),true,"char");break;
    case "openChar":S.core.view=b.dataset.id;commit("core");render();window.scrollTo(0,0);break;
    case "backChars":S.core.view=null;commit("core");render();break;
    case "shareChar":shareSheet(p);break;
    case "campEdit":campSheet();break;
    case "newCamp":newCampSheet();break;
    case "openCamp":openCampSheet();break;
    case "codeInfo":codeSheet();break;
    case "livepill":if(S.core.mode==="camps"&&CL.code)break;if(H.code){if(S.core.mode!=="dm")setMode("dm");codeSheet()}break;
    case "importP":importSheet();break;
    case "openJoin":S.core.activeJoin=b.dataset.code;commit("core");openJoin(b.dataset.code);window.scrollTo(0,0);break;
    case "backJoin":S.core.activeJoin=null;commit("core");closeJoin();render();break;
    case "forgetJoin":{const c=b.dataset.code;S.core.joined=S.core.joined.filter(j=>j.code!==c);if(S.core.activeJoin===c){S.core.activeJoin=null;closeJoin()}commit("core");render();break;}
    case "retry":if(CL.code){const c=CL.code;closeJoin();openJoin(c)}break;
    case "addMine":addMineSheet();break;
    case "roll":if(p)rollCheck(p,b.dataset.a);break;
    case "slots":slotSheet(p);break;
    case "cStart":startCombat();break;
    case "cParty":addParty();break;
    case "cMon":monSheet();break;
    case "cNext":step(1);break;
    case "cPrev":step(-1);break;
    case "cRoll":CB().list.forEach(e=>{if(e.kind==="m")e.init=d20()+(e.dex||0)});commit(campKey());render();break;
    case "cInit":{const e=CB().list.find(x=>x.id===b.dataset.cid);if(e)initSheet(e);break;}
    case "cInfo":{const e=CB().list.find(x=>x.id===b.dataset.cid);if(e)infoSheet(e);break;}
    case "cDel":removeCombatant(b.dataset.cid);render();break;
    case "cEnd":
      if(b.dataset.armed!=="1"){b.dataset.armed="1";b.textContent="Tap again to end";setTimeout(()=>{if(b.isConnected){b.dataset.armed="";b.textContent="End combat"}},3000);break}
      endCombat();break;
    case "spells":spellSheet(p);break;
    case "pip":{const s=slotsOf(p)[+b.dataset.lv];s.used=clamp(s.used+(b.dataset.on==="1"?1:-1),0,s.max);commit(keyFor(id));render();break;}
    case "rest":p.hp=p.max;p.temp=0;p.conds=p.conds.filter(c=>c!=="Unconscious");restoreSlots(p);commit(keyFor(id));render();break;
    case "longrest":dmCamp().players.forEach(q=>{q.hp=q.max;q.temp=0;q.conds=q.conds.filter(c=>c!=="Unconscious");restoreSlots(q)});commit(campKey());render();break;
    case "iq+":case "iq-":case "idel":{
      const row=b.closest("[data-item]"),q=findP(row.dataset.id),i=q.items.find(x=>x.id===row.dataset.item);
      if(act==="idel")q.items=q.items.filter(x=>x!==i);else i.q=Math.max(1,i.q+(act==="iq+"?1:-1));
      commit(keyFor(q.id));
      if(sheet.classList.contains("on"))itemsSheet(q);else render();
      break;}
  }
});
document.addEventListener("submit",async e=>{
  const nf=e.target.closest('[data-form="dlNote"]');if(nf){e.preventDefault();const i=nf.querySelector("input"),v=i.value.trim();if(v){addLine("[DM note] "+v,S.core.active);i.value=""}return}
  const jf=e.target.closest('[data-form="join"]');if(jf){e.preventDefault();joinCode(jf.querySelector("input").value);return}
  const lf=e.target.closest('[data-form="unlock"],[data-form="setpw"]');
  if(lf){e.preventDefault();
    const meta=activeMeta(),pw=lf.querySelector("#pw1").value,msg=lf.querySelector("#pwMsg"),say=t=>{msg.hidden=false;msg.textContent=t};
    if(!meta)return;
    if(lf.dataset.form==="setpw"){
      if(pw.length<4){say("Use at least 4 characters.");return}
      if(pw!==lf.querySelector("#pw2").value){say("The two passwords don't match.");return}
      await setPassword(meta,pw);
    }else{
      if(!pw){say("Enter the password.");return}
      say("Checking…");
      if(!(await unlockCamp(meta,pw))){say("That password isn't right.");return}
    }
    startHost();render();return;
  }
  const f=e.target.closest('[data-form="additem"]');if(!f)return;e.preventDefault();
  const inp=f.querySelector("input"),n=inp.value.trim();if(!n)return;
  const p=findP(f.dataset.id);
  const m=n.match(/^(.*?)\s*[x×]\s*(\d+)$/i);
  p.items.push(m?it(m[1],+m[2]):it(n));commit(keyFor(p.id));
  if(sheet.classList.contains("on")){itemsSheet(p);setTimeout(()=>{const x=document.getElementById("sheet-newitem");x&&x.focus()},50)}
  else{render();const x=document.getElementById("me-newitem");x&&x.focus()}
});
document.addEventListener("change",e=>{
  if(e.target.dataset&&e.target.dataset.dlset){setChange(e.target);return}
  if(e.target.id==="campSel"){
    const v=e.target.value;
    if(v==="__new"||v==="__open"){e.target.value=S.core.active;v==="__new"?newCampSheet():openCampSheet();return}
    S.core.active=v;commit("core");stopHost();startHost();render();return;
  }
  if(e.target.matches("[data-iname]")){const row=e.target.closest("[data-item]"),q=findP(row.dataset.id),i=q.items.find(x=>x.id===row.dataset.item);
    i.n=e.target.value.trim()||i.n;commit(keyFor(q.id));}
});
let nt;
document.addEventListener("focusout",()=>{if(renderHeld)setTimeout(()=>{if(renderHeld)render()},50)});
document.addEventListener("input",e=>{
  if(e.target.dataset&&e.target.dataset.mus){musInput(e.target);return}
  if(e.target.dataset&&e.target.dataset.dlq){const L=DL();if(e.target.dataset.dlq==="npc"){npcQ=e.target.value;const x=document.getElementById("dlNpcList");if(x)x.innerHTML=npcListHTML(L)}else{tlQ=e.target.value;const x=document.getElementById("dlTl");if(x)x.innerHTML=trackHTML(L)}return}
  if(e.target.dataset.notes){const p=findP(e.target.dataset.notes);if(!p)return;p.notes=e.target.value;clearTimeout(nt);nt=setTimeout(()=>commit(keyFor(p.id)),500)}
});

// Keep the screen awake at the table where the phone allows it
async function wake(){try{if(navigator.wakeLock&&document.visibilityState==="visible")await navigator.wakeLock.request("screen")}catch(e){}}
document.addEventListener("visibilitychange",wake);wake();
// Phones pause apps in the background, so reconnect as soon as the app is back on screen
document.addEventListener("visibilitychange",()=>{
  if(document.visibilityState!=="visible")return;
  [...H.clients,...CL.clients].forEach(c=>{if(!c.connected){try{c.reconnect()}catch(e){}}});
  if(H.code)scheduleBroadcast();
  if(CL.code)pubOn(CL.clients,TOPIC(CL.code)+"/hi",{id:CL.me,need:true});
});

render();
setTimeout(connect,0);
restoreKeys().then(()=>{startHost();render()});
if(S.core.activeJoin)openJoin(S.core.activeJoin);
})();
</script>
