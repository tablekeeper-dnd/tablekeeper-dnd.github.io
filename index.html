<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="A free D&D table app: DM screen for the whole party, your own character sheet, a combat tracker, and live tables players can join.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Table Keeper</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#14110e">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;0,800;1,400&family=Spline+Sans+Mono:wght@400;600&display=swap">
<style>
/* Layout: a DM's screen at the table. Sticky header with a DM/Player slide switch,
   party cards in a responsive grid (1 col phone, 2-3 tablet), bottom sheets for edits.
   Deliberate single dark look: low glare by candlelight, oxblood + brass. */
:root{
  --bg:#14110e; --surface:#1f1a15; --raised:#29221b; --line:#3d3229;
  --ink:#ece2d2; --muted:#a8988a; --faint:#76685b;
  --brass:#cfa65c; --brass-ink:#1b150e;
  --blood:#c4513f; --blood-soft:#3a1d17;
  --heal:#79b06e; --heal-soft:#1d2a1a;
  --warn:#d9913d; --temp:#7fa9cf;
  --f-display:"IM Fell English SC", "Iowan Old Style", Georgia, serif;
  --f-body:"Alegreya Sans", "Gill Sans", "Segoe UI", system-ui, sans-serif;
  --f-num:"Spline Sans Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r:12px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.4;min-height:100%;
  padding-left:max(12px, env(safe-area-inset-left,0px));padding-right:max(12px, env(safe-area-inset-right,0px));padding-bottom:40px;
  -webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}

/* Header + slide switch */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:12px 10px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--line);margin-inline:-4px;padding-inline:4px}
.brand{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand h1{font-family:var(--f-display);font-weight:400;font-size:1.45rem;margin:0;letter-spacing:.02em;color:var(--brass)}
.save{font-size:.78rem;color:var(--faint);display:flex;align-items:center;gap:6px;white-space:nowrap}
.save i{width:7px;height:7px;border-radius:50%;background:var(--faint)}
.save.ok i{background:var(--heal)} .save.busy i{background:var(--warn)}
.switch{position:relative;display:grid;grid-template-columns:1fr 1fr 1fr;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px;touch-action:pan-y}
.switch .thumb{position:absolute;top:4px;bottom:4px;left:4px;width:calc((100% - 8px) / 3);border-radius:999px;background:var(--brass);transition:transform .28s cubic-bezier(.3,.7,.2,1)}
.switch[data-mode="player"] .thumb{transform:translateX(100%)}
.switch[data-mode="camps"] .thumb{transform:translateX(200%)}
.switch button{position:relative;z-index:1;padding:9px 2px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;font-size:clamp(.66rem,2.8vw,.82rem);white-space:normal;line-height:1.15;color:var(--muted);transition:color .2s}
.switch[data-mode="dm"] [data-m="dm"],.switch[data-mode="player"] [data-m="player"],.switch[data-mode="camps"] [data-m="camps"]{color:var(--brass-ink)}

/* Campaign bar */
.bar{display:flex;gap:8px;align-items:center;margin-top:14px;flex-wrap:wrap}
.camp{flex:1 1 200px;min-width:0;position:relative}
.camp select{width:100%;appearance:none;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 34px 10px 12px;font-family:var(--f-display);font-size:1.1rem}
.camp::after{content:"";position:absolute;right:14px;top:50%;width:8px;height:8px;border-right:2px solid var(--brass);border-bottom:2px solid var(--brass);transform:translateY(-70%) rotate(45deg);pointer-events:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 14px;border-radius:10px;background:var(--raised);border:1px solid var(--line);font-weight:700;font-size:.92rem;min-height:42px}
.btn.gold{background:var(--brass);color:var(--brass-ink);border-color:var(--brass)}
.btn.red{background:var(--blood);border-color:var(--blood);color:#fff}
.btn.green{background:var(--heal);border-color:var(--heal);color:#0f170d}
.btn.blue{background:var(--temp);border-color:var(--temp);color:#0d1620}
.btn.ghost{background:none}
.btn.danger{color:var(--blood);background:none;border-color:var(--blood-soft)}
.summary{display:flex;gap:14px;flex-wrap:wrap;margin:12px 2px 0;color:var(--muted);font-size:.86rem}
.summary b{color:var(--ink)}

/* Party grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:12px;margin-top:12px}
.pc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:10px;min-width:0}
.pc.down{border-color:var(--blood)}
.pc-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.pc-top>div:first-child{min-width:0}
.pc h3{margin:0;font-family:var(--f-display);font-weight:400;font-size:1.3rem;line-height:1.1;overflow-wrap:anywhere}
.pc .sub{margin:2px 0 0;color:var(--muted);font-size:.86rem}
.tag{display:inline-block;font-size:.66rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:2px 6px;border-radius:4px;background:var(--raised);color:var(--faint);vertical-align:middle;margin-left:4px;font-family:var(--f-body)}
.tag.down{background:var(--blood);color:#fff}
.shield{flex:none;width:46px;height:52px;display:grid;place-items:center;text-align:center;background:var(--raised);border:1px solid var(--line);clip-path:polygon(0 0,100% 0,100% 62%,50% 100%,0 62%);padding-bottom:8px}
.shield small{display:block;font-size:.6rem;letter-spacing:.1em;color:var(--muted);font-weight:800}
.shield b{display:block;font-family:var(--f-num);font-size:1.15rem;line-height:1}
.hp{display:grid;grid-template-columns:48px 1fr 48px;gap:8px;align-items:stretch}
.hp .step{border-radius:10px;font-size:1.5rem;font-weight:700;min-height:48px}
.hp .minus{background:var(--blood-soft);color:var(--blood)}
.hp .plus{background:var(--heal-soft);color:var(--heal)}
.hp-mid{background:var(--raised);border-radius:10px;padding:6px 10px;display:flex;flex-direction:column;justify-content:center;gap:5px;text-align:left}
.hp-line{display:flex;align-items:baseline;gap:6px}
.hp-line b{font-family:var(--f-num);font-size:1.45rem;line-height:1}
.hp-line span{font-family:var(--f-num);color:var(--muted);font-size:.9rem}
.hp-line em{font-style:normal;font-family:var(--f-num);font-size:.78rem;color:var(--temp);margin-left:auto}
.meter{height:6px;border-radius:3px;background:var(--bg);overflow:hidden;display:flex}
.meter i{display:block;height:100%;background:var(--heal);transition:width .3s}
.meter i.warn{background:var(--warn)} .meter i.crit{background:var(--blood)}
.meter i.tmp{background:var(--temp)}
.abil{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.ab{background:var(--bg);border-radius:8px;padding:5px 0 4px;text-align:center;min-width:0}
.ab small{display:block;font-size:.62rem;letter-spacing:.08em;font-weight:800;color:var(--muted)}
.ab b{display:block;font-family:var(--f-num);font-size:.98rem}
.ab span{display:block;font-family:var(--f-num);font-size:.72rem;color:var(--faint)}
.mini{display:flex;gap:12px;flex-wrap:wrap;font-size:.82rem;color:var(--muted)}
.mini b{color:var(--ink);font-family:var(--f-num);font-weight:600}
.conds{display:flex;flex-wrap:wrap;gap:5px}
.chip{font-size:.76rem;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--blood-soft);color:#f0a597;border:1px solid transparent}
.slots{border-top:1px dashed var(--line);padding-top:8px;display:flex;flex-direction:column;gap:6px}
.slot-row{display:grid;grid-template-columns:34px 1fr auto;gap:8px;align-items:center}
.slot-l{font-family:var(--f-num);font-size:.8rem;color:var(--muted)}
.pips{display:flex;flex-wrap:wrap;gap:6px}
.pip{width:24px;height:24px;border-radius:50%;border:2px solid var(--brass);background:var(--brass);transition:background .15s}
.pip.spent{background:transparent;border-color:var(--faint)}
.slot-n{font-family:var(--f-num);font-size:.8rem;color:var(--muted)}
.srow{display:grid;grid-template-columns:44px auto 36px auto;gap:10px;align-items:center;justify-content:start}
.srow b{font-family:var(--f-num);min-width:22px;text-align:center}
.items{border-top:1px dashed var(--line);padding-top:8px}
.spells{border-top:1px dashed var(--line);padding-top:8px;display:flex;flex-direction:column;gap:5px}
.spells .count{font-size:.8rem;color:var(--muted)}
.spells .count b{font-family:var(--f-num);color:var(--ink);font-weight:600}
.spells .count b.short{color:var(--warn)}
.sp-l{display:grid;grid-template-columns:48px 1fr;gap:8px;font-size:.92rem}
.sp-l span:first-child{font-family:var(--f-num);font-size:.76rem;color:var(--muted);padding-top:2px}
.sp-l span:last-child{min-width:0;overflow-wrap:anywhere}
.picks{display:flex;flex-direction:column;gap:6px}
.pick{display:grid;grid-template-columns:1fr 36px;gap:6px}
.pick select{min-width:0}
.items-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.lbl{font-size:.7rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.items ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.items li{display:flex;justify-content:space-between;gap:8px;font-size:.92rem;min-width:0}
.items li span:first-child{overflow-wrap:anywhere;min-width:0}
.items li .q{font-family:var(--f-num);color:var(--muted);flex:none}
.items .none{color:var(--faint);font-style:italic;font-size:.88rem}
.linkbtn{color:var(--brass);font-weight:700;font-size:.86rem;padding:6px 2px}
.pc-foot{display:flex;gap:8px}
.pc-foot .btn{flex:1;min-height:38px;padding:7px 10px;font-size:.86rem}

.empty{margin-top:24px;padding:28px 18px;border:1px dashed var(--line);border-radius:var(--r);text-align:center;color:var(--muted)}
.empty h2{font-family:var(--f-display);font-weight:400;color:var(--ink);margin:0 0 6px;font-size:1.4rem}
.empty .btn{margin-top:12px}

/* Player sheet */
.me{display:flex;flex-direction:column;gap:14px;margin-top:14px;max-width:720px;margin-inline:auto}
.me-head{display:flex;gap:12px;align-items:flex-start;justify-content:space-between}
.me-head h2{font-family:var(--f-display);font-weight:400;font-size:2rem;margin:0;line-height:1.05;overflow-wrap:anywhere}
.me-head .sub{color:var(--muted);margin:4px 0 0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:10px;min-width:0}
.big-hp .hp{grid-template-columns:58px 1fr 58px}
.big-hp .hp-line b{font-size:2.2rem}
.abil-big{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.abil-big button{background:var(--raised);border:1px solid var(--line);border-radius:10px;padding:10px 4px;text-align:center}
.abil-big small{display:block;font-size:.7rem;letter-spacing:.1em;font-weight:800;color:var(--muted)}
.abil-big b{display:block;font-family:var(--f-num);font-size:1.6rem;line-height:1.1}
.abil-big span{display:block;font-family:var(--f-num);color:var(--brass);font-size:.85rem}
.hint{color:var(--faint);font-size:.8rem;margin:0}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--raised);border-radius:10px;padding:8px;text-align:center}
.stat small{display:block;font-size:.66rem;letter-spacing:.1em;font-weight:800;color:var(--muted)}
.stat b{font-family:var(--f-num);font-size:1.3rem}
.inv-add{display:flex;gap:8px}
.inv-add input{flex:1;min-width:0}
textarea.notes{min-height:110px;resize:vertical}

/* Fields */
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f label{font-size:.72rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
input[type=text],input[type=number],textarea,select.plain{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:9px 10px;min-width:0}
input[type=number]{font-family:var(--f-num)}
.row{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(90px,1fr))}
.row6{display:grid;gap:6px;grid-template-columns:repeat(6,1fr)}
.row6 input{text-align:center;padding:8px 2px}
select.plain{appearance:auto;padding:9px 8px}
.autobox{background:var(--raised);border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.chk{display:flex;gap:8px;align-items:center;font-size:.9rem}
.chk input{width:18px;height:18px;accent-color:var(--brass)}
.togs{display:flex;flex-wrap:wrap;gap:6px}
.tog{padding:6px 10px;border-radius:999px;border:1px solid var(--line);font-size:.84rem;font-weight:700;color:var(--muted)}
.tog[aria-pressed="true"]{background:var(--blood-soft);border-color:var(--blood);color:#f0a597}
.ilist{display:flex;flex-direction:column;gap:6px}
.irow{display:grid;grid-template-columns:1fr auto auto auto auto;gap:6px;align-items:center}
.irow input{min-width:0}
.irow .q{font-family:var(--f-num);min-width:26px;text-align:center}
.sq{width:36px;height:36px;border-radius:8px;background:var(--raised);border:1px solid var(--line);font-weight:700}
.sq.x{color:var(--blood)}

/* Sheet */
.scrim{position:fixed;inset:0;background:rgba(5,4,3,.66);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-height:88vh;overflow:auto;background:var(--surface);border-top:1px solid var(--line);border-radius:18px 18px 0 0;
  padding:8px max(16px, env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px, env(safe-area-inset-left,0px));
  transform:translateY(105%);transition:transform .26s cubic-bezier(.3,.7,.2,1);max-width:640px;margin-inline:auto}
.sheet.on{transform:none}
.grip{width:40px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 10px}
.sheet h2{font-family:var(--f-display);font-weight:400;margin:0 0 12px;font-size:1.5rem}
.stack{display:flex;flex-direction:column;gap:14px}
.pad-in{font-family:var(--f-num);font-size:2rem;text-align:center;padding:10px}
.quick{display:flex;gap:6px;flex-wrap:wrap}
.quick button{flex:1;min-width:52px;padding:9px 0;border-radius:9px;background:var(--raised);border:1px solid var(--line);font-family:var(--f-num)}
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.foot{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap}

/* Toast */
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,140%);z-index:50;background:var(--raised);border:1px solid var(--brass);border-radius:14px;padding:10px 16px;display:flex;gap:12px;align-items:center;transition:transform .25s;max-width:calc(100% - 32px)}
.toast.on{transform:translate(-50%,0);visibility:visible}
.toast{visibility:hidden}
.brand h1{white-space:nowrap}
@media (max-width:460px){.livepill:not([hidden])+.save span{display:none}}
.toast b{font-family:var(--f-num);font-size:1.8rem;color:var(--brass);line-height:1}
.toast span{font-size:.88rem;color:var(--muted)}
.toast .crit{color:var(--heal)} .toast .fumble{color:var(--blood)}

/* Combat */
body.in-combat{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
.cbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.cbar .btn{flex:1 1 auto}
.clist{display:flex;flex-direction:column;gap:10px;margin-top:12px;max-width:760px;margin-inline:auto}
.cb{display:grid;grid-template-columns:52px 1fr;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px;min-width:0}
.cb.cur{border-color:var(--brass);box-shadow:0 0 0 1px var(--brass)}
.cb.dead{opacity:.5}
.cb.dead .hp-line b{text-decoration:line-through}
.init{display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:10px;background:var(--raised);border:1px solid var(--line);min-height:58px}
.cb.cur .init{background:var(--brass);color:var(--brass-ink);border-color:var(--brass)}
.init small{font-size:.58rem;letter-spacing:.1em;font-weight:800;opacity:.75}
.init b{font-family:var(--f-num);font-size:1.35rem;line-height:1.1}
.cb-main{display:flex;flex-direction:column;gap:8px;min-width:0}
.cb-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.cb-name{min-width:0;text-align:left;padding:0}
.cb-name b{font-family:var(--f-display);font-weight:400;font-size:1.2rem;line-height:1.1;overflow-wrap:anywhere}
.kind{font-size:.66rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:2px 6px;border-radius:4px;margin-left:4px;vertical-align:middle;font-family:var(--f-body)}
.kind.p{background:#1f2a35;color:var(--temp)} .kind.m{background:var(--blood-soft);color:#f0a597}
.cb-ac{flex:none;font-size:.78rem;color:var(--muted);background:var(--raised);border-radius:8px;padding:4px 8px}
.cb-ac b{font-family:var(--f-num);color:var(--ink);font-size:1rem}
.atk{font-size:.84rem;color:var(--muted);margin:0;overflow-wrap:anywhere}
.cb-acts{display:flex;gap:6px;flex-wrap:wrap}
.cb-acts .btn{min-height:34px;padding:6px 10px;font-size:.82rem}
.turnbar{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);
  padding:10px max(12px, env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(12px, env(safe-area-inset-left,0px));
  display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}
.turnbar .now{text-align:center;min-width:0}
.turnbar .now small{display:block;font-size:.68rem;letter-spacing:.1em;font-weight:800;color:var(--muted);text-transform:uppercase}
.turnbar .now b{display:block;font-family:var(--f-display);font-weight:400;font-size:1.15rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.turnbar .btn{min-width:84px;min-height:48px}
.mon-prev{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:6px}
.mon-prev .mini b{font-size:.95rem}
.stepper{display:flex;align-items:center;gap:10px}
.stepper b{font-family:var(--f-num);font-size:1.3rem;min-width:28px;text-align:center}
/* Live table */
.brand-r{display:flex;align-items:center;gap:10px;min-width:0}
.livepill{font-size:.74rem;font-weight:800;letter-spacing:.06em;padding:4px 9px;border-radius:999px;background:var(--raised);border:1px solid var(--warn);color:var(--warn);font-family:var(--f-num);white-space:nowrap}
.livepill.ok{border-color:var(--heal);color:var(--heal)}
.btn.live-on{border-color:var(--heal);color:var(--heal)}
.join{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:10px;max-width:720px;margin-inline:auto}
.join-row{display:flex;gap:8px}
.me-acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.join-row input{flex:1;min-width:0;font-family:var(--f-num);font-size:1.3rem;letter-spacing:.2em;text-transform:uppercase;text-align:center}
.banner{margin-top:14px;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;border:1px solid var(--warn);background:var(--surface);color:var(--muted);font-size:.9rem}
.banner.ok{border-color:var(--heal)}

(function(){
const ABIL=["str","dex","con","int","wis","cha"];
const CONDS=["Blinded","Charmed","Deafened","Exhaustion","Frightened","Grappled","Incapacitated","Invisible","Paralysed","Petrified","Poisoned","Prone","Restrained","Stunned","Unconscious","Concentrating","Inspired"];
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const mod=s=>Math.floor(((+s||10)-10)/2);
const sg=n=>(n>=0?"+":"")+n;
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));

function P(o){return Object.assign({id:uid(),name:"New hero",race:"",cls:"",lvl:1,ac:10,hp:10,max:10,temp:0,speed:30,
  abil:{str:10,dex:10,con:10,int:10,wis:10,cha:10},conds:[],items:[],gold:0,notes:"",ex:false,slots:null},o)}
function SL(...m){return Array.from({length:9},(_,i)=>({max:m[i]||0,used:0}))}
function it(n,q){return{id:uid(),n,q:q||1}}

function lsGet(k){try{return JSON.parse(localStorage.getItem(k)||"null")}catch(e){return null}}
function lsSet(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
const CODE_CHARS="ABCDEFGHJKMNPQRSTUVWXYZ23456789";
function newCode(){return Array.from({length:6},()=>CODE_CHARS[Math.floor(Math.random()*CODE_CHARS.length)]).join("")}
function blankCombat(){return {active:false,round:1,cur:null,list:[]}}

/* Fresh install: no campaigns or characters until the person creates them. */
function defaults(){
  return {core:{mode:"player",active:null,camps:[],myMonsters:[],joined:[],activeJoin:null,view:null},camps:{},chars:[]};
}
function normalise(){
  const c=S.core;
  c.camps=c.camps||[];c.myMonsters=c.myMonsters||[];c.joined=c.joined||[];S.camps=S.camps||{};
  if(!Array.isArray(S.chars))S.chars=[];
  // Older versions kept one character in S.me
  if(S.me){const m=S.me;if(!m.id||m.id==="me")m.id=uid();if(!S.chars.some(x=>x.id===m.id))S.chars.push(m);delete S.me}
  const oldHost=lsGet("tk.host");
  c.camps.forEach(m=>{
    const cp=S.camps[m.id]||(S.camps[m.id]={players:[]});
    if(!cp.players)cp.players=[];
    if(!cp.combat)cp.combat=blankCombat();
    if(!m.code)m.code=(oldHost&&oldHost.campId===m.id&&oldHost.code)||newCode();
  });
  // Older versions kept one fight for the whole app
  if(S.combat){if(S.combat.list&&S.combat.list.length&&c.active&&S.camps[c.active])S.camps[c.active].combat=Object.assign(blankCombat(),S.combat,{active:true});delete S.combat}
  const oj=lsGet("tk.join");if(oj&&!c.joined.some(j=>j.code===oj))c.joined.push({code:oj,name:""});
  lsSet("tk.join",null);lsSet("tk.host",null);lsSet("tk.claim",null);
  if(c.active&&!c.camps.some(x=>x.id===c.active))c.active=null;
  if(!c.active&&c.camps.length)c.active=c.camps[0].id;
  if(c.view&&!S.chars.some(x=>x.id===c.view))c.view=null;
  if(c.activeJoin&&!c.joined.some(j=>j.code===c.activeJoin))c.activeJoin=null;
}

let S=defaults();
const LS="tablekeeper.v1";
try{const c=JSON.parse(localStorage.getItem(LS)||"null");if(c&&c.core)S=c;}catch(e){}
normalise();
S.core.mode=location.hash==="#dm"?"dm":"player"; // the app opens on the Player tab (or DM with #dm)
function cache(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}
/* Table Keeper open in another tab changed the party: pick up its changes and pass them on to a live table */
addEventListener("storage",e=>{
  if(e.key!==LS||!e.newValue)return;
  try{const n=JSON.parse(e.newValue);if(!n||!n.camps)return;let changed=false;
    for(const id in n.camps){if(S.camps[id]&&n.camps[id]&&Array.isArray(n.camps[id].players)){S.camps[id].players=n.camps[id].players;changed=true}}
    if(!changed)return;remoteTick=true;render();if(H.campId&&n.camps[H.campId])hostChanged();
  }catch(err){}
});

/* ---------- Saving (private store, falls back to this device) ---------- */
let db=null,col=null,online=false;
const pending=new Map(),timers=new Map(),writing=new Set();
const saveEl=document.getElementById("save");
function setSave(cls,txt){saveEl.className="save "+cls;saveEl.lastElementChild.textContent=txt}
function docData(key){
  if(key==="core")return {json:JSON.stringify(S.core)};
  if(key==="chars")return {json:JSON.stringify(S.chars)};
  const id=key.slice(5);return {json:JSON.stringify(S.camps[id]||{players:[]})};
}
function commit(key){
  if(key==="live"){sendChanges();return}
  if(H.campId&&key==="camp_"+H.campId)hostChanged();
  if(H.campId&&key==="core")scheduleBackup();
  cache();
  if(!online){setSave("", "Saved on this device");return}
  pending.set(key,true);setSave("busy","Saving");
  clearTimeout(timers.get(key));
  timers.set(key,setTimeout(()=>flush(key),700));
}
async function flush(key){
  if(writing.has(key)){timers.set(key,setTimeout(()=>flush(key),400));return}
  if(!pending.get(key))return;
  pending.delete(key);writing.add(key);
  try{await col.doc(key).set(docData(key))}catch(e){setSave("","Save failed, kept on device");writing.delete(key);return}
  writing.delete(key);
  if(!pending.size&&!writing.size)setSave("ok","Saved");
}
function campKey(){return "camp_"+S.core.active}

async function connect(){
  if(!window.claude||!window.claude.use){setSave("","Saved on this device");return}
  const loading=setTimeout(()=>{if(!online)setSave("","Saved on this device")},10000);
  try{
    const [d,u]=await Promise.all([window.claude.use("db"),window.claude.use("user")]);
    if(!d||!u){clearTimeout(loading);setSave("","Saved on this device");return}
    const id=await u.id();
    if(!id){clearTimeout(loading);setSave("","Saved on this device");return}
    db=d;col=db.collection("data/users/"+id);
    const core=await col.doc("core").get();
    clearTimeout(loading);
    online=true;
    if(!core.exists){
      await col.doc("core").set(docData("core"));await col.doc("chars").set(docData("chars"));
      for(const c of S.core.camps){await col.doc("camp_"+c.id).set(docData("camp_"+c.id))}
      setSave("ok","Saved");return;
    }
    const next={core:JSON.parse(core.data().json),camps:{},chars:S.chars};
    const ch=await col.doc("chars").get();if(ch.exists)next.chars=JSON.parse(ch.data().json);
    const me=await col.doc("me").get();if(me.exists){const m=JSON.parse(me.data().json);if(m)next.me=m}
    for(const c of next.core.camps){const s=await col.doc("camp_"+c.id).get();next.camps[c.id]=s.exists?JSON.parse(s.data().json):{players:[]}}
    const mode=S.core.mode;S=next;normalise();S.core.mode=mode;cache();render();setSave("ok","Saved");
  }catch(e){clearTimeout(loading);online=false;setSave("","Saved on this device")}
}

/* ---------- Helpers ---------- */
const isClient=()=>S.core.mode==="camps"&&!!CL.code;
const activeMeta=()=>S.core.camps.find(c=>c.id===S.core.active)||null;
function dmCamp(){const id=S.core.active;if(!id)return {players:[],combat:blankCombat()};const c=S.camps[id]||(S.camps[id]={players:[],combat:blankCombat()});if(!c.combat)c.combat=blankCombat();return c}
const camp=()=>isClient()?CL.camp:dmCamp();
function CB(){return isClient()?CL.combat:dmCamp().combat}
function findChar(id){return S.chars.find(c=>c.id===id)}
function findPlayer(id){if(isClient()){const p=CL.camp.players.find(p=>p.id===id);return p?{p,k:"live"}:null}for(const k in S.camps){const p=S.camps[k].players.find(p=>p.id===id);if(p)return{p,k}}return null}
function findP(id){const c=findChar(id);if(c)return c;const f=findPlayer(id);if(f)return f.p;return CB().list.find(e=>e.kind==="m"&&e.id===id)}
function keyFor(id){if(findChar(id))return"chars";if(isClient())return"live";const f=findPlayer(id);if(f)return"camp_"+f.k;return campKey()}
function hpState(p){if(p.hp<=0)return"down";const r=p.hp/Math.max(1,p.max);return r>.5?"ok":r>.25?"warn":"crit"}
function meter(p){
  const tot=Math.max(p.max,p.hp+p.temp);
  const w=clamp(p.hp/tot*100,0,100),t=clamp(p.temp/tot*100,0,100),st=hpState(p);
  return `<div class="meter"><i class="${st==="ok"?"":st==="warn"?"warn":"crit"}" style="width:${w}%"></i>${p.temp?`<i class="tmp" style="width:${t}%"></i>`:""}</div>`;
}
function hpBlock(p){
  return `<div class="hp">
    <button class="step minus" data-act="dmg1" data-id="${p.id}" aria-label="Lose 1 HP">−</button>
    <button class="hp-mid" data-act="pad" data-id="${p.id}" aria-label="Change HP">
      <span class="hp-line"><b>${p.hp}</b><span>/ ${p.max}</span>${p.temp?`<em>+${p.temp} temp</em>`:""}</span>${meter(p)}
    </button>
    <button class="step plus" data-act="heal1" data-id="${p.id}" aria-label="Gain 1 HP">+</button></div>`;
}
const subline=p=>[p.race,p.cls].filter(Boolean).join(" ")+(p.lvl?` · Lv ${p.lvl}`:"");
const pp=p=>10+mod(p.abil.wis);
const ORD=["1st","2nd","3rd","4th","5th","6th","7th","8th","9th"];
function slotsOf(p){if(!Array.isArray(p.slots)||p.slots.length!==9)p.slots=Array.from({length:9},()=>({max:0,used:0}));return p.slots}
function restoreSlots(p){slotsOf(p).forEach(s=>s.used=0)}
function slotBlock(p){
  const sl=slotsOf(p),rows=sl.map((s,i)=>({s,i})).filter(x=>x.s.max>0);
  return `<div class="slots"><div class="items-h"><span class="lbl">Spell slots</span><button class="linkbtn" data-act="slots" data-id="${p.id}">Edit slots</button></div>
    ${rows.length?rows.map(({s,i})=>{const av=s.max-s.used;
      return `<div class="slot-row"><span class="slot-l">${ORD[i]}</span><div class="pips">${Array.from({length:s.max},(_,k)=>`<button class="pip${k<av?"":" spent"}" data-act="pip" data-id="${p.id}" data-lv="${i}" data-on="${k<av?1:0}" aria-label="${ORD[i]} level slot ${k<av?"available, tap to use":"used, tap to restore"}"></button>`).join("")}</div><span class="slot-n">${av}/${s.max}</span></div>`}).join("")
      :`<p class="none" style="margin:0;color:var(--faint);font-style:italic;font-size:.88rem">No spell slots</p>`}</div>`;
}

/* ---------- Render ---------- */
const main=document.getElementById("main");
let renderHeld=false,remoteTick=false;
function render(){
  const ae=document.activeElement;
  if(ae&&main.contains(ae)&&(ae.tagName==="TEXTAREA"||(ae.tagName==="INPUT"&&ae.type!=="checkbox"))&&remoteTick){renderHeld=true;remoteTick=false;livePill();return}
  remoteTick=false;renderHeld=false;
  livePill();
  const m=S.core.mode;
  document.getElementById("switch").dataset.mode=m;
  ["dm","player","camps"].forEach(k=>document.getElementById("tab-"+k).setAttribute("aria-selected",m===k));
  const C=(m==="dm"&&dmUnlocked())?dmCamp().combat:(isClient()?CL.combat:null);
  document.body.classList.toggle("in-combat",!!(C&&C.active&&C.list.length));
  main.innerHTML=m==="dm"?renderDM():m==="player"?renderPlayer():renderCamps();
  renderTurnbar();
  if(m==="dm")afterRender();
}
function partySummary(ps,dm){
  const down=ps.filter(p=>p.hp<=0).length,totHp=ps.reduce((a,p)=>a+p.hp,0),totMax=ps.reduce((a,p)=>a+p.max,0);
  return `<div class="summary"><span><b class="num">${ps.length}</b> heroes</span><span>Party HP <b class="num">${totHp}/${totMax}</b></span>${down?`<span style="color:var(--blood)"><b class="num" style="color:var(--blood)">${down}</b> down</span>`:""}${dm?`<button class="linkbtn" data-act="longrest">Long rest all</button>`:""}</div>`;
}
/* DM tab */
function dmUnlocked(){const m=activeMeta();return !!(m&&KEYS[m.id])}
function renderDM(){
  if(!S.core.camps.length)return `<div class="empty"><h2>Run a campaign</h2><p>Create a campaign to get a table code for your players. A DM password keeps the DM screen yours, and lets you open the campaign on another device.</p>
    <div class="join-add" style="justify-content:center"><button class="btn gold" data-act="newCamp">+ Create campaign</button>${LIVE_OK?`<button class="btn" data-act="openCamp">Open with code &amp; password</button>`:""}</div></div>`;
  if(!S.core.dmOpen||!S.core.camps.some(c=>c.id===S.core.dmOpen))return renderCampHome();
  if(S.core.active!==S.core.dmOpen)S.core.active=S.core.dmOpen;
  const meta=activeMeta();
  if(!dmUnlocked()){
    const first=!meta.ver;
    return `<div class="bar dl-bar"><button class="btn" data-act="dlHome">← Campaigns</button><h2 class="dl-title">${esc(meta.name)}</h2></div><form class="lock" data-form="${first?"setpw":"unlock"}">
      <h2>${esc(meta.name)}</h2>
      <p class="hint" style="margin:0;color:var(--muted)">${first?"Set a DM password for this campaign. You'll need it to open the DM screen, and to open this campaign on another device.":"Enter the DM password to open this campaign."}</p>
      <input type="password" id="pw1" autocomplete="${first?"new-password":"current-password"}" placeholder="DM password" aria-label="DM password">
      ${first?`<input type="password" id="pw2" autocomplete="new-password" placeholder="Type it again" aria-label="Confirm DM password">`:""}
      <p class="hint" id="pwMsg" style="margin:0;color:var(--warn)" hidden></p>
      <button class="btn gold">${first?"Set password":"Open"}</button></form>`;
  }
  return dmLiveView();
}
function card(p){
  const st=hpState(p);
  return `<article class="pc${st==="down"?" down":""}">
    <div class="pc-top"><div><h3>${esc(p.name)}${p.ex?`<span class="tag">Example</span>`:""}${st==="down"?`<span class="tag down">Down</span>`:""}</h3><p class="sub">${esc(subline(p))}</p></div>
      <div class="shield" title="Armour class"><div><small>AC</small><b>${p.ac}</b></div></div></div>
    ${hpBlock(p)}
    <div class="abil">${ABIL.map(a=>`<div class="ab"><small>${a.toUpperCase()}</small><b>${p.abil[a]}</b><span>${sg(mod(p.abil[a]))}</span></div>`).join("")}</div>
    <div class="mini"><span>Speed <b>${p.speed}</b></span><span>Passive Perc <b>${pp(p)}</b></span><span>Gold <b>${p.gold}</b></span></div>
    ${p.conds.length?`<div class="conds">${p.conds.map(c=>`<span class="chip">${esc(c)}</span>`).join("")}</div>`:""}
    ${survBlock(p)}
    ${slotBlock(p)}
    <div class="items"><div class="items-h"><span class="lbl">Carrying</span><button class="linkbtn" data-act="items" data-id="${p.id}">Edit items</button></div>
      ${p.items.length?`<ul>${p.items.map(i=>`<li><span>${i.k==="weapon"?"⚔ ":""}${esc(i.n)}</span>${i.q>1?`<span class="q">×${i.q}</span>`:""}</li>`).join("")}</ul>`:`<p class="none" style="margin:0">Nothing carried</p>`}</div>
    ${spellBlock(p)}
    <div class="pc-foot"><button class="btn" data-act="conds" data-id="${p.id}">Conditions</button><button class="btn" data-act="edit" data-id="${p.id}">Edit stats</button></div>
  </article>`;
}
/* Player tab: the person's own characters */
function renderPlayer(){
  const v=S.core.view&&findChar(S.core.view);
  if(v)return `<div class="backrow"><button class="linkbtn" data-act="backChars">‹ My characters</button></div>`+renderSheet(v);
  if(!S.chars.length)return `<div class="empty"><h2>My characters</h2><p>Make a sheet for each character you play. Pick a class, race and level and the stats fill themselves in. Then add them to a campaign.</p><button class="btn gold" data-act="newChar">+ New character</button></div>`;
  return `<div class="list-h"><h2>My characters</h2><button class="btn gold" data-act="newChar">+ New character</button></div>
    <div class="clist2">${S.chars.map(p=>{const st=hpState(p);return `<button class="charcard" data-act="openChar" data-id="${p.id}">
      <span class="cc-main"><b>${esc(p.name)}</b><small>${esc(subline(p))}</small></span>
      <span class="cc-hp"><span class="num">${p.hp}/${p.max}</span>${meter(p)}</span>
      <span class="cc-ac"><small>AC</small><b class="num">${p.ac}</b></span>${st==="down"?`<span class="tag down">Down</span>`:""}</button>`}).join("")}</div>`;
}
function renderSheet(p){
  const own=!!findChar(p.id);
  return `<div class="me">
    <div class="me-head"><div><h2>${esc(p.name)}${p.ex?`<span class="tag">Example</span>`:""}</h2><p class="sub">${esc(subline(p))}</p></div>
      <div class="me-acts">${own&&LIVE_OK?`<button class="btn gold" data-act="shareChar" data-id="${p.id}">Add to a campaign</button>`:""}<button class="btn" data-act="edit" data-id="${p.id}">Edit</button></div></div>
    <div class="panel big-hp"><span class="lbl">Hit points</span>${hpBlock(p)}
      ${p.conds.length?`<div class="conds">${p.conds.map(c=>`<span class="chip">${esc(c)}</span>`).join("")}</div>`:""}
      <div class="foot"><button class="btn" data-act="conds" data-id="${p.id}">Conditions</button><button class="btn" data-act="rest" data-id="${p.id}">Long rest</button></div></div>
    <div class="stats3"><div class="stat"><small>AC</small><b>${p.ac}</b></div><div class="stat"><small>SPEED</small><b>${p.speed}</b></div><div class="stat"><small>PASSIVE PERC</small><b>${pp(p)}</b></div></div>
    <div class="panel">${slotBlock(p).replace('class="slots"','class="slots" style="border:0;padding:0"')}</div>
    <div class="panel"><span class="lbl">Abilities</span>
      <div class="abil-big">${ABIL.map(a=>`<button data-act="roll" data-id="${p.id}" data-a="${a}"><small>${a.toUpperCase()}</small><b>${p.abil[a]}</b><span>${sg(mod(p.abil[a]))}</span></button>`).join("")}</div>

    <div class="panel"><div class="items-h"><span class="lbl">Inventory</span><span class="mini">Gold <b>${p.gold}</b></span></div>

      <form class="inv-add" data-form="additem" data-id="${p.id}"><input type="text" id="me-newitem" placeholder="Add an item" aria-label="New item"><button class="btn gold">Add</button></form></div>
    <div class="panel">${spellBlock(p).replace('class="spells"','class="spells" style="border:0;padding:0"')}</div>
    <div class="panel"><label class="lbl" for="me-notes">Notes</label><textarea class="notes" id="me-notes" data-notes="${p.id}" placeholder="Features, backstory, what happened last session">${esc(p.notes)}</textarea></div>
  </div>`;
}
function irow(i,pid){
  return `<div class="irow" data-item="${i.id}" data-id="${pid}"><input type="text" value="${esc(i.n)}" data-iname aria-label="Item name">
    <button class="sq" data-act="iq-" aria-label="Fewer">−</button><span class="q">${i.q}</span><button class="sq" data-act="iq+" aria-label="More">+</button>
    <button class="sq x" data-act="idel" aria-label="Remove item">×</button></div>`;
}
/* My campaigns tab: campaigns joined with a code */
function renderCamps(){
  if(!LIVE_OK)return `<div class="empty"><h2>My campaigns</h2><p>Open Table Keeper at tablekeeper-dnd.github.io to join campaigns.</p></div>`;
  const J=S.core.joined;
  if(!isClient()){
    return `<form class="join" data-form="join"><div><span class="lbl">Join a campaign</span><p class="hint" style="margin:2px 0 0">Enter the code from your DM.</p></div>
      <div class="join-row"><input type="text" id="join-code" maxlength="7" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="ABC123" aria-label="Campaign code"><button class="btn gold">Join</button></div></form>
      ${J.length?`<div class="list-h"><h2>My campaigns</h2></div><div class="clist2">${J.map(j=>`<div class="charcard jcard"><button class="cc-open" data-act="openJoin" data-code="${esc(j.code)}"><span class="cc-main"><b>${esc(j.name||"Campaign")}</b><small class="num">${esc(j.code)}</small></span><span class="linkbtn">Open ›</span></button><button class="sq x" data-act="forgetJoin" data-code="${esc(j.code)}" aria-label="Remove ${esc(j.name||j.code)}">×</button></div>`).join("")}</div>`
        :`<p class="hint" style="text-align:center;margin-top:18px">Campaigns you join appear here, so you can open them again quickly.</p>`}`;
  }
  const ps=CL.camp.players;
  let h=`<div class="backrow"><button class="linkbtn" data-act="backJoin">‹ My campaigns</button></div>`+liveBanner();
  if(CL.status==="ok"||ps.length){
    h+=ps.length?partySummary(ps,false)+`<div class="grid">`+ps.map(card).join("")+`</div>`
      :`<div class="empty"><h2>No heroes yet</h2><p>Add your character and it appears on the DM's screen.</p></div>`;
    if(S.chars.length)h+=`<div class="join-add" style="margin-top:14px"><button class="btn gold" data-act="addMine">+ Add one of my characters</button></div>`;
    else h+=`<p class="hint" style="margin-top:14px">To add your character, make one on the <b>Player</b> tab first.</p>`;
    h+=combatSection();
  }
  return h;

/* ---------- Sheet ---------- */
const sheet=document.getElementById("sheet"),scrim=document.getElementById("scrim"),sb=document.getElementById("sheetBody");
let onClose=null;
function openSheet(html,after){sb.innerHTML=html;sheet.classList.add("on");scrim.classList.add("on");if(after)after(sb)}
function closeSheet(){sheet.classList.remove("on");scrim.classList.remove("on");if(onClose){const f=onClose;onClose=null;f()}render()}
scrim.addEventListener("click",closeSheet);

function padSheet(p){
  openSheet(`<h2>${esc(p.name)}</h2><div class="stack">

const FULL=[[],[2],[3],[4,2],[4,3],[4,3,2],[4,3,3],[4,3,3,1],[4,3,3,2],[4,3,3,3,1],[4,3,3,3,2],[4,3,3,3,2,1],[4,3,3,3,2,1],

function optList(list,cur){
  const l=cur&&!list.includes(cur)?[cur,...list]:list;

}
function slotsFor(c,lvl){
  let m=[];
  if(c.cast==="full")m=FULL[lvl];
  else if(c.cast==="half")m=lvl>=2?FULL[Math.ceil(lvl/2)]:[];
  else if(c.cast==="halfup")m=FULL[Math.ceil(lvl/2)];
  else if(c.cast==="pact"){const n=lvl>=17?4:lvl>=11?3:lvl>=2?2:1,lv=Math.min(5,Math.ceil(lvl/2));m=[];m[lv-1]=n}

function build(cls,race,lvl){
  const c=CLASSES[cls];if(!c)return null;
  const r=RACES[race]||{b:{},sp:30},arr=[15,14,13,12,10,8],a={};
  c.pri.forEach((k,i)=>a[k]=arr[i]);
  Object.entries(r.b).forEach(([k,n])=>a[k]+=n);
  if(r.flex){let n=r.flex;for(const k of c.pri){if(!n)break;if(!r.b[k]){a[k]+=1;n--}}}
  // Ability score improvements: +2 to the main ability, then the next, up to 20
  c.asi.filter(x=>x<=lvl).forEach(()=>{let pts=2;for(const k of c.pri){while(pts&&a[k]<20){a[k]++;pts--}if(!pts)break}});
  const m=k=>mod(a[k]),con=m("con");
  const hp=Math.max(1,c.hd+con)+(lvl-1)*Math.max(1,c.hd/2+1+con);
  const AC={none:[10+m("dex"),"no armour"],barb:[10+m("dex")+con,"Unarmoured Defence"],monk:[10+m("dex")+m("wis"),"Unarmoured Defence"],
    leather:[11+m("dex"),"leather armour"],"leather+shield":[13+m("dex"),"leather armour and shield"],studded:[12+m("dex"),"studded leather"],
    scale:[14+Math.min(2,m("dex")),"scale mail"],"scale+shield":[16+Math.min(2,m("dex")),"scale mail and shield"],"chain+shield":[18,"chain mail and shield"]}[c.ac];
  return {abil:a,hp,ac:AC[0],armour:AC[1],hd:c.hd,speed:(c.ac==="monk"&&lvl>=2?r.sp+(lvl>=18?30:lvl>=14?25:lvl>=10?20:lvl>=6?15:10):r.sp+(c.ac==="barb"&&lvl>=5?10:0)),
    slots:slotsFor(c,lvl),items:c.kit};
}

  if(KNOWN[p.cls])spells=KNOWN[p.cls][lvl-1];
  else{kind="prepared";
    if(p.cls==="Cleric"||p.cls==="Druid")spells=Math.max(1,mod(p.abil.wis)+lvl);
    else if(p.cls==="Wizard")spells=Math.max(1,mod(p.abil.int)+lvl);
    else if(p.cls==="Paladin")spells=lvl<2?0:Math.max(1,mod(p.abil.cha)+Math.floor(lvl/2));
    else if(p.cls==="Artificer")spells=Math.max(1,mod(p.abil.int)+Math.floor(lvl/2));}
  const sl=slotsFor(c,lvl);let maxLv=0;sl.forEach((s,i)=>{if(s.max)maxLv=i+1});
  if(p.cls==="Warlock")maxLv=Math.min(5,Math.ceil(lvl/2));
  return{caster:true,cantrips,spells,kind,maxLv,code:CODE[p.cls]};
}
function spellsOf(p){if(!p.spells||!Array.isArray(p.spells.c))p.spells={c:[],s:[]};return p.spells}
function spellBlock(p){
  const r=spellRules(p),sp=spellsOf(p),c=sp.c.filter(Boolean),s=sp.s.filter(Boolean);
  if(!r.caster&&!c.length&&!s.length)return "";
  const by={};s.forEach(n=>{const l=SPELL_LV[n]??1;(by[l]=by[l]||[]).push(n)});
  const cnt=(have,want)=>`<b class="${have<want?"short":""}">${have}/${want}</b>`;
  return `<div class="spells"><div class="items-h"><span class="lbl">Spells</span><button class="linkbtn" data-act="spells" data-id="${p.id}">Edit spells</button></div>
    ${r.caster?`<div class="count">Cantrips ${cnt(c.length,r.cantrips)} · Spells ${r.kind} ${cnt(s.length,r.spells)}</div>`:""}
    ${c.length?`<div class="sp-l"><span>Cantrip</span><span>${c.map(esc).join(", ")}</span></div>`:""}
    ${Object.keys(by).sort((a,b)=>a-b).map(l=>`<div class="sp-l"><span>${ORD[l-1]}</span><span>${by[l].map(esc).join(", ")}</span></div>`).join("")}
    ${!c.length&&!s.length?`<p class="none" style="margin:0;color:var(--faint);font-style:italic;font-size:.88rem">No spells chosen yet</p>`:""}</div>`;
}
function spellOptions(r,cantrip,cur){
  const pool=SPELLS.filter(s=>(cantrip?s.lv===0:s.lv>=1&&s.lv<=r.maxLv)&&(!r.code||s.c.includes(r.code)));
  const groups={};pool.forEach(s=>{(groups[s.lv]=groups[s.lv]||[]).push(s.n)});
  let h=`<option value="">${cantrip?"Choose a cantrip…":"Choose a spell…"}</option>`;
  if(cur&&!pool.some(s=>s.n===cur))h+=`<option selected>${esc(cur)}</option>`;
  Object.keys(groups).sort((a,b)=>a-b).forEach(l=>{h+=`<optgroup label="${LVNAME(+l)}">`+groups[l].map(n=>`<option${n===cur?" selected":""}>${esc(n)}</option>`).join("")+`</optgroup>`});
  return h;
}
function spellSheet(p){
  const r=spellRules(p),sp=spellsOf(p);
  while(sp.c.length<r.cantrips)sp.c.push("");
  while(sp.s.length<r.spells)sp.s.push("");

  const intro=r.caster?`A level ${p.lvl} ${esc(p.cls)} has <b>${r.cantrips}</b> cantrips and <b>${r.spells}</b> spells ${r.kind}${r.maxLv?`, up to ${ORD[r.maxLv-1]} level`:""}.${r.kind==="prepared"?" Prepared spells use their ability modifier plus level.":""}${p.cls==="Warlock"&&p.lvl>=11?" Mystic Arcanum (6th+) isn't counted here.":""}`
    :`${p.cls?esc(p.cls)+"s don't":"This character doesn't"} cast spells by default. Add spells here for subclasses like Eldritch Knight or Arcane Trickster, or from feats.`;
  openSheet(`<h2>${esc(p.name)}: spells</h2><div class="stack">

    <div class="f"><span class="lbl">Cantrips</span><div class="picks">${list(sp.c,"c",true)}</div><button type="button" class="linkbtn" data-spadd="c" style="align-self:flex-start">+ Add cantrip</button></div>
    <div class="f"><span class="lbl">Spells ${r.kind}</span><div class="picks">${list(sp.s,"s",false)}</div><button type="button" class="linkbtn" data-spadd="s" style="align-self:flex-start">+ Add spell</button></div>
    <div class="foot"><span></span><button class="btn gold" data-x="done">Done</button></div></div>`,b=>{

    b.querySelectorAll("[data-sprm]").forEach(x=>x.onclick=()=>{sp[x.dataset.sprm].splice(+x.dataset.i,1);commit(keyFor(p.id));spellSheet(p)});

    b.querySelector('[data-x="done"]').onclick=()=>{sp.c=sp.c.filter(Boolean);sp.s=sp.s.filter(Boolean);commit(keyFor(p.id));closeSheet()};
  });

      else{S.chars=S.chars.filter(q=>q.id!==p.id);S.core.view=null;commit("chars");commit("core")}
      closeSheet();
    };
  });
}

/* ---------- DM passwords. A campaign's password unlocks the DM screen and encrypts the copy kept on the relays,
   so the DM can open the campaign on another device with its code and password. ---------- */
const KEYS={};
const b64=u8=>{let s="";for(let i=0;i<u8.length;i+=8192)s+=String.fromCharCode.apply(null,u8.subarray(i,i+8192));return btoa(s)};
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function deriveBits(pw,salt){
  const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveBits"]);
  return new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2",salt:unb64(salt),iterations:150000,hash:"SHA-256"},km,256));
}
async function verOf(bits){return b64(new Uint8Array(await crypto.subtle.digest("SHA-256",bits))).slice(0,24)}
const aesKey=bits=>crypto.subtle.importKey("raw",bits,"AES-GCM",false,["encrypt","decrypt"]);
function rememberKey(id,bits){try{sessionStorage.setItem("tk.k."+id,b64(bits))}catch(e){}}
async function restoreKeys(){
  for(const m of S.core.camps){try{const s=sessionStorage.getItem("tk.k."+m.id);if(s&&m.ver){const bits=unb64(s);if(await verOf(bits)===m.ver)KEYS[m.id]=await aesKey(bits)}}catch(e){}}
}
async function setPassword(meta,pw){
  meta.salt=b64(crypto.getRandomValues(new Uint8Array(16)));
  const bits=await deriveBits(pw,meta.salt);meta.ver=await verOf(bits);
  KEYS[meta.id]=await aesKey(bits);rememberKey(meta.id,bits);commit("core");
}
async function unlockCamp(meta,pw){
  const bits=await deriveBits(pw,meta.salt);
  if(await verOf(bits)!==meta.ver)return false;
  KEYS[meta.id]=await aesKey(bits);rememberKey(meta.id,bits);return true;
}
async function seal(key,obj){
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=new Uint8Array(await crypto.subtle.encrypt({name:"AES-GCM",iv},key,new TextEncoder().encode(JSON.stringify(obj))));
  return {iv:b64(iv),ct:b64(ct)};
}
async function unseal(key,box){const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:unb64(box.iv)},key,unb64(box.ct));return JSON.parse(new TextDecoder().decode(pt))}
function lockCamp(id){delete KEYS[id];try{sessionStorage.removeItem("tk.k."+id)}catch(e){}if(H.campId===id)stopHost()}

function openCampSheet(){
  openSheet(`<h2>Open a campaign</h2><form class="stack" id="of">
    <p class="hint" style="margin:0;color:var(--muted)">Open a campaign you run on another device. It needs to have been opened there since this feature was added.</p>
    <div class="f"><label for="o-code">Campaign code</label><input type="text" id="o-code" maxlength="7" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="ABC123" class="num"></div>
    <div class="f"><label for="o-pw">DM password</label><input type="password" id="o-pw" autocomplete="current-password"></div>
    <p class="hint" id="ofMsg" style="margin:0" hidden></p>
    <div class="foot"><button type="button" class="btn ghost" data-x="c">Cancel</button><button class="btn gold">Open</button></div></form>`,b=>{
    b.querySelector('[data-x="c"]').onclick=closeSheet;
    const msg=(t,c)=>{const m=b.querySelector("#ofMsg");m.hidden=false;m.textContent=t;m.style.color=c||"var(--warn)"};
    b.querySelector("#of").onsubmit=e=>{e.preventDefault();
      const code=b.querySelector("#o-code").value.toUpperCase().replace(/[^A-Z0-9]/g,""),pw=b.querySelector("#o-pw").value;
      if(code.length!==6){msg("Codes are 6 letters and numbers.");return}
      if(!pw){msg("Enter the DM password.");return}
      msg("Looking for that campaign…","var(--muted)");
      let got=false;const T=TOPIC(code)+"/dm";
      relayRun(c=>{c.on("message",async(t,buf)=>{
        if(got||t!==T)return;const txt=new TextDecoder().decode(buf);if(!txt)return;
        let box;try{box=JSON.parse(txt)}catch(err){return}
        if(!box||box.t!=="dm"||!box.salt)return;got=true;
        try{
          const bits=await deriveBits(pw,box.salt);
          if(await verOf(bits)!==box.ver){msg("That password isn't right.");got=false;return}
          const key=await aesKey(bits),data=await unseal(key,box);
          let meta=S.core.camps.find(x=>x.code===code);
          if(!meta){meta={id:uid(),name:data.name||"Campaign",code};S.core.camps.push(meta)}
          meta.name=data.name||meta.name;meta.salt=box.salt;meta.ver=box.ver;
          S.camps[meta.id]=Object.assign({players:[],combat:blankCombat()},data.camp||{});
          (data.myMonsters||[]).forEach(m=>{if(!S.core.myMonsters.some(x=>x.id===m.id))S.core.myMonsters.push(m)});
          KEYS[meta.id]=key;rememberKey(meta.id,bits);S.core.active=meta.id;S.core.dmOpen=meta.id;
          commit("core");commit("camp_"+meta.id);closeSheet();startHost();
        }catch(err){msg("Couldn't open that campaign. Check the password.")}
      });c.subscribe(T,{qos:1})},9000).catch(()=>msg("Couldn't reach the internet. Check your connection."));
      setTimeout(()=>{if(!got)msg("No campaign found for that code. Open it once on the DM's original device, then try again.")},8500);
    };
  });
}

const MONSTERS=MON_SRC.split("\n").map(l=>{const[n,cr,ac,hp,hd,dex,sp,atk]=l.split("|");return{name:n,cr,ac:+ac,hp:+hp,hd,dex:+dex,speed:sp,atk}});
const crNum=c=>{c=String(c||"0");return c.includes("/")?(+c.split("/")[0])/(+c.split("/")[1]):+c||0};
function rollDice(expr){
  const m=String(expr||"").replace(/\s/g,"").match(/^(\d+)d(\d+)([+-]\d+)?$/i);if(!m)return null;
  let t=+(m[3]||0);for(let i=0;i<+m[1];i++)t+=1+Math.floor(Math.random()*+m[2]);return Math.max(1,t);
}
const d20=()=>1+Math.floor(Math.random()*20);
function allMonsters(){return[...S.core.myMonsters.map(m=>({...m,custom:true})),...MONSTERS]}
function monByKey(k){if(k.startsWith("my:"))return S.core.myMonsters.find(m=>m.id===k.slice(3));return MONSTERS.find(m=>m.name===k.slice(4))}

/* ---------- Combat: a section under the party, started and ended by the DM ---------- */
function combatants(){
  return CB().list.map(e=>{
    if(e.kind==="p"){const f=findPlayer(e.ref);return f?{e,p:f.p,dex:mod(f.p.abil.dex)}:null}
    return {e,p:e,dex:e.dex||0};
  }).filter(Boolean);
}
function ordered(){
  return combatants().sort((a,b)=>(b.e.init??-99)-(a.e.init??-99)||b.dex-a.dex||String(a.p.name).localeCompare(b.p.name));
}
const isOut=x=>x.e.kind==="m"&&(x.e.hidden?!!x.e.dead:x.p.hp<=0);
function step(dir){
  const o=ordered();if(!o.length)return;
  const C=CB();let i=o.findIndex(x=>x.e.id===C.cur);
  if(i<0){const f=o.find(x=>!isOut(x));C.cur=f?f.e.id:o[0].e.id;C.round=C.round||1;commit(campKey());render();return}
  for(let n=0;n<o.length;n++){
    i+=dir;
    if(i>=o.length){i=0;C.round++}
    if(i<0){i=o.length-1;C.round=Math.max(1,C.round-1)}
    if(!isOut(o[i]))break;
  }
  C.cur=o[i].e.id;commit(campKey());render();
  const el=document.querySelector(".cb.cur");if(el)el.scrollIntoView({block:"nearest",behavior:"smooth"});
}
function combatSection(){
  const C=CB(),dm=!isClient();
  if(!C.active)return dm?`<div class="csec-start"><button class="btn gold" data-act="cStart">Start combat</button><p class="hint" style="margin:0">Opens a combat section here and on every player's screen. The party is added and initiative is rolled for you.</p></div>`:"";
  const o=ordered();
  let h=`<section class="csec" id="combat"><div class="csec-h"><h2>Combat</h2><span class="num">Round ${C.round}</span></div>`;
  if(dm){
    const inFight=new Set(C.list.filter(e=>e.kind==="p").map(e=>e.ref));
    const left=dmCamp().players.filter(p=>!inFight.has(p.id)).length;
    h+=`<div class="cbar">${left?`<button class="btn" data-act="cParty">+ Party</button>`:""}<button class="btn gold" data-act="cMon">+ Monster</button>
      ${o.length?`<button class="btn" data-act="cRoll">Reroll monster initiative</button>`:""}<button class="btn danger" data-act="cEnd">End combat</button></div>`;
  }
  if(!o.length)return h+`<p class="hint" style="margin:10px 0 0">${dm?"Add the party and some monsters.":"The DM is setting up the fight…"}</p></section>`;
  h+=`<div class="clist">`+o.map(x=>dm?dmRow(x,C):playerRow(x,C)).join("")+`</div>`;
  return h+`</section>`;
}
function dmRow(x,C){
  const {e,p}=x,cur=e.id===C.cur,out=isOut(x),pc=e.kind==="p";
  return `<article class="cb${cur?" cur":""}${out?" dead":""}">
    <button class="init" data-act="cInit" data-cid="${e.id}" aria-label="Initiative for ${esc(p.name)}"><small>INIT</small><b>${e.init??"–"}</b></button>
    <div class="cb-main">
      <div class="cb-top"><button class="cb-name" ${pc?"":`data-act="cInfo" data-cid="${e.id}"`}><b>${esc(p.name)}</b><span class="kind ${pc?"p":"m"}">${pc?"Player":"CR "+esc(e.cr||"?")}</span>${out?`<span class="tag down">Dead</span>`:pc&&p.hp<=0?`<span class="tag down">Down</span>`:""}</button>
        <div class="cb-ac">AC <b>${p.ac}</b></div></div>
      ${hpBlock(p)}
      ${p.conds.length?`<div class="conds">${p.conds.map(c=>`<span class="chip">${esc(c)}</span>`).join("")}</div>`:""}
      ${!pc&&e.atk?`<p class="atk">${esc(e.atk)}</p>`:""}
      <div class="cb-acts"><button class="btn" data-act="conds" data-id="${p.id}">Conditions</button>${pc?"":`<button class="btn" data-act="cInfo" data-cid="${e.id}">Details</button>`}<button class="btn ghost" data-act="cDel" data-cid="${e.id}">Remove</button></div>
    </div></article>`;
}
function playerRow(x,C){
  const {e,p}=x,cur=e.id===C.cur,pc=e.kind==="p",out=isOut(x);
  if(!pc)return `<article class="cb${cur?" cur":""}${out?" dead":""}"><div class="init"><small>INIT</small><b>${e.init??"–"}</b></div>
    <div class="cb-main"><div class="cb-top"><div class="cb-name"><b>${esc(e.name)}</b><span class="kind m">Monster</span>${out?`<span class="tag down">Dead</span>`:""}</div></div>
    ${e.conds&&e.conds.length?`<div class="conds">${e.conds.map(c=>`<span class="chip">${esc(c)}</span>`).join("")}</div>`:""}</div></article>`;
  return `<article class="cb${cur?" cur":""}"><div class="init"><small>INIT</small><b>${e.init??"–"}</b></div>
    <div class="cb-main"><div class="cb-top"><div class="cb-name"><b>${esc(p.name)}</b><span class="kind p">Player</span>${p.hp<=0?`<span class="tag down">Down</span>`:""}</div><div class="cb-ac">AC <b>${p.ac}</b></div></div>
    ${hpBlock(p)}${p.conds.length?`<div class="conds">${p.conds.map(c=>`<span class="chip">${esc(c)}</span>`).join("")}</div>`:""}
    <div class="cb-acts"><button class="btn" data-act="conds" data-id="${p.id}">Conditions</button></div></div></article>`;
}
const tb=document.getElementById("turnbar");
function renderTurnbar(){
  const m=S.core.mode,dm=m==="dm"&&dmUnlocked(),cl=isClient();
  const C=dm?dmCamp().combat:cl?CL.combat:null;
  if(!C||!C.active||!C.list.length){tb.hidden=true;return}
  tb.hidden=false;
  const cur=combatants().find(x=>x.e.id===C.cur);
  if(cl){tb.innerHTML=`<span></span><div class="now"><small>Round ${C.round}</small><b>${cur?esc(cur.p.name)+"'s turn":"Waiting for the DM"}</b></div><span></span>`;return}
  tb.innerHTML=`<button class="btn" data-act="cPrev">Back</button>
    <div class="now"><small>Round ${C.round}</small><b>${cur?esc(cur.p.name)+"'s turn":"Ready to start"}</b></div>
    <button class="btn gold" data-act="cNext">${cur?"Next":"Start"}</button>`;
}
function startCombat(){
  const c=dmCamp();c.combat=blankCombat();c.combat.active=true;
  c.players.forEach(p=>c.combat.list.push({id:uid(),kind:"p",ref:p.id,init:d20()+mod(p.abil.dex)}));
  commit(campKey());render();
  setTimeout(()=>{const el=document.getElementById("combat");if(el)el.scrollIntoView({block:"start",behavior:"smooth"})},50);
}
function endCombat(){dmCamp().combat=blankCombat();commit(campKey());render()}
function addParty(){
  const C=CB(),inFight=new Set(C.list.filter(e=>e.kind==="p").map(e=>e.ref));
  dmCamp().players.filter(p=>!inFight.has(p.id)).forEach(p=>C.list.push({id:uid(),kind:"p",ref:p.id,init:d20()+mod(p.abil.dex)}));
  commit(campKey());render();
}
function addMonsters(m,count,rollHp){
  const C=CB(),base=m.name,existing=C.list.filter(e=>e.kind==="m"&&e.base===base).length,L="ABCDEFGHIJKLMNOPQRSTUVWXYZ";
  for(let i=0;i<count;i++){
    const hp=(rollHp&&rollDice(m.hd))||m.hp;
    const tag=(count>1||existing)?" "+(L[existing+i]||existing+i+1):"";
    C.list.push({id:uid(),kind:"m",base,name:base+tag,cr:m.cr,ac:m.ac,hp,max:hp,temp:0,dex:m.dex||0,speed:m.speed||"",atk:m.atk||"",hd:m.hd||"",conds:[],init:d20()+(m.dex||0)});
  }
  commit(campKey());
}
function monSheet(sel){
  const all=allMonsters();
  const groups={};MONSTERS.forEach(m=>{(groups[m.cr]=groups[m.cr]||[]).push(m)});
  const crs=Object.keys(groups).sort((a,b)=>crNum(a)-crNum(b));
  const opts=(S.core.myMonsters.length?`<optgroup label="My monsters">${S.core.myMonsters.map(m=>`<option value="my:${m.id}">${esc(m.name)} (CR ${esc(m.cr)})</option>`).join("")}</optgroup>`:"")
    +crs.map(c=>`<optgroup label="CR ${c}">${groups[c].map(m=>`<option value="srd:${esc(m.name)}">${esc(m.name)}</option>`).join("")}</optgroup>`).join("");
  let count=1;
  openSheet(`<h2>Add monster</h2><div class="stack">
    <div class="f"><label for="m-sel">Monster</label><select class="plain" id="m-sel"><option value="">Choose a monster…</option>${opts}</select></div>
    <div class="mon-prev" id="m-prev"><p class="hint" style="margin:0">Pick a monster to see its stats. Monsters come from the free SRD rules, grouped by challenge rating.</p></div>
    <div class="row"><div class="f"><span class="lbl">How many</span><div class="stepper"><button type="button" class="sq" id="m-minus" aria-label="Fewer">−</button><b id="m-count">1</b><button type="button" class="sq" id="m-plus" aria-label="More">+</button></div></div>
      <div class="f"><label for="m-hp">Hit points</label><select class="plain" id="m-hp"><option value="avg">Average</option><option value="roll">Roll each</option></select></div></div>
    <div class="foot"><button type="button" class="btn" id="m-custom">Create your own</button><button type="button" class="btn gold" id="m-add">Add to fight</button></div></div>`,b=>{
    const selEl=b.querySelector("#m-sel"),prev=b.querySelector("#m-prev");
    const show=()=>{const m=selEl.value?monByKey(selEl.value):null;
      if(!m){prev.innerHTML=`<p class="hint" style="margin:0">Pick a monster to see its stats. Monsters come from the free SRD rules, grouped by challenge rating.</p>`;return}
      prev.innerHTML=`<div class="mini"><span>CR <b>${esc(m.cr)}</b></span><span>AC <b>${m.ac}</b></span><span>HP <b>${m.hp}</b>${m.hd?` (${esc(m.hd)})`:""}</span><span>Init <b>${sg(m.dex||0)}</b></span></div>
        ${m.speed?`<div class="mini"><span>Speed <b style="font-family:var(--f-body)">${esc(m.speed)}</b></span></div>`:""}<p class="atk">${esc(m.atk||"No attacks noted")}</p>
        ${m.id?`<button type="button" class="linkbtn" style="align-self:flex-start;color:var(--blood)" id="m-forget">Delete from my monsters</button>`:""}`;
      const fg=b.querySelector("#m-forget");
      if(fg)fg.onclick=()=>{if(fg.dataset.armed!=="1"){fg.dataset.armed="1";fg.textContent="Tap again to delete";return}
        S.core.myMonsters=S.core.myMonsters.filter(x=>x.id!==m.id);commit("core");monSheet()};
    };
    selEl.onchange=show;if(sel){selEl.value=sel;show()}
    const cEl=b.querySelector("#m-count");
    b.querySelector("#m-minus").onclick=()=>{count=Math.max(1,count-1);cEl.textContent=count};

/* ---------- Live campaigns. The DM's device publishes the party through public MQTT relays and players
   follow it with the campaign code, on any Wi-Fi or mobile network. Two relays run side by side. ---------- */
const LIVE_OK=(()=>{try{return window.self===window.top}catch(e){return false}})();
const RELAYS=["wss://broker.emqx.io:8084/mqtt","wss://broker.hivemq.com:8884/mqtt"];
const TOPIC=code=>"tablekeeper-dnd/v1/"+code;
const CHAR_TOPIC=code=>"tablekeeper-dnd/v1/char/"+code;
let mqttLib=null;
function loadMqtt(){
  if(window.mqtt)return Promise.resolve(window.mqtt);
  if(mqttLib)return mqttLib;
  mqttLib=new Promise((ok,bad)=>{const sc=document.createElement("script");sc.src="https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js";
    sc.onload=()=>window.mqtt?ok(window.mqtt):bad(new Error("load"));sc.onerror=()=>{mqttLib=null;bad(new Error("load"))};document.head.appendChild(sc)});
  return mqttLib;
}
function openRelays(subs,onMsg,onUp,onDown){
  return RELAYS.map(url=>{
    const c=window.mqtt.connect(url,{clientId:"tk_"+uid()+uid(),clean:true,keepalive:30,reconnectPeriod:3000,connectTimeout:10000});
    c.on("connect",()=>{c.subscribe(subs,{qos:1});onUp&&onUp(c)});
    c.on("message",(t,buf)=>{const txt=new TextDecoder().decode(buf);if(!txt){onMsg(t,null);return}let d;try{d=JSON.parse(txt)}catch(e){return}onMsg(t,d)});
    c.on("offline",()=>onDown&&onDown());c.on("close",()=>onDown&&onDown());c.on("error",()=>{});
    return c;
  });
}
function pubOn(clients,topic,obj,retain){const s=obj==null?"":JSON.stringify(obj);clients.forEach(c=>{if(c.connected)c.publish(topic,s,{qos:1,retain:!!retain})})}
function relayRun(work,ms){
  return loadMqtt().then(m=>{
    const cs=RELAYS.map(url=>m.connect(url,{clientId:"tk_"+uid()+uid(),clean:true,reconnectPeriod:0,connectTimeout:10000}));
    cs.forEach(c=>{c.on("error",()=>{});c.on("connect",()=>work(c))});
    setTimeout(()=>cs.forEach(c=>{try{c.end(false)}catch(e){}}),ms);
    return cs;
  });
}
/* DM side */
const H={code:null,campId:null,clients:[],seen:{},status:"",beat:null};
const playersOnline=()=>{const now=Date.now();return Object.values(H.seen).filter(t=>now-t<45000).length};
function startHost(){
  const meta=activeMeta();
  if(!LIVE_OK||!meta||!KEYS[meta.id])return;
  if(H.campId===meta.id&&H.clients.length)return;
  stopHost();
  H.code=meta.code;H.campId=meta.id;H.seen={};H.status="connecting";livePill();
  const T=TOPIC(meta.code),id=meta.id;
  loadMqtt().then(()=>{
    if(H.campId!==id)return;
    H.clients=openRelays([T+"/up",T+"/hi",T+"/add/+"],(t,d)=>hostMsg(T,t,d),c=>{
      H.status="ok";c.publish(T+"/state",JSON.stringify(publicState()),{qos:1,retain:true});scheduleBackup();livePill();refreshCodeSheet();render();
    },()=>{if(!H.clients.some(c=>c.connected)){H.status="offline";livePill();refreshCodeSheet()}});
    clearInterval(H.beat);
    H.beat=setInterval(()=>{broadcast();livePill();refreshCodeSheet()},20000);
  }).catch(()=>{H.status="offline";livePill()});
}
function stopHost(){
  clearInterval(H.beat);const old=H.clients;H.clients=[];
  setTimeout(()=>old.forEach(c=>{try{c.end(false)}catch(e){}}),400);
  H.code=null;H.campId=null;H.status="";H.seen={};livePill();
}
function hostMsg(T,t,d){
  if(t===T+"/hi"){if(d&&typeof d.id==="string"){H.seen[d.id]=Date.now();livePill();refreshCodeSheet();if(d.need)scheduleBroadcast()}return}
  if(t===T+"/up"){hostData(d);return}
  if(t.indexOf(T+"/add/")===0&&d&&d.t==="char"&&d.p&&typeof d.p==="object"){
    const c=S.camps[H.campId];if(!c)return;
    if(!c.players.some(p=>p.id===d.p.id)&&c.players.length<20){
      const np=P(Object.assign({},d.p,{name:String(d.p.name||"New hero").slice(0,60),ex:false}));
      c.players.push(np);commit("camp_"+H.campId);remoteTick=true;render();toastMsg(np.name+" joined the party");
    }
    pubOn(H.clients,t,null,true);
  }
}
function publicState(){
  const c=S.camps[H.campId]||{players:[],combat:blankCombat()},meta=S.core.camps.find(x=>x.id===H.campId)||{name:""},C=c.combat||blankCombat();
  const ids=new Set(c.players.map(p=>p.id));
  const list=C.list.filter(e=>e.kind!=="p"||ids.has(e.ref)).map(e=>e.kind==="p"?{id:e.id,kind:"p",ref:e.ref,init:e.init}
    :{id:e.id,kind:"m",name:e.name,init:e.init,dex:e.dex||0,conds:e.conds||[],dead:e.hp<=0,hidden:true});
  return {t:"state",camp:{id:H.campId,name:meta.name,players:c.players},combat:{active:!!C.active,round:C.round,cur:C.cur,list}};
}
let bTimer,kTimer;
function scheduleBroadcast(){clearTimeout(bTimer);bTimer=setTimeout(broadcast,120)}
function broadcast(){if(H.code)pubOn(H.clients,TOPIC(H.code)+"/state",publicState(),true)}
function hostChanged(){scheduleBroadcast();scheduleBackup()}
function scheduleBackup(){clearTimeout(kTimer);kTimer=setTimeout(backup,2500)}
async function backup(){
  const id=H.campId,meta=S.core.camps.find(x=>x.id===id);if(!id||!meta||!KEYS[id]||!meta.salt)return;
  try{const box=await seal(KEYS[id],{name:meta.name,camp:S.camps[id],myMonsters:S.core.myMonsters});
    pubOn(H.clients,TOPIC(meta.code)+"/dm",Object.assign({t:"dm",salt:meta.salt,ver:meta.ver},box),true)}catch(e){}
}
function hostData(d){
  if(!d||d.t!=="players"||!Array.isArray(d.list))return;
  const c=S.camps[H.campId];if(!c)return;
  d.list.forEach(np=>{
    if(!np||typeof np!=="object"||typeof np.id!=="string")return;
    const i=c.players.findIndex(p=>p.id===np.id);
    if(i>=0)Object.assign(c.players[i],np,{id:c.players[i].id});
    else if(c.players.length<20)c.players.push(P(Object.assign({},np,{name:String(np.name||"New hero").slice(0,60),ex:false})));
  });
  commit("camp_"+H.campId);remoteTick=true;render();
}
/* Player side */
const CL={code:null,clients:[],camp:{id:"live",name:"",players:[]},combat:blankCombat(),snap:{},status:"",lastRx:0,me:"p_"+uid()+uid(),hi:null,findT:null};
function openJoin(code){
  if(!LIVE_OK)return;
  if(CL.code===code&&CL.clients.length)return;
  closeJoin();
  CL.code=code;CL.camp={id:"live",name:"",players:[]};CL.combat=blankCombat();CL.snap={};CL.lastRx=0;CL.status="connecting";
  const T=TOPIC(code);
  const hi=need=>pubOn(CL.clients,T+"/hi",{id:CL.me,need:!!need});
  loadMqtt().then(()=>{
    if(CL.code!==code)return;
    CL.clients=openRelays([T+"/state"],(t,d)=>{
      if(t!==T+"/state"||CL.code!==code)return;
      if(!d){if(CL.camp.name){CL.status="ended";render()}return}
      CL.lastRx=Date.now();clientData(d);
    },()=>{
      if(CL.status!=="ok"){CL.status="finding";render()}
      hi(true);clearTimeout(CL.findT);
      CL.findT=setTimeout(()=>{if(CL.code===code&&!CL.lastRx){CL.status="missing";render()}},7000);
    },()=>{if(CL.code===code&&!CL.clients.some(c=>c.connected)){CL.status="offline";render()}});
    clearInterval(CL.hi);
    CL.hi=setInterval(()=>{if(CL.code!==code)return;hi(false);if(CL.lastRx&&CL.status==="ok"&&Date.now()-CL.lastRx>55000){CL.status="dmoffline";render()}},15000);
  }).catch(()=>{CL.status="offline";render()});
  render();
}
function closeJoin(){
  clearInterval(CL.hi);clearTimeout(CL.findT);const old=CL.clients;CL.clients=[];
  setTimeout(()=>old.forEach(c=>{try{c.end(false)}catch(e){}}),400);
  CL.code=null;CL.status="";
}
function clientData(d){
  if(!d||d.t!=="state"||!d.camp||!Array.isArray(d.camp.players))return;
  const firstState=!CL.camp.name;
  CL.camp.name=d.camp.name;CL.camp.id=d.camp.id;
  const j=S.core.joined.find(x=>x.code===CL.code);if(j&&j.name!==d.camp.name){j.name=d.camp.name;commit("core")}
  // Merge in place so open sheets keep editing the same objects
  const cur=new Map(CL.camp.players.map(p=>[p.id,p]));
  CL.camp.players=d.camp.players.map(np=>{const o=cur.get(np.id);if(o){for(const k in o)if(!(k in np))delete o[k];return Object.assign(o,np)}return np});
  CL.snap={};CL.camp.players.forEach(p=>CL.snap[p.id]=JSON.stringify(p));
  CL.combat=Object.assign(blankCombat(),d.combat||{});
  clearTimeout(CL.findT);
  const was=CL.status;CL.status="ok";remoteTick=!firstState&&was==="ok";render();
}
function sendChanges(){
  if(!CL.code||!CL.clients.some(c=>c.connected))return;
  const changed=CL.camp.players.filter(p=>CL.snap[p.id]!==JSON.stringify(p));
  if(!changed.length)return;
  changed.forEach(p=>CL.snap[p.id]=JSON.stringify(p));
  pubOn(CL.clients,TOPIC(CL.code)+"/up",{t:"players",list:changed});
}
function joinCode(raw){
  const code=String(raw||"").toUpperCase().replace(/[^A-Z0-9]/g,"");
  if(code.length!==6){toastMsg("Campaign codes are 6 letters and numbers.");return}
  if(!S.core.joined.some(j=>j.code===code))S.core.joined.unshift({code,name:""});
  S.core.activeJoin=code;commit("core");openJoin(code);
}

          const c2=S.camps[camp0.id]||(S.camps[camp0.id]={players:[],combat:blankCombat()});
          if(c2.players.length>=30){st.textContent="This campaign is full.";return}
          const np=P(Object.assign({},d.p,{id:uid(),name:String(d.p.name||"New hero").slice(0,60),ex:false}));
          c2.players.push(np);commit("camp_"+camp0.id);render();
          setTimeout(()=>{relayRun(cc=>cc.publish(T,"",{qos:1,retain:true}),5000).catch(()=>{})},300);
          st.innerHTML=`Imported <b>${esc(np.name)}</b> into ${esc(camp0.name)}.`;st.style.color="var(--heal)";inp.value="";
        });
        c.subscribe(T,{qos:1});
      },9000).catch(()=>{st.textContent="Couldn't reach the internet. Check your connection and try again.";st.style.color="var(--warn)"});
      setTimeout(()=>{if(!got){st.textContent="No character found for that code. Check it, or ask the player to make a new one.";st.style.color="var(--warn)"}},8500);
    };
  });
}

const toast=document.getElementById("toast");let tt;
function toastMsg(t){toast.innerHTML=`<span style="color:var(--ink)">${esc(t)}</span>`;toast.classList.add("on");clearTimeout(tt);tt=setTimeout(()=>toast.classList.remove("on"),3600)}
function rollCheck(p,a){
  const m=mod(p.abil[a]),d=1+Math.floor(Math.random()*20),t=d+m;
  toast.innerHTML=`<b>${t}</b><span>${a.toUpperCase()} check<br><span class="${d===20?"crit":d===1?"fumble":""}">d20 ${d}${d===20?" natural 20":d===1?" natural 1":""}</span> ${sg(m)}</span>`;
  toast.classList.add("on");clearTimeout(tt);tt=setTimeout(()=>toast.classList.remove("on"),3200);
}

/* ---------- DM Live: campaign blocks, live transcription, AI updates, NPCs, timeline and journey ----------
   Lives inside the Dungeon Master tab. The party and combat are Table Keeper's own data.
   Shared notes (NPCs, timeline, journey) are kept on the campaign (camp.live) so they travel with it;
   the transcript and change log stay on this device (tk.live.<campaignId>). */
const nrm=s=>String(s||"").toLowerCase().replace(/[^a-z0-9 ]/g,"").replace(/\s+/g," ").trim();
const hhmm=t=>new Date(t).toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"});
const dstr=t=>new Date(t).toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"});
const EVT={
  plot:{label:"Plot",icon:"📜",c:"#cfa65c"},combat:{label:"Combat",icon:"⚔️",c:"#c4513f"},npc:{label:"NPC",icon:"🗣️",c:"#7fa9cf"},
  loot:{label:"Loot",icon:"💰",c:"#e0c04f"},location:{label:"Location",icon:"🗺️",c:"#79b06e"},quest:{label:"Quest",icon:"🎯",c:"#a98bd6"},
  rest:{label:"Rest",icon:"🏕️",c:"#7fb3b0"},death:{label:"Death",icon:"💀",c:"#9a9a9a"}
};
const SURV=["food","water","warmth","sleep"];
const DL_MODELS=[["claude-sonnet-5-5","Claude Sonnet 5.5 (recommended)"],["claude-haiku-5-5","Claude Haiku 5.5 (cheapest)"],["claude-opus-5-5","Claude Opus 5.5 (most capable)"]];
let SETL=Object.assign({engine:"free",apiKey:"",model:"claude-sonnet-5-5",interval:4},lsGet("tablekeeper.live.settings")||{});
SETL.interval=clamp(+SETL.interval||4,3,5);
const saveSETL=()=>lsSet("tablekeeper.live.settings",SETL);
let tlFilter=new Set(Object.keys(EVT)),tlQ="",npcQ="";

function DL(){
  const id=S.core.active,c=dmCamp();
  if(!c.live){
    c.live={sessionNo:1,sessionStart:null,survival:false,surv:{},npcs:[],timeline:[],journey:[],story:"",fight:null,fightEnd:false};
    // Bring across notes from the earlier stand-alone DM Live page
    const old=lsGet("tablekeeper.live."+id);
    if(old){
      Object.assign(c.live,{npcs:old.npcs||[],timeline:old.timeline||[],journey:old.journey||[],story:old.story||"",sessionNo:old.sessionNo||1,sessionStart:old.sessionStart||null,survival:!!old.survival});
      for(const k in (old.extras||{}))if(old.extras[k].survival)c.live.surv[k]=old.extras[k].survival;
      const T=ltOf(id);if(!T.transcript.length&&old.transcript){T.transcript=old.transcript;T.processed=old.processed||0;T.feed=old.feed||[];saveLT()}
      lsSet("tablekeeper.live."+id,null);
    }
    if(id)commit(campKey());
  }
  const L=c.live;["npcs","timeline","journey"].forEach(k=>{if(!Array.isArray(L[k]))L[k]=[]});L.surv=L.surv||{};
  return L;
}
const LT={};
function ltOf(id){if(!LT[id])LT[id]=Object.assign({transcript:[],processed:0,feed:[]},lsGet("tk.live."+id)||{});return LT[id]}
let ltTimer=null;
function saveLT(){clearTimeout(ltTimer);ltTimer=setTimeout(()=>{for(const id in LT){try{localStorage.setItem("tk.live."+id,JSON.stringify(LT[id]))}catch(e){toastMsg("Storage is full. End the session to clear the transcript.")}}},500)}
const dlSave=()=>commit(campKey());

/* ---- Timeline ---- */
function evOk(e){if(!tlFilter.has(e.type))return false;const q=nrm(tlQ);if(!q)return true;return nrm([e.title,e.detail,(e.who||[]).join(" "),(e.monsters||[]).map(m=>m.name).join(" ")].join(" ")).includes(q)}
function timelineHTML(L){
  return `<div class="dl-sec-h"><h2>Timeline</h2><input type="search" data-dlq="tl" value="${esc(tlQ)}" placeholder="Search events, people, monsters" aria-label="Search the timeline"><button class="btn gold" data-act="dlEv">+ Event</button></div>

}
function trackHTML(L){
  if(!L.timeline.length)return `<div class="empty" style="margin:16px"><h2>Nothing yet</h2><p>The timeline fills up as you play. Start listening, or add an event yourself.</p></div>`;

  if(!evs.length)return `<p class="hint" style="padding:20px">Nothing matches those filters.</p>`;
  let h=`<div class="dl-tl">`,last=null,i=0;
  for(const e of evs){
    if(e.session!==last){last=e.session;i=0;const j=L.journey.find(x=>x.session===e.session);

  }
  return h+`</div>`;
}
function stripHTML(L){
  const evs=L.timeline.filter(e=>["location","combat","plot","quest","death"].includes(e.type)).slice(-6);
  return evs.length?evs.map(e=>{const t=EVT[e.type]||EVT.plot;return `<button class="dl-ev dl-ev-mini" style="--c:${t.c}" data-eid="${e.id}" data-act="dlEvTap"><b>${t.icon} ${esc(e.title)}</b></button>`}).join(""):`<span class="dl-faint">Big moments appear here as they happen.</span>`;
}
function evSheet(id){
