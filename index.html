    ${J.length?`<div class="f"><span class="lbl">Campaigns you've joined</span><div class="picks">${J.map(j=>`<button type="button" class="btn" data-j="${esc(j.code)}" style="justify-content:space-between"><span>${esc(j.name||"Campaign")} <span class="num" style="color:var(--muted)">${esc(j.code)}</span></span><span>Add</span></button>`).join("")}</div></div>`
      :`<p class="hint" style="margin:0;color:var(--muted)">Join your DM's campaign on the <b>My campaigns</b> tab, or give your DM an import code.</p>`}
    <p class="hint" id="shStatus" style="margin:0" hidden></p>
    <div class="f" style="border-top:1px dashed var(--line);padding-top:12px"><span class="lbl">Or use an import code</span>
      <p class="hint" style="margin:0">Your DM types it on their DM screen under <b>Import player</b>.</p>
      <div id="impBox"><button type="button" class="btn" id="mkCode">Get an import code</button></div></div>
    <div class="foot"><span></span><button class="btn gold" id="shDone">Done</button></div></div>`,b=>{
    b.querySelector("#shDone").onclick=closeSheet;
    const st=(t,c)=>{const el=b.querySelector("#shStatus");el.hidden=false;el.innerHTML=t;el.style.color=c||"var(--muted)"};
    b.querySelectorAll("[data-j]").forEach(btn=>btn.onclick=()=>{
      const code=btn.dataset.j,copy=JSON.parse(JSON.stringify(p));copy.id=uid();copy.ex=false;
      st("Sending…");let ok=false;
      relayRun(c=>c.publish(TOPIC(code)+"/add/"+copy.id,JSON.stringify({t:"char",p:copy}),{qos:1,retain:true},err=>{if(!err&&!ok){ok=true;
        const j=J.find(x=>x.code===code);st(`Sent to <b>${esc(j&&j.name||code)}</b>. It appears on the DM's screen when their app is open.`,"var(--heal)")}}),12000)
        .catch(()=>st("Couldn't reach the internet. Check your connection.","var(--warn)"));
    });
    b.querySelector("#mkCode").onclick=()=>{
      const code=newCode(),copy=JSON.parse(JSON.stringify(p));copy.id=uid();copy.ex=false;
      b.querySelector("#impBox").innerHTML=`<div class="code-big num" style="margin-top:6px">${code}</div><p class="hint" id="shareStatus" style="margin:6px 0 0;color:var(--warn)">Getting the code ready…</p>`;
      let ok=0;
      relayRun(c=>c.publish(CHAR_TOPIC(code),JSON.stringify({t:"char",p:copy}),{qos:1,retain:true},err=>{
        const el=document.getElementById("shareStatus");if(!el||err)return;ok++;el.textContent="Ready. The code works once, on any network.";el.style.color="var(--heal)";
      }),15000).catch(()=>{});
      setTimeout(()=>{const el=document.getElementById("shareStatus");if(el&&!ok)el.textContent="Couldn't reach the import service. Check your connection and try again."},12000);
    };
  });
}
function addMineSheet(){
  if(!isClient())return;
  openSheet(`<h2>Add one of my characters</h2><div class="stack">
    <div class="picks">${S.chars.map(c=>`<button type="button" class="btn" data-c="${c.id}" style="justify-content:space-between"><span>${esc(c.name)} <span style="color:var(--muted)">${esc(subline(c))}</span></span><span>Add</span></button>`).join("")}</div>
    <p class="hint" style="margin:0">A copy goes into ${esc(CL.camp.name||"the campaign")}. Your own sheet stays on this phone.</p>
    <div class="foot"><span></span><button class="btn" id="amDone">Close</button></div></div>`,b=>{
    b.querySelector("#amDone").onclick=closeSheet;
    b.querySelectorAll("[data-c]").forEach(btn=>btn.onclick=()=>{
      const src=findChar(btn.dataset.c);if(!src)return;
      const copy=JSON.parse(JSON.stringify(src));copy.id=uid();copy.ex=false;
      pubOn(CL.clients,TOPIC(CL.code)+"/add/"+copy.id,{t:"char",p:copy},true);
      CL.camp.players.push(copy);CL.snap[copy.id]=JSON.stringify(copy);
      toastMsg(copy.name+" added");closeSheet();
    });
  });
}
function importSheet(){
  const camp0=activeMeta();if(!camp0)return;
  openSheet(`<h2>Import player</h2><form class="stack" id="impf">
    <p class="hint" style="margin:0;color:var(--muted)">Ask the player to open their character on the <b>Player</b> tab, tap <b>Add to a campaign</b>, then <b>Get an import code</b>. Type their code here.</p>
    <div class="join-row"><input type="text" id="imp-code" maxlength="7" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="ABC123" aria-label="Import code"><button class="btn gold">Import</button></div>
    <p class="hint" id="impStatus" style="margin:0">Adds to <b>${esc(camp0.name)}</b>.</p>
    <div class="foot"><span></span><button type="button" class="btn" id="impDone">Close</button></div></form>`,b=>{
    const inp=b.querySelector("#imp-code"),st=b.querySelector("#impStatus");setTimeout(()=>inp.focus(),250);
    b.querySelector("#impDone").onclick=closeSheet;
    b.querySelector("#impf").onsubmit=e=>{e.preventDefault();
      const code=inp.value.toUpperCase().replace(/[^A-Z0-9]/g,"");
      if(code.length!==6){st.textContent="Codes are 6 letters and numbers.";st.style.color="var(--warn)";return}
      st.textContent="Looking for that character…";st.style.color="var(--muted)";
      let got=false;const T=CHAR_TOPIC(code);
      relayRun(c=>{
        c.on("message",(t,buf)=>{
          if(got||t!==T)return;
          const txt=new TextDecoder().decode(buf);if(!txt)return;
          let d;try{d=JSON.parse(txt)}catch(err){return}
          if(!d||d.t!=="char"||!d.p||typeof d.p!=="object")return;
          got=true;
          const c2=S.camps[camp0.id]||(S.camps[camp0.id]={players:[],combat:blankCombat()});
          if(c2.players.length>=30){st.textContent="This campaign is full.";return}
          const np=P(Object.assign({},d.p,{id:uid(),name:String(d.p.name||"New hero").slice(0,60),ex:false}));
          c2.players.push(np);commit("camp_"+camp0.id);render();
          setTimeout(()=>{relayRun(cc=>cc.publish(T,"",{qos:1,retain:true}),5000).catch(()=>{})},300);
          st.innerHTML=`Imported <b>${esc(np.name)}</b> into ${esc(camp0.name)}.`;st.style.color="var(--heal)";inp.value="";
        });
        c.subscribe(T,{qos:1});
      },9000).catch(()=>{st.textContent="Couldn't reach the internet. Check your connection and try again.";st.style.color="var(--warn)"});
      setTimeout(()=>{if(!got){st.textContent="No character found for that code. Check it, or ask the player to make a new one.";st.style.color="var(--warn)"}},8500);
    };
  });
}

const toast=document.getElementById("toast");let tt;
function toastMsg(t){toast.innerHTML=`<span style="color:var(--ink)">${esc(t)}</span>`;toast.classList.add("on");clearTimeout(tt);tt=setTimeout(()=>toast.classList.remove("on"),3600)}
function rollCheck(p,a){
  const m=mod(p.abil[a]),d=1+Math.floor(Math.random()*20),t=d+m;
  toast.innerHTML=`<b>${t}</b><span>${a.toUpperCase()} check<br><span class="${d===20?"crit":d===1?"fumble":""}">d20 ${d}${d===20?" natural 20":d===1?" natural 1":""}</span> ${sg(m)}</span>`;
  toast.classList.add("on");clearTimeout(tt);tt=setTimeout(()=>toast.classList.remove("on"),3200);
}

/* ---------- Events ---------- */
const MODES=["dm","player","camps"];
function setMode(m){
  if(m===S.core.mode)return;
  S.core.mode=m;commit("core");
  if(m==="camps"&&S.core.activeJoin&&!CL.code)openJoin(S.core.activeJoin);
  if(m==="dm")startHost();
  render();window.scrollTo(0,0);
}
document.getElementById("switch").addEventListener("click",e=>{const b=e.target.closest("[data-m]");if(b)setMode(b.dataset.m)});
// Swipe on the switch to slide between modes
(function(){let x0=null;const sw=document.getElementById("switch");
  sw.addEventListener("touchstart",e=>{x0=e.touches[0].clientX},{passive:true});
  sw.addEventListener("touchend",e=>{if(x0==null)return;const dx=e.changedTouches[0].clientX-x0;x0=null;
    if(Math.abs(dx)>30){const i=MODES.indexOf(S.core.mode);setMode(MODES[clamp(i+(dx>0?1:-1),0,2)])}});
})();

document.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]");if(!b)return;
  const act=b.dataset.act,id=b.dataset.id||(b.closest("[data-id]")&&b.closest("[data-id]").dataset.id);
  const p=id?findP(id):null;
  switch(act){
    case "dmg1":damage(p,1);commit(keyFor(id));render();break;
    case "heal1":heal(p,1);commit(keyFor(id));render();break;
    case "pad":padSheet(p);break;
    case "conds":condSheet(p);break;
    case "items":itemsSheet(p);break;
    case "edit":editSheet(p,false);break;
    case "add":editSheet(P({name:""}),true,"camp");break;
    case "newChar":editSheet(P({name:""}),true,"char");break;
    case "openChar":S.core.view=b.dataset.id;commit("core");render();window.scrollTo(0,0);break;
    case "backChars":S.core.view=null;commit("core");render();break;
    case "shareChar":shareSheet(p);break;
    case "campEdit":campSheet();break;
    case "newCamp":newCampSheet();break;
    case "openCamp":openCampSheet();break;
    case "codeInfo":codeSheet();break;
    case "livepill":if(S.core.mode==="camps"&&CL.code)break;if(H.code){if(S.core.mode!=="dm")setMode("dm");codeSheet()}break;
    case "importP":importSheet();break;
    case "openJoin":S.core.activeJoin=b.dataset.code;commit("core");openJoin(b.dataset.code);window.scrollTo(0,0);break;
    case "backJoin":S.core.activeJoin=null;commit("core");closeJoin();render();break;
    case "forgetJoin":{const c=b.dataset.code;S.core.joined=S.core.joined.filter(j=>j.code!==c);if(S.core.activeJoin===c){S.core.activeJoin=null;closeJoin()}commit("core");render();break;}
    case "retry":if(CL.code){const c=CL.code;closeJoin();openJoin(c)}break;
    case "addMine":addMineSheet();break;
    case "roll":if(p)rollCheck(p,b.dataset.a);break;
    case "slots":slotSheet(p);break;
    case "cStart":startCombat();break;
    case "cParty":addParty();break;
    case "cMon":monSheet();break;
    case "cNext":step(1);break;
    case "cPrev":step(-1);break;
    case "cRoll":CB().list.forEach(e=>{if(e.kind==="m")e.init=d20()+(e.dex||0)});commit(campKey());render();break;
    case "cInit":{const e=CB().list.find(x=>x.id===b.dataset.cid);if(e)initSheet(e);break;}
    case "cInfo":{const e=CB().list.find(x=>x.id===b.dataset.cid);if(e)infoSheet(e);break;}
    case "cDel":removeCombatant(b.dataset.cid);render();break;
    case "cEnd":
      if(b.dataset.armed!=="1"){b.dataset.armed="1";b.textContent="Tap again to end";setTimeout(()=>{if(b.isConnected){b.dataset.armed="";b.textContent="End combat"}},3000);break}
      endCombat();break;
    case "spells":spellSheet(p);break;
    case "pip":{const s=slotsOf(p)[+b.dataset.lv];s.used=clamp(s.used+(b.dataset.on==="1"?1:-1),0,s.max);commit(keyFor(id));render();break;}
    case "rest":p.hp=p.max;p.temp=0;p.conds=p.conds.filter(c=>c!=="Unconscious");restoreSlots(p);commit(keyFor(id));render();break;
    case "longrest":dmCamp().players.forEach(q=>{q.hp=q.max;q.temp=0;q.conds=q.conds.filter(c=>c!=="Unconscious");restoreSlots(q)});commit(campKey());render();break;
    case "iq+":case "iq-":case "idel":{
      const row=b.closest("[data-item]"),q=findP(row.dataset.id),i=q.items.find(x=>x.id===row.dataset.item);
      if(act==="idel")q.items=q.items.filter(x=>x!==i);else i.q=Math.max(1,i.q+(act==="iq+"?1:-1));
      commit(keyFor(q.id));
      if(sheet.classList.contains("on"))itemsSheet(q);else render();
      break;}
  }
});
document.addEventListener("submit",async e=>{
  const jf=e.target.closest('[data-form="join"]');if(jf){e.preventDefault();joinCode(jf.querySelector("input").value);return}
  const lf=e.target.closest('[data-form="unlock"],[data-form="setpw"]');
  if(lf){e.preventDefault();
    const meta=activeMeta(),pw=lf.querySelector("#pw1").value,msg=lf.querySelector("#pwMsg"),say=t=>{msg.hidden=false;msg.textContent=t};
    if(!meta)return;
    if(lf.dataset.form==="setpw"){
      if(pw.length<4){say("Use at least 4 characters.");return}
      if(pw!==lf.querySelector("#pw2").value){say("The two passwords don't match.");return}
      await setPassword(meta,pw);
    }else{
      if(!pw){say("Enter the password.");return}
      say("Checking…");
      if(!(await unlockCamp(meta,pw))){say("That password isn't right.");return}
    }
    startHost();render();return;
  }
  const f=e.target.closest('[data-form="additem"]');if(!f)return;e.preventDefault();
  const inp=f.querySelector("input"),n=inp.value.trim();if(!n)return;
  const p=findP(f.dataset.id);
  const m=n.match(/^(.*?)\s*[x×]\s*(\d+)$/i);
  p.items.push(m?it(m[1],+m[2]):it(n));commit(keyFor(p.id));
  if(sheet.classList.contains("on")){itemsSheet(p);setTimeout(()=>{const x=document.getElementById("sheet-newitem");x&&x.focus()},50)}
  else{render();const x=document.getElementById("me-newitem");x&&x.focus()}
});
document.addEventListener("change",e=>{
  if(e.target.id==="campSel"){
    const v=e.target.value;
    if(v==="__new"||v==="__open"){e.target.value=S.core.active;v==="__new"?newCampSheet():openCampSheet();return}
    S.core.active=v;commit("core");stopHost();startHost();render();return;
  }
  if(e.target.matches("[data-iname]")){const row=e.target.closest("[data-item]"),q=findP(row.dataset.id),i=q.items.find(x=>x.id===row.dataset.item);
    i.n=e.target.value.trim()||i.n;commit(keyFor(q.id));}
});
let nt;
document.addEventListener("focusout",()=>{if(renderHeld)setTimeout(()=>{if(renderHeld)render()},50)});
document.addEventListener("input",e=>{
  if(e.target.dataset.notes){const p=findP(e.target.dataset.notes);if(!p)return;p.notes=e.target.value;clearTimeout(nt);nt=setTimeout(()=>commit(keyFor(p.id)),500)}
});

// Keep the screen awake at the table where the phone allows it
async function wake(){try{if(navigator.wakeLock&&document.visibilityState==="visible")await navigator.wakeLock.request("screen")}catch(e){}}
document.addEventListener("visibilitychange",wake);wake();
// Phones pause apps in the background, so reconnect as soon as the app is back on screen
document.addEventListener("visibilitychange",()=>{
  if(document.visibilityState!=="visible")return;
  [...H.clients,...CL.clients].forEach(c=>{if(!c.connected){try{c.reconnect()}catch(e){}}});
  if(H.code)scheduleBroadcast();
  if(CL.code)pubOn(CL.clients,TOPIC(CL.code)+"/hi",{id:CL.me,need:true});
});

render();
setTimeout(connect,0);
restoreKeys().then(()=>{startHost();render()});
if(S.core.activeJoin)openJoin(S.core.activeJoin);
})();
</script>

<script>if("serviceWorker" in navigator){addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}</script>
