function plByName(name){
  const ps=dmCamp().players,n=nrm(name);if(!n)return null;const f=n.split(" ")[0];
  return ps.find(p=>nrm(p.name)===n)||ps.find(p=>nrm(p.name).split(" ")[0]===f)||ps.find(p=>nrm(p.name).includes(n)||n.includes(nrm(p.name)));
}
function monByName(name){
  const C=dmCamp().combat;if(!C.active)return null;const n=nrm(name),ms=C.list.filter(e=>e.kind==="m");
  return ms.find(e=>nrm(e.name)===n)||ms.find(e=>nrm(e.name).startsWith(n)&&e.hp>0)||ms.find(e=>nrm(e.base||"")===n&&e.hp>0);
}
function npcByName(name){const L=DL(),n=nrm(name);if(!n)return null;const f=n.split(" ")[0];return L.npcs.find(x=>nrm(x.name)===n)||(f.length>2?L.npcs.find(x=>nrm(x.name).split(" ")[0]===f):null)}
function canonCond(c){c=String(c||"").trim();if(!c)return "";return CONDS.find(x=>x.toLowerCase()===c.toLowerCase())||c[0].toUpperCase()+c.slice(1)}
function applyChange(c){
  const L=DL(),why=c.reason||"",t=c.type;
  const E=(text,undo)=>({id:uid(),ts:Date.now(),text,why,undo});

    const m=monByName(c.target);if(!m)return null;const a=+c.amount||0;if(!a)return null;
    const b={hp:m.hp,temp:m.temp||0};if(a<0)damage(m,-a);else heal(m,a);
    return E(`${a<0?"🗡️":"💚"} ${m.name} ${a<0?"takes "+(-a):"heals "+a} (HP ${b.hp} → ${m.hp})`,{k:"mon",mid:m.id,dH:m.hp-b.hp,dT:(m.temp||0)-b.temp});
  }
  if(t==="combat_start"){if(dmCamp().combat.active)return null;L.fight={ts:Date.now(),monsters:(c.monsters||[]).filter(m=>m&&m.name).map(m=>({name:m.name,count:Math.max(1,+m.count||1),ac:+m.ac||0,hp:+m.hp||0}))};return E("⚔️ Fight detected: ready to start combat",{k:"fight"})}
  if(t==="combat_end"){if(!dmCamp().combat.active)return null;L.fightEnd=true;return null}
  if(t==="rest"){
    const ps=dmCamp().players,before=ps.map(p=>({id:p.id,hp:p.hp,temp:p.temp,conds:[...p.conds],slots:JSON.parse(JSON.stringify(slotsOf(p))),surv:L.surv[p.id]?{...L.surv[p.id]}:null}));
    if(c.kind==="long"){ps.forEach(p=>{p.hp=p.max;p.temp=0;p.conds=p.conds.filter(x=>x!=="Unconscious");restoreSlots(p);if(L.survival){L.surv[p.id]=Object.assign({food:5,water:5,warmth:5,sleep:5},L.surv[p.id]);L.surv[p.id].sleep=5}});
      return E("🏕️ Long rest: HP and spell slots restored for everyone",{k:"rest",before})}
    return E("☕ Short rest taken (add hit dice healing yourself)",{k:"none"});
  }
  if(t==="npc_add"){
    const name=String(c.name||"").trim();if(!name)return null;const ex=npcByName(name);
    if(ex){const old=JSON.parse(JSON.stringify(ex));["role","location","background"].forEach(f=>{if(c[f]&&!ex[f])ex[f]=c[f]});if(c.attitude)ex.attitude=c.attitude;
      (c.items||[]).forEach(i=>{if(!ex.items.some(x=>nrm(x)===nrm(i)))ex.items.push(i)});if(c.notes)ex.notes=(ex.notes?ex.notes+"\n":"")+c.notes;
      return E(`🗣️ Updated NPC ${ex.name}`,{k:"npcR",old})}
    const n={id:uid(),name,role:c.role||"",location:c.location||"",attitude:["friendly","neutral","hostile"].includes(c.attitude)?c.attitude:"neutral",status:"alive",background:c.background||"",items:Array.isArray(c.items)?c.items:[],notes:c.notes||"",firstSeen:L.sessionNo};

  }
  if(t==="npc_update"){
    const n=npcByName(c.name);if(!n)return null;const old=JSON.parse(JSON.stringify(n)),f=c.field,v=String(c.value??"");
    if(f==="notes"||f==="background")n[f]=(n[f]?n[f]+"\n":"")+v;
    else if(f==="items_add"){if(!n.items.some(x=>nrm(x)===nrm(v)))n.items.push(v)}
    else if(f==="items_remove")n.items=n.items.filter(x=>nrm(x)!==nrm(v));

    return E(`🗣️ ${n.name}: ${f.replace("_"," ")} → ${v.slice(0,80)}`,{k:"npcR",old});
  }
  const p=plByName(c.target);if(!p)return null;
  if(t==="hp"||t==="set_hp"){
    const a=t==="set_hp"?(+c.value)-p.hp:+c.amount;if(!a||isNaN(a))return null;
    const b={hp:p.hp,temp:p.temp,conds:[...p.conds]};if(a<0)damage(p,-a);else heal(p,a);
    if(p.hp===b.hp&&p.temp===b.temp)return null;
    return E(`${a<0?"🩸":"💚"} ${p.name} ${a<0?"takes "+(-a):"heals "+a} (HP ${b.hp} → ${p.hp}${p.temp!==b.temp?", temp "+b.temp+" → "+p.temp:""})`,{k:"hp",pid:p.id,dH:p.hp-b.hp,dT:p.temp-b.temp,conds:b.conds});
  }
  if(t==="temp_hp"){const b=p.temp;p.temp=Math.max(b,+(c.value??c.amount)||0);if(p.temp===b)return null;return E(`🛡️ ${p.name} gains temp HP (${b} → ${p.temp})`,{k:"hp",pid:p.id,dH:0,dT:p.temp-b})}

    return E(`✨ ${p.name} ${d>0?"uses":"regains"} ${Math.abs(d)} level ${L1} slot${Math.abs(d)>1?"s":""} (${s.max-s.used}/${s.max} left)${c.spell?": "+c.spell:""}`,{k:"slot",pid:p.id,i:L1-1,d})}
  if(t==="item_add"){const name=String(c.item||"").trim();if(!name)return null;const q=Math.max(1,+c.qty||1);let i=p.items.find(x=>nrm(x.n)===nrm(name));
    if(i)i.q+=q;else{i=it(name,q);if(c.kind==="weapon")i.k="weapon";p.items.push(i)}
    return E(`🎒 ${p.name} gets ${name}${q>1?" ×"+q:""}`,{k:"iA",pid:p.id,iid:i.id,q})}
  if(t==="item_remove"){const n=nrm(c.item);const i=p.items.find(x=>nrm(x.n)===n)||p.items.find(x=>nrm(x.n).includes(n)||n.includes(nrm(x.n)));if(!i)return null;
    const q=Math.min(i.q,Math.max(1,+c.qty||1)),copy={...i,q};i.q-=q;if(i.q<=0)p.items=p.items.filter(x=>x!==i);
    return E(`📤 ${p.name} loses ${i.n}${q>1?" ×"+q:""}`,{k:"iR",pid:p.id,item:copy})}
  if(t==="gold"){const d=+c.amount||0;if(!d)return null;const b=p.gold||0;p.gold=b+d;return E(`💰 ${p.name} ${d>0?"gains":"spends"} ${Math.abs(d)} gp (${b} → ${p.gold})`,{k:"gold",pid:p.id,d})}
  if(t==="condition_add"){const cd=canonCond(c.condition);if(!cd||p.conds.some(x=>x.toLowerCase()===cd.toLowerCase()))return null;p.conds.push(cd);return E(`⚠️ ${p.name} is ${cd.toLowerCase()}`,{k:"cA",pid:p.id,cd})}
  if(t==="condition_remove"){const n=String(c.condition||"").toLowerCase(),had=p.conds.find(x=>x.toLowerCase()===n);if(!had)return null;p.conds=p.conds.filter(x=>x!==had);return E(`✅ ${p.name} is no longer ${had.toLowerCase()}`,{k:"cR",pid:p.id,cd:had})}
  if(t==="survival"){const k=String(c.stat||"").toLowerCase();if(!SURV.includes(k))return null;const s=L.surv[p.id]=Object.assign({food:5,water:5,warmth:5,sleep:5},L.surv[p.id]);
    const b=s[k];s[k]=clamp(b+(+c.amount||0),0,5);const d=s[k]-b;if(!d)return null;return E(`🍖 ${p.name} ${k} ${b} → ${s[k]}`,{k:"surv",pid:p.id,stat:k,d})}
  return null;
}

function undo(fid){
  const T=ltOf(S.core.active),f=T.feed.find(x=>x.id===fid);if(!f||f.undone)return;
  const u=f.undo,L=DL(),ps=dmCamp().players,p=u.pid?ps.find(x=>x.id===u.pid):null;
  switch(u.k){
    case "hp":if(p){p.hp=clamp(p.hp-u.dH,0,p.max);p.temp=Math.max(0,p.temp-u.dT);if(u.conds)p.conds=u.conds}break;
    case "mon":{const m=dmCamp().combat.list.find(e=>e.id===u.mid);if(m){m.hp=clamp(m.hp-u.dH,0,m.max);m.temp=Math.max(0,(m.temp||0)-u.dT)}break}
    case "slot":if(p){const s=slotsOf(p)[u.i];s.used=clamp(s.used-u.d,0,s.max)}break;
    case "iA":if(p){const i=p.items.find(x=>x.id===u.iid);if(i){i.q-=u.q;if(i.q<=0)p.items=p.items.filter(x=>x!==i)}}break;
    case "iR":if(p){const i=p.items.find(x=>x.id===u.item.id);if(i)i.q+=u.item.q;else p.items.push(u.item)}break;
    case "gold":if(p)p.gold=(p.gold||0)-u.d;break;
    case "cA":if(p)p.conds=p.conds.filter(x=>x!==u.cd);break;
    case "cR":if(p&&!p.conds.includes(u.cd))p.conds.push(u.cd);break;
    case "surv":if(p&&L.surv[p.id])L.surv[p.id][u.stat]=clamp(L.surv[p.id][u.stat]-u.d,0,5);break;
    case "rest":u.before.forEach(b=>{const q=ps.find(x=>x.id===b.id);if(q){q.hp=b.hp;q.temp=b.temp;q.conds=b.conds;q.slots=b.slots;if(b.surv)L.surv[q.id]=b.surv}});break;
    case "npcA":L.npcs=L.npcs.filter(n=>n.id!==u.id);break;
    case "npcR":{const i=L.npcs.findIndex(n=>n.id===u.old.id);if(i>=0)L.npcs[i]=u.old;break}
    case "ev":L.timeline=L.timeline.filter(e=>e.id!==u.id);break;
    case "fight":L.fight=null;break;
  }
  f.undone=true;saveLT();dlSave();render();
}

  rec.onresult=e=>{let im="";for(let i=e.resultIndex;i<e.results.length;i++){const r=e.results[i];if(r.isFinal)addLine(r[0].transcript,micCamp);else im+=r[0].transcript}interim=im;refreshTx()};
  rec.onerror=e=>{if(e.error==="not-allowed"||e.error==="service-not-allowed"){wantListen=false;render();toastMsg("Microphone blocked. Allow it from the padlock in the address bar.")}else if(e.error==="network")toastMsg("Speech service unreachable. Check the internet connection.")};

const SYS_LIVE=`You are the live note-taker for a Dungeons & Dragons 5e Dungeon Master. You get the game state and a new chunk of an automatic speech-to-text transcript of the table. It has no speaker labels and contains mishearings of fantasy names, crosstalk and out-of-character chat. Lines starting [DM note] were typed by the DM and are reliable.

Work out what CHANGED in the game during the NEW chunk only, and return JSON. Be conservative: record only things that clearly happened. Ignore rules talk, jokes, hypotheticals ("if I attack…") and anything already in the state or timeline. Match names to the listed characters, monsters and NPCs even if misspelt. Never invent numbers: if damage is described without a number, don't change HP.

Return ONLY a JSON object: {"changes":[...],"events":[...]}

Changes (use exact names from the state as "target"):
{"type":"hp","target":"Hero","amount":-7,"reason":"short why"}   negative = damage, positive = healing
{"type":"set_hp","target":"Hero","value":14,"reason":"..."}       when current HP is stated
{"type":"temp_hp","target":"Hero","value":5,"reason":"..."}
{"type":"spell_slot","target":"Hero","level":2,"amount":1,"spell":"Misty Step","reason":"..."}   1 = used, -1 = regained
{"type":"item_add","target":"Hero","item":"Silver key","qty":1,"kind":"item|weapon","reason":"..."}
{"type":"item_remove","target":"Hero","item":"Healing potion","qty":1,"reason":"..."}
{"type":"gold","target":"Hero","amount":25,"reason":"..."}   negative = spent
{"type":"condition_add","target":"Hero","condition":"Poisoned","reason":"..."}
{"type":"condition_remove","target":"Hero","condition":"Poisoned","reason":"..."}
{"type":"rest","kind":"short|long","reason":"..."}
{"type":"npc_add","name":"NPC","role":"who they are","location":"where","attitude":"friendly|neutral|hostile","background":"what was learned","items":["..."],"notes":"..."}
{"type":"npc_update","name":"NPC","field":"notes|background|attitude|status|location|role|items_add|items_remove","value":"..."}   status alive|dead|missing
{"type":"combat_start","monsters":[{"name":"Goblin","count":3,"ac":15,"hp":7}],"reason":"..."}   ONLY when no combat is active and initiative is rolled or a fight clearly begins. Use singular 5e monster names; include ac and hp from the 5e stat block if you know them.
{"type":"monster_hp","target":"Goblin B","amount":-6,"reason":"..."}   ONLY while combat is active, using a monster name from the list
{"type":"combat_end","reason":"..."}   when combat is active and the fight clearly ends
SURVIVAL_LINE

Events for the visual timeline (only meaningful moments, usually 0-4 per chunk):
{"type":"plot|combat|npc|loot|location|quest|rest|death","title":"max 6 words","detail":"1-3 sentences","who":["names"],"monsters":[{"name":"Goblin","count":3,"outcome":"defeated|fled|ongoing|spared"}]}

async function processChunk(force){
  if(busy)return;
  const id=S.core.active,T=ltOf(id),end=T.transcript.length,lines=T.transcript.slice(T.processed,end);
  if(!lines.length){if(force)toastMsg("Nothing new to check");nextCheck=Date.now()+SETL.interval*60000;return}
  if(!SETL.apiKey){if(force)toastMsg("Add your Anthropic API key in Live setup to turn on the AI");return}
  busy=true;const st=document.getElementById("dlAiSt");if(st)st.innerHTML=aiStatus();
  const ctx=T.transcript.slice(Math.max(0,T.processed-8),T.processed).map(l=>`[${hhmm(l.t)}] ${l.x}`).join("\n");
  const user=`${stateText()}\n\nEARLIER TRANSCRIPT (already processed, context only, do NOT re-apply):\n${ctx||"(start of session)"}\n\nNEW TRANSCRIPT CHUNK (process this):\n${lines.map(l=>`[${hhmm(l.t)}] ${l.x}`).join("\n")}`;
  const sys=SYS_LIVE.replace("SURVIVAL_LINE",DL().survival?`{"type":"survival","target":"Hero","stat":"food|water|warmth|sleep","amount":-1,"reason":"..."}   scale 0-5, 5 = fine`:"");
  try{
    const out=parseJSON(await askClaude(sys,user,3000));
    if(S.core.active!==id)throw new Error("Campaign changed while the AI was reading");
    const list=[];
    for(const c of (out.changes||[])){try{list.push(applyChange(c))}catch(err){console.warn(err)}}
    for(const ev of (out.events||[]))list.push(addEvent(ev));
    T.processed=Math.max(T.processed,end);fails=0;
    pushFeed(list);dlSave();remoteTick=true;render();
    if(force&&!list.filter(Boolean).length)toastMsg("Checked: no changes found");
  }catch(err){fails++;toastMsg("AI check failed: "+err.message)}
  finally{busy=false;nextCheck=Date.now()+SETL.interval*60000*Math.min(4,2**fails);const s2=document.getElementById("dlAiSt");if(s2)s2.innerHTML=aiStatus()}
}

  const m=n.match(/^(.*?)\s*[x×]\s*(\d+)$/i);
  p.items.push(m?it(m[1],+m[2]):it(n));commit(keyFor(p.id));
  if(sheet.classList.contains("on")){itemsSheet(p);setTimeout(()=>{const x=document.getElementById("sheet-newitem");x&&x.focus()},50)}
  else{render();const x=document.getElementById("me-newitem");x&&x.focus()}
});
document.addEventListener("change",e=>{
  if(e.target.dataset&&e.target.dataset.dlset){setChange(e.target);return}
  if(e.target.id==="campSel"){
    const v=e.target.value;
    if(v==="__new"||v==="__open"){e.target.value=S.core.active;v==="__new"?newCampSheet():openCampSheet();return}
    S.core.active=v;commit("core");stopHost();startHost();render();return;
  }
  if(e.target.matches("[data-iname]")){const row=e.target.closest("[data-item]"),q=findP(row.dataset.id),i=q.items.find(x=>x.id===row.dataset.item);
    i.n=e.target.value.trim()||i.n;commit(keyFor(q.id));}
});
let nt;
document.addEventListener("focusout",()=>{if(renderHeld)setTimeout(()=>{if(renderHeld)render()},50)});
document.addEventListener("input",e=>{
  if(e.target.dataset&&e.target.dataset.dlq){const L=DL();if(e.target.dataset.dlq==="npc"){npcQ=e.target.value;const x=document.getElementById("dlNpcList");if(x)x.innerHTML=npcListHTML(L)}else{tlQ=e.target.value;const x=document.getElementById("dlTl");if(x)x.innerHTML=trackHTML(L)}return}
  if(e.target.dataset.notes){const p=findP(e.target.dataset.notes);if(!p)return;p.notes=e.target.value;clearTimeout(nt);nt=setTimeout(()=>commit(keyFor(p.id)),500)}
});

// Keep the screen awake at the table where the phone allows it
async function wake(){try{if(navigator.wakeLock&&document.visibilityState==="visible")await navigator.wakeLock.request("screen")}catch(e){}}
document.addEventListener("visibilitychange",wake);wake();
// Phones pause apps in the background, so reconnect as soon as the app is back on screen
document.addEventListener("visibilitychange",()=>{
  if(document.visibilityState!=="visible")return;
  [...H.clients,...CL.clients].forEach(c=>{if(!c.connected){try{c.reconnect()}catch(e){}}});
  if(H.code)scheduleBroadcast();
  if(CL.code)pubOn(CL.clients,TOPIC(CL.code)+"/hi",{id:CL.me,need:true});
});

render();
setTimeout(connect,0);
restoreKeys().then(()=>{startHost();render()});
if(S.core.activeJoin)openJoin(S.core.activeJoin);
})();
</script>

<script>if("serviceWorker" in navigator){addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}</script>
